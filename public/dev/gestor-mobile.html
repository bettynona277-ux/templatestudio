function addMonthsISO(value, months=1){
  const base = value ? new Date(value + 'T00:00:00') : new Date();
  if(Number.isNaN(base.getTime())) return todayISO();
  const day = base.getDate();
  const target = new Date(base.getFullYear(), base.getMonth() + months, 1);
  const lastDay = new Date(target.getFullYear(), target.getMonth() + 1, 0).getDate();
  target.setDate(Math.min(day, lastDay));
  return localISO(target);
}

async function trackGestorDailyUsage(user, surface='mobile'){
  if(!user?.uid) return;
  const day = usageDayId();
  const cacheKey = `gestor_usage_${user.uid}_${day}`;
  try{
    if(localStorage.getItem(cacheKey)) return;
    const now = Date.now();
    const userUsage = {
      uid:user.uid,
      email:user.email || '',
      day,
      surface,
      lastSeenAt:now,
      updatedAt:now
    };
    const adminUsage = {
      day,
      updatedAt:now,
      countApprox:increment(1),
      users:{
        [user.uid]:{
          email:user.email || '',
          lastSeenAt:now,
          surfaces:{ [surface]:true }
        }
      }
    };
    await Promise.allSettled([
      setDoc(gestorUsageRef(user.uid, day), userUsage, { merge:true }),
      setDoc(adminGestorUsageRef(day), adminUsage, { merge:true })
    ]);
    localStorage.setItem(cacheKey, String(now));
  }catch(err){
    try{ localStorage.setItem(cacheKey, 'blocked'); }catch(_){}
    console.warn('No se pudo registrar actividad diaria del gestor:', err);
  }
}

function financeMonthStartIso(){
  const now = new Date();
  return new Date(now.getFullYear(), now.getMonth(), 1).toISOString();
}

async function getFinanceMovements(uid, scope='current'){
  const col = financeCol(uid);
  if(scope === 'all'){
    const snap = await getDocs(col);
    return snap.docs.map(d => normalizeFinanceMovement({id:d.id,...d.data()}));
  }
  try{
    const snap = await getDocs(query(
      col,
      where('occurredAt','>=',financeMonthStartIso()),
      orderBy('occurredAt','desc')
    ));
    return snap.docs.map(d => normalizeFinanceMovement({id:d.id,...d.data()}));
  }catch(err){
    console.warn('No se pudo cargar finanzas por periodo; usando carga limitada:', err);
    try{
      const snap = await getDocs(query(col, orderBy('occurredAt','desc'), limit(FINANCE_RECENT_LIMIT)));
      return snap.docs.map(d => normalizeFinanceMovement({id:d.id,...d.data()}));
    }catch(_){
      const snap = await getDocs(query(col, limit(FINANCE_RECENT_LIMIT)));
      return snap.docs.map(d => normalizeFinanceMovement({id:d.id,...d.data()}));
    }
  }
}

const MAX_GESTOR_DEVICES = 5;
const GESTOR_DEVICE_TTL_MS = 7 * 24 * 60 * 60 * 1000;

function getGestorDeviceId(){
  let id = localStorage.getItem('ts_device_id');
  if(!id){
    id = 'dev_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,8);
    localStorage.setItem('ts_device_id', id);
  }
  return id;
}
function detectGestorBrowser(ua=navigator.userAgent || ''){
  if(/Edg/i.test(ua)) return 'Edge';
  if(/OPR|Opera/i.test(ua)) return 'Opera';
  if(/Firefox/i.test(ua)) return 'Firefox';
  if(/Chrome|CriOS/i.test(ua) && !/Edg/i.test(ua)) return 'Chrome';
  if(/Safari/i.test(ua) && !/Chrome|CriOS/i.test(ua)) return 'Safari';
  return 'Navegador';
}
function detectGestorOS(ua=navigator.userAgent || ''){
  if(/iPhone/i.test(ua)) return 'iPhone';
  if(/iPad/i.test(ua)) return 'iPad';
  if(/Android/i.test(ua)) return ua.includes('Mobile') ? 'Android movil' : 'Android tablet';
  if(/Windows/i.test(ua)) return 'Windows PC';
  if(/Mac/i.test(ua)) return 'Mac';
  if(/Linux/i.test(ua)) return 'Linux PC';
  return 'Dispositivo';
}
function getGestorWebGLInfo(){
  try{
    const canvas=document.createElement('canvas');
    const gl=canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
    if(!gl) return {vendor:'',renderer:''};
    const dbg=gl.getExtension('WEBGL_debug_renderer_info');
    return {
      vendor:String((dbg ? gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL) : gl.getParameter(gl.VENDOR)) || ''),
      renderer:String((dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : gl.getParameter(gl.RENDERER)) || '')
    };
  }catch(_){ return {vendor:'',renderer:''}; }
}
function shortGestorGpuName(renderer){
  return String(renderer || '').replace(/^ANGLE\s*\(|\)$/gi,'').replace(/\s*\(.*?\)\s*/g,' ').replace(/Direct3D.*|OpenGL.*|Vulkan.*/gi,'').replace(/\s+/g,' ').trim().slice(0,48);
}
function fallbackGestorHash(str){
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,16777619); }
  return ('00000000'+(h>>>0).toString(16)).slice(-8);
}
async function hashGestorText(str){
  try{
    if(window.crypto?.subtle){
      const buf=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
    }
  }catch(_){}
  return fallbackGestorHash(str);
}
async function buildGestorDeviceFingerprint(){
  const ua=navigator.userAgent || '';
  const webgl=getGestorWebGLInfo();
  const screenInfo=`${screen.width || 0}x${screen.height || 0}`;
  const timezone=Intl.DateTimeFormat().resolvedOptions().timeZone || '';
  const signals={
    userAgent:ua,
    platform:navigator.platform || '',
    language:navigator.language || '',
    languages:Array.from(navigator.languages || []).join(','),
    timezone,
    screen:screenInfo,
    pixelRatio:window.devicePixelRatio || 1,
    hardwareConcurrency:navigator.hardwareConcurrency || 0,
    deviceMemory:navigator.deviceMemory || 0,
    touch:('ontouchstart' in window) || (navigator.maxTouchPoints || 0) > 0,
    maxTouchPoints:navigator.maxTouchPoints || 0,
    webglVendor:webgl.vendor,
    webglRenderer:webgl.renderer,
    browser:detectGestorBrowser(ua),
    os:detectGestorOS(ua)
  };
  const hash=await hashGestorText(JSON.stringify({
    platform:signals.platform,
    language:signals.language,
    languages:signals.languages,
    timezone:signals.timezone,
    screen:signals.screen,
    pixelRatio:signals.pixelRatio,
    hardwareConcurrency:signals.hardwareConcurrency,
    deviceMemory:signals.deviceMemory,
    touch:signals.touch,
    maxTouchPoints:signals.maxTouchPoints,
    webglVendor:signals.webglVendor,
    webglRenderer:signals.webglRenderer,
    browser:signals.browser,
    os:signals.os
  }));
  const gpu=shortGestorGpuName(webgl.renderer);
  const city=timezone.split('/').pop() || '';
  const label=[signals.os, signals.browser, screenInfo, city, gpu ? 'GPU '+gpu : ''].filter(Boolean).join(' - ');
  return {hash,label,summary:{os:signals.os,browser:signals.browser,screen:screenInfo,timezone,gpu,platform:signals.platform},confidenceSignals:signals};
}
function gestorDeviceSeenAt(d){ return Number(d?.lastSeen || d?.registeredAt || 0); }
function isGestorDeviceExpired(d, now=Date.now()){
  const seen=gestorDeviceSeenAt(d);
  return !!seen && (now-seen) > GESTOR_DEVICE_TTL_MS;
}
function gestorFingerprintScore(oldSignals={}, nextSignals={}){
  let score=0;
  if(oldSignals.platform && nextSignals.platform && oldSignals.platform !== nextSignals.platform) score += 2;
  if(oldSignals.timezone && nextSignals.timezone && oldSignals.timezone !== nextSignals.timezone) score += 1;
  if(oldSignals.screen && nextSignals.screen && oldSignals.screen !== nextSignals.screen) score += 1;
  if(oldSignals.browser && nextSignals.browser && oldSignals.browser !== nextSignals.browser) score += 1;
  if(oldSignals.webglRenderer && nextSignals.webglRenderer && oldSignals.webglRenderer !== nextSignals.webglRenderer) score += 2;
  if(oldSignals.maxTouchPoints !== undefined && nextSignals.maxTouchPoints !== undefined && oldSignals.maxTouchPoints !== nextSignals.maxTouchPoints) score += 1;
  return score;
}
function detectGestorDeviceSuspicion(existing, fingerprint, activeDevices, isNewDevice){
  const now=Date.now();
  if(existing?.confidenceSignals && gestorFingerprintScore(existing.confidenceSignals, fingerprint.confidenceSignals) >= 3) return true;
  const distinctHashes=new Set(activeDevices.map(d=>d.fingerprintHash).filter(Boolean));
  if(isNewDevice && distinctHashes.size >= 3 && !distinctHashes.has(fingerprint.hash)) return true;
  const recentNew=activeDevices.filter(d=>Number(d.registeredAt || 0) && (now-Number(d.registeredAt)) < 24*60*60*1000);
  return isNewDevice && recentNew.length >= 3;
}
async function registerGestorDevice(uid){
  const deviceId=getGestorDeviceId();
  const devRef=doc(db,'users',uid,'devices',deviceId);
  const currentSnap=await getDoc(devRef);
  const fingerprint=await buildGestorDeviceFingerprint();
  const existing=currentSnap.exists() ? {id:currentSnap.id,...currentSnap.data()} : null;
  const now=Date.now();
  if(existing){
    if(existing.revoked === true) return {ok:false,revoked:true};
    const suspicious=existing.suspicious === true || detectGestorDeviceSuspicion(existing, fingerprint, [], false);
    await setDoc(devRef,{
      name:fingerprint.label,
      deviceLabel:fingerprint.label,
      fingerprintHash:fingerprint.hash,
      fingerprintSummary:fingerprint.summary,
      confidenceSignals:fingerprint.confidenceSignals,
      lastSeen:now,
      lastLoginAt:now,
      loginCount:Number(existing.loginCount || 0) + 1,
      suspicious,
      revoked:false
    },{merge:true});
    return {ok:true};
  }
  const snap=await getDocs(devicesCol(uid));
  const devices=snap.docs.map(d=>({id:d.id,...d.data()}));
  const expired=devices.filter(d=>d.id !== deviceId && !d.revoked && isGestorDeviceExpired(d));
  await Promise.all(expired.map(d=>deleteDoc(doc(db,'users',uid,'devices',d.id)).catch(()=>{})));
  const usableDevices=devices.filter(d=>!expired.some(x=>x.id===d.id));
  const activeDevices=usableDevices.filter(d=>!d.revoked && !isGestorDeviceExpired(d));
  if(activeDevices.length >= MAX_GESTOR_DEVICES) return {ok:false,count:activeDevices.length};
  const suspicious=detectGestorDeviceSuspicion(null, fingerprint, activeDevices, true);
  await setDoc(devRef,{
    name:fingerprint.label,
    deviceLabel:fingerprint.label,
    fingerprintHash:fingerprint.hash,
    fingerprintSummary:fingerprint.summary,
    confidenceSignals:fingerprint.confidenceSignals,
    registeredAt:now,
    lastSeen:now,
    lastLoginAt:now,
    loginCount:1,
    suspicious,
    revoked:false
  });
  return {ok:true};
}

function normalizeSettings(data={}){
  const categories = Array.isArray(data.categories) ? data.categories.map(clean).filter(Boolean) : DEFAULT_CATEGORIES;
  const paymentMethods = normalizePaymentMethods(data.paymentMethods);
  const financeCurrency = clean(data.financeCurrency) || 'PEN';
  return {
    paymentMethods,
    finalMessage: clean(data.finalMessage) || DEFAULT_FINAL_MESSAGE,
    categories: [...new Set(categories)],
    defaultCountryCode: clean(data.defaultCountryCode) || '51',
    financeMode: data.financeMode === true,
    financeCurrency,
    financeSymbol: clean(data.financeSymbol) || CURRENCY_SYMBOLS[financeCurrency] || financeCurrency,
    platformPrices: normalizePlatformPrices(data.platformPrices, categories),
    comboTemplates: normalizeComboTemplates(data.comboTemplates, categories),
    security: data.security && typeof data.security === 'object' ? {passwordChangedAt:clean(data.security.passwordChangedAt)} : {}
  };
}
function normalizePlatformPrices(value={}, categories=[]){
  const out = {};
  if(value && typeof value === 'object'){
    Object.entries(value).forEach(([name,row]) => {
      const label = clean(name);
      if(!label) return;
      out[label] = {
        salePrice: moneyNumber(row?.salePrice),
        renewalPrice: moneyNumber(row?.renewalPrice),
        purchaseCost: moneyNumber(row?.purchaseCost)
      };
    });
  }
  (categories || []).map(clean).filter(Boolean).forEach(label => {
    if(!out[label]) out[label] = {salePrice:0, renewalPrice:0, purchaseCost:0};
  });
  return out;
}
function platformPriceFor(platform){
  const key = clean(platform).toLowerCase();
  const prices = state.settings?.platformPrices || {};
  const found = Object.entries(prices).find(([name]) => clean(name).toLowerCase() === key);
  return found ? found[1] : {salePrice:0, renewalPrice:0, purchaseCost:0};
}
function shouldUseDefaultPrice(value){
  return !String(value ?? '').trim() || moneyNumber(value) === 0;
}
function fillDefaultClientPricesInForm(form, platform){
  const price = platformPriceFor(platform);
  const saleEl = form.elements?.salePrice;
  const renewalEl = form.elements?.renewalPrice;
  if(price.salePrice && saleEl && shouldUseDefaultPrice(saleEl.value)) saleEl.value = price.salePrice;
  const renewalDefault = price.renewalPrice || price.salePrice;
  if(renewalDefault && renewalEl && shouldUseDefaultPrice(renewalEl.value)) renewalEl.value = renewalDefault;
}
function normalizeComboTemplates(value, categories=[]){
  const source = Array.isArray(value) && value.length ? value : DEFAULT_COMBO_TEMPLATES;
  const allowed = [...new Set([...(categories||[]), ...DEFAULT_CATEGORIES].map(clean).filter(Boolean))];
  return source.map(t => {
    const raw = Array.isArray(t?.platforms) ? t.platforms : clean(t?.platforms).split(/[,+|]/);
    const platforms = [...new Set(raw.map(p => {
      const text = clean(p);
      return allowed.find(a => a.toLowerCase() === text.toLowerCase()) || text;
    }).filter(Boolean))].slice(0,8);
    return { id: clean(t?.id) || id(), name: clean(t?.name) || 'Combo', platforms };
  }).filter(t => t.platforms.length).slice(0,30);
}
function normalizePaymentMethods(value){
  const source = Array.isArray(value)
    ? value
    : parsePaymentMethodsText(typeof value === 'string' ? value : '');
  return source
    .map(p => ({
      method: clean(p?.method || 'Pago').slice(0,40),
      number: clean(p?.number).replace(/^939401721$/,'974834197').slice(0,40),
      holder: clean(p?.holder).slice(0,120)
    }))
    .filter(p => p.method || p.number || p.holder)
    .slice(0,30);
}
function parsePaymentMethodsText(text=''){
  return clean(text)
    .replace(/939401721/g,'974834197')
    .replace(/999 999 999/g,'974834197')
    .split(/\r?\n/)
    .map(line => clean(line))
    .filter(Boolean)
    .map(line => {
      const [main, holder=''] = line.split(/\s+-\s+/, 2);
      const parts = main.split(':');
      if(parts.length > 1) return { method: parts.shift(), number: parts.join(':').trim(), holder };
      return { method: 'Pago', number: main, holder };
    });
}
function paymentMethodsText(value=state.settings.paymentMethods){
  if(Array.isArray(value)){
    return value
      .filter(p => clean(p?.method) || clean(p?.number) || clean(p?.holder))
      .map(p => `${clean(p.method) || 'Pago'}${clean(p.number) ? ': ' + clean(p.number) : ''}${clean(p.holder) ? ' - ' + clean(p.holder) : ''}`)
      .join('\n');
  }
  if(value && typeof value === 'object'){
    return Object.entries(value)
      .map(([k,v]) => `${k}: ${clean(v)}`)
      .filter(line => !line.endsWith(':'))
      .join('\n');
  }
  return clean(value);
}
function renewalPaymentLines(value=state.settings.paymentMethods){
  const methods = normalizePaymentMethods(value);
  return methods.map(p=>{
    const method = clean(p.method) || 'Medio de pago';
    const number = clean(p.number);
    const holder = clean(p.holder);
    return `\ud83d\udcf1 ${method}${number ? `: ${number}` : ''}${holder ? ` - ${holder}` : ''}`;
  }).join('\n');
}
function accountCategory(a={}){
  if(clean(a.category)) return clean(a.category);
  const p = clean(a.platform).toLowerCase();
  return state.settings.categories.find(cat => p.includes(cat.toLowerCase().split(' ')[0])) || clean(a.platform) || 'Sin categoria';

function isExpiredUser(data){

function dueState(date){
  if (!date) return { label:'Sin fecha', cls:'brand', days:9999 };
  const base = new Date(todayISO()+'T00:00:00');
  const due = new Date(date+'T00:00:00');
  const days = Math.round((due-base)/86400000);
  if (days < 0) return { label:'Vencido', cls:'bad', days };
  if (days === 0) return { label:'Hoy', cls:'warn', days };
  if (days <= 3) return { label:days+' dias', cls:'warn', days };
  return { label:days+' dias', cls:'ok', days };
}
function fmtDateLong(date){
  if(!date) return '';
  const due = new Date(date+'T00:00:00');
  if(Number.isNaN(due.getTime())) return clean(date);
  return due.toLocaleDateString('es-PE',{day:'numeric',month:'long',year:'numeric'});
}

function matches(item,q){
  if(!q) return true;
  const query = q.toLowerCase();
  const account = item?.accountId && item?.state !== 'No renovo' ? state.accounts.find(a => a.id === item.accountId) : null;
  const accountSearch = account ? [
    accountName(account),
    account.email,
    account.provider,
    account.platform,
    account.notes
  ].join(' ') : '';
  return `${JSON.stringify(item)} ${accountSearch}`.toLowerCase().includes(query);
}
function moneyNumber(value){
  const raw = String(value ?? '').replace(',', '.').replace(/[^\d.-]/g, '');
  const n = Number(raw);
  return Number.isFinite(n) ? Math.max(0, Math.round(n * 100) / 100) : 0;
}
function financeCurrency(){ return clean(state.settings.financeCurrency) || 'PEN'; }
function financeSymbol(){ return clean(state.settings.financeSymbol) || CURRENCY_SYMBOLS[financeCurrency()] || financeCurrency(); }

function financeMovementTime(movement){

function normalizeFinanceMovement(data={}){
  const now = new Date().toISOString();

    symbol: clean(data.symbol) || financeSymbol(),

    platform: clean(data.platform).slice(0,80),

  };

async function persistFinanceMovement(data){

async function upsertAccountPurchaseExpense(account){

function movementInRange(movement){
  const date = new Date(movement?.occurredAt || movement?.createdAt || Date.now());
  if(Number.isNaN(date.getTime()) || state.financeRange === 'all') return true;
  const now = new Date();
  const start = new Date(now);
  if(state.financeRange === 'today'){
    start.setHours(0,0,0,0);
  }else if(state.financeRange === '7days'){
    start.setDate(now.getDate() - 6); start.setHours(0,0,0,0);
  }else{
    start.setDate(1); start.setHours(0,0,0,0);
  }
  return date >= start;
}

    else state.clients = [cleanData, ...state.clients.filter(c => c.id !== cleanData.id)];

function formatSecurityDate(value){
  if(!value) return '-';
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return '-';
  return date.toLocaleString('es-PE',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
}

function startSecurityDeviceListener(uid){
  if(securityDeviceUnsub) securityDeviceUnsub();

  if(!uid || !id) return;
  securityDeviceUnsub = onSnapshot(doc(db,'users',uid,'devices',id), snap => {
    if(snap.exists() && snap.data()?.revoked === true){
      if(securityDeviceUnsub){ securityDeviceUnsub(); securityDeviceUnsub = null; }

}

function deviceLabel(d){ return d?.deviceLabel || d?.name || d?.fingerprintSummary || 'Dispositivo'; }

async function loadSecurityDevices(user){

    const allDevices = snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>deviceSeenValue(b)-deviceSeenValue(a));
    const active = allDevices.filter(d => d.revoked !== true);

async function revokeMobileDevice(deviceId){
  const user = auth.currentUser;
  if(!user || !deviceId) return;
  const isCurrent = deviceId === currentDeviceId();
  if(!confirm(isCurrent ? 'Cerrar sesion en este dispositivo?' : 'Vetar este dispositivo? No podra entrar de nuevo mientras siga vetado.')) return;
  try{
    await setDoc(doc(db,'users',user.uid,'devices',deviceId), {revoked:true, revokedAt:Date.now()}, {merge:true});
    toast(isCurrent ? 'Sesion cerrada' : 'Dispositivo vetado');
    if(isCurrent){
      await signOut(auth);
      return;
    }
    await updateSecuritySummary(user);
    renderMobileDeviceList();
  }catch(err){
    toast('No se pudo cerrar el dispositivo.','bad');
  }
}

function stripCountryCode(phone){
  if(!phone) return '';
  let p = clean(phone).replace(/\D/g,'');
  for(const cc of COUNTRY_CODES){
    if(p.startsWith(cc.code) && p.length > cc.code.length){
      return p.slice(cc.code.length);
    }
  }
  return p;
}
function normalizePhone(phone){
  let p = clean(phone).replace(/\D/g,'');
  if(!p) return '';
  // If already has a known country code prefix, return as-is
  for(const cc of COUNTRY_CODES){
    if(p.startsWith(cc.code) && p.length > cc.code.length) return p;
  }
  // Apply configured default country code
  const defaultCode = clean(state?.settings?.defaultCountryCode) || '51';
  return defaultCode + p;
}
function copyTextToClipboard(text){
  if(navigator.clipboard?.writeText) return navigator.clipboard.writeText(text);
  const area = document.createElement('textarea');
  area.value = text;
  area.setAttribute('readonly','');
  area.style.position = 'fixed';
  area.style.left = '-9999px';
  document.body.appendChild(area);
  area.select();
  try{
    document.execCommand('copy');
    return Promise.resolve();
  }catch(err){
    return Promise.reject(err);
  }finally{
    area.remove();
  }
}

async function applyClientRenewal(c, nextDate, successMessage='Cliente renovado', renewalAmount=0){

    <Style ss:ID="cell"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#D9E2F3"/></Borders></Style>
  </Styles><Worksheet ss:Name="Mis datos"><Table>${sheetRows(rows)}</Table></Worksheet>${isFinanceModeEnabled()?`<Worksheet ss:Name="Finanzas"><Table>${sheetRows(financeRows)}</Table></Worksheet>`:''}</Workbook>`;
  const blob = new Blob([xml], { type:'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'disenos-streaming-mis-datos.xls';
  a.click();
  URL.revokeObjectURL(a.href);
}
async function loadOnceForExpired(){
  await loadOnce(false);
}
async function loadOnce(showToast=true){
  if(!state.uid) return;
  try{
    if(showToast) toast('Actualizando datos...');
    if(!showToast && restoreMobileStateFromCache()){
      render();
      return;
    }
    const cfg = await getDoc(settingsRef(state.uid));
    const nextSettings = normalizeSettings(cfg.data() || {});
    const [acc, cli, fin] = await Promise.all([
      getDocs(accountsCol(state.uid)),
      getDocs(clientsCol(state.uid)),
      getFinanceMovements(state.uid, 'current')
    ]);
    state.accounts = acc.docs.map(d => ({id:d.id,...d.data()}));
    state.clients = cli.docs.map(d => ({id:d.id,...d.data()}));
    state.financeMovements = fin.filter(Boolean);
    state.financeMovementsFullLoaded = false;
    state.settings = nextSettings;
    cacheMobileState();
    render();
    if(showToast) toast('Datos actualizados.');
  }catch(err){
    console.error(err);
    toast('No se pudieron actualizar los datos.','bad');
  }
}
function startLive(){
  // Optimizado: ya no usamos escuchas en tiempo real permanentes.
  // Esto baja las lecturas de Firestore. Para traer cambios externos, recarga la página.
  return loadOnce(false);
}

document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => setView(b.dataset.view));
registerGestorServiceWorker();
$('#fab').onclick = () => state.view === 'finance' ? openFinanceExpenseSheet() : (state.view === 'accounts' ? openAccountSheet() : openClientSheet());
$('#installBtn').onclick = installGestorApp;
$('#installBannerBtn').onclick = installGestorApp;
$('#installDismissBtn').onclick = dismissInstallBanner;
$('#exportTop').onclick = exportExcel;
$('#logoutBtn').onclick = () => signOut(auth);
window.addEventListener('beforeinstallprompt', ev => {
  ev.preventDefault();
  deferredInstallPrompt = ev;
  updateInstallButton();
  showInstallBanner(2500);
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  updateInstallButton();
  hideInstallBanner();
  toast('Gestor instalado.');
});
window.matchMedia?.('(display-mode: standalone)')?.addEventListener?.('change', updateInstallButton);
updateInstallButton();
showInstallBanner(3000);

onAuthStateChanged(auth, async user => {
  if(!user){
    window.location.href = `gestor-login.html?next=${encodeURIComponent('/gestor-mobile.html')}`;
    return;
  }
  state.uid = user.uid;
  state.email = user.email || '';
  $('#userLine').textContent = state.email;
  try{
    const userSnap = await getDoc(doc(db,'users',user.uid));
    state.active = !isExpiredUser(userSnap.data() || {});
    if(!state.active){
      await loadOnceForExpired();
      renderExpired();
      return;
    }
    let deviceResult = null;
    try{
      deviceResult = await registerGestorDevice(user.uid);
    }catch(err){
      console.warn('No se pudo registrar este dispositivo del gestor:', err);
    }
    if(deviceResult && !deviceResult.ok){
      alert(deviceResult.revoked ? 'Este dispositivo esta vetado desde Seguridad.' : `Limite de ${MAX_GESTOR_DEVICES} dispositivos alcanzado.`);
      await signOut(auth);
      window.location.href = 'gestor-login.html';
      return;
    }
    startSecurityDeviceListener(user.uid);
    trackGestorDailyUsage(user, 'mobile');
    await updateSecuritySummary(user);
    startLive();
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo iniciar el gestor.','bad');
  }
});
</script>
