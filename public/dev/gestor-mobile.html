<style>
:root{
  color-scheme:dark;
  --bg:#070d18;
  --surface:#0d1726;
  --surface2:#111d30;
  --line:rgba(158,177,214,.16);
  --text:#f7f9ff;
  --muted:#91a2c0;
  --soft:#c8d3e8;
  --brand:#765cff;
  --brand2:#18d5a2;
  --warn:#ffbd4a;
  --bad:#ff5d7d;
  --ok:#22d89a;
  --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));font-size:15px}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{min-height:100vh;background:radial-gradient(circle at 0 0,rgba(118,92,255,.16),transparent 34%),linear-gradient(180deg,#091120 0%,#060b14 100%)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(7,13,24,.92);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:14px;background:#07101d;border:1px solid var(--line);object-fit:cover;box-shadow:0 10px 26px rgba(118,92,255,.18);flex:0 0 auto}
.title{min-width:0;flex:1}.title b{display:flex;align-items:center;gap:7px;font-size:15px}.title span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.beta-badge{display:inline-flex;align-items:center;min-height:20px;border-radius:999px;padding:0 7px;background:rgba(45,212,191,.10);border:1px solid rgba(45,212,191,.22);color:#a7f3d0;font-size:10px;font-weight:950;letter-spacing:.02em;text-transform:uppercase}.beta-note{color:var(--muted);font-size:11px}
.i{width:18px;height:18px;display:inline-block;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);display:grid;place-items:center;font-weight:900}
.install-banner{position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:70;display:none;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(12,18,34,.96);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);backdrop-filter:blur(18px)}
.install-banner.show{display:flex}
.install-banner .logo{width:42px;height:42px;border-radius:14px}
.install-text{min-width:0;flex:1}.install-text strong{display:block;font-size:13px;font-weight:950}.install-text span{display:block;margin-top:2px;color:var(--muted);font-size:11px;line-height:1.3}
.install-action{min-height:40px;border-radius:13px;padding:0 13px;background:linear-gradient(135deg,var(--brand),#5d8cff);color:#fff;font-size:12px;font-weight:950}
.install-close{width:30px;height:30px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted);display:grid;place-items:center;border:1px solid rgba(255,255,255,.06);font-size:16px;font-weight:900;flex:0 0 auto}
.wrap{padding:14px;max-width:720px;margin:0 auto}
.hero{display:grid;gap:12px;margin-bottom:12px}
.hello{padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(17,29,48,.94),rgba(13,23,38,.86));box-shadow:var(--shadow)}
.hello small{display:inline-flex;color:#a997ff;font-weight:850;margin-bottom:7px}.hello h1{margin:0 0 6px;font-size:22px;line-height:1.05}.hello p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);min-height:76px}
.stat b{display:block;font-size:21px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:750;line-height:1.25}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.btn{min-height:46px;border-radius:15px;padding:0 14px;font-weight:900;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),#5d8cff);border-color:transparent}
.btn.ok{background:linear-gradient(135deg,#11b986,#21d9a3);color:#03130e;border-color:transparent}
.btn.bad{background:rgba(255,93,125,.13);border-color:rgba(255,93,125,.32);color:#ffdce4}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px}.section-head h2{margin:0;font-size:15px}.section-head span{font-size:12px;color:var(--muted);font-weight:800}
.search{position:sticky;top:67px;z-index:10;margin:0 0 12px;padding:9px;background:rgba(7,13,24,.92);border-bottom:1px solid rgba(255,255,255,.05)}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#091322;color:var(--text);padding:0 13px;outline:0}
.list{display:grid;gap:9px}
.card{position:relative;padding:13px;border:1px solid var(--line);border-radius:19px;background:rgba(13,23,38,.86);box-shadow:0 10px 26px rgba(0,0,0,.14);content-visibility:auto;contain-intrinsic-size:92px}
.card-row{display:flex;gap:10px;align-items:center}
.avatar{width:42px;height:42px;border-radius:15px;background:rgba(118,92,255,.16);display:grid;place-items:center;font-weight:950;color:#cfc6ff;flex:0 0 auto}
.avatar.green{background:rgba(34,216,154,.14);color:#8cffd2}.avatar.warn{background:rgba(255,189,74,.15);color:#ffe0a3}.avatar.bad{background:rgba(255,93,125,.14);color:#ffc7d2}
.info{min-width:0;flex:1}.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 8px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);font-weight:800}
.pill.ok{color:#84ffd1}.pill.warn{color:#ffd88f}.pill.bad{color:#ffbdca}.pill.brand{color:#cfc6ff}
.chips{display:flex;gap:8px;overflow:auto;padding:0 0 10px;margin:0 -2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;border-radius:999px;padding:0 12px;background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--muted);font-weight:900;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{color:#fff;background:rgba(118,92,255,.2);border-color:rgba(118,92,255,.42)}
.chip-input{min-height:46px;border-radius:15px;border:1px solid var(--line);background:#07101d;color:var(--text);padding:0 12px;min-width:0;width:100%;outline:0}
.settings-card{padding:14px;border:1px solid var(--line);border-radius:20px;background:rgba(13,23,38,.86);display:grid;gap:12px}
.security-box{padding:14px;border:1px solid rgba(45,212,191,.22);border-radius:20px;background:linear-gradient(135deg,rgba(45,212,191,.10),rgba(118,92,255,.07));display:grid;gap:12px}
.security-box h3{margin:0;font-size:16px}.security-box p{margin:0;color:var(--muted);font-size:12px;line-height:1.4}
.security-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.security-metric{padding:11px;border-radius:15px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);min-width:0}.security-metric b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.security-metric span{display:block;margin-top:3px;color:var(--muted);font-size:11px}
.category-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 11px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
.category-row b{font-size:13px}.danger-icon{width:38px;height:38px;border-radius:13px;background:rgba(255,93,125,.12);border:1px solid rgba(255,93,125,.28);color:#ffb8c6;display:grid;place-items:center}
.combo-sale-card{padding:13px;border-radius:20px;border:1px solid rgba(56,189,248,.24);background:radial-gradient(260px 120px at 0% 0%,rgba(229,9,20,.18),transparent 65%),radial-gradient(260px 120px at 100% 0%,rgba(56,189,248,.16),transparent 68%),rgba(13,23,38,.92);display:grid;gap:10px}
.combo-sale-card strong{font-size:14px}.combo-app-card{padding:12px;border-radius:18px;border:1px solid color-mix(in srgb,var(--pcolor,#765cff) 36%, rgba(255,255,255,.08));background:radial-gradient(220px 85px at 0% 0%,color-mix(in srgb,var(--pcolor,#765cff) 18%, transparent),transparent 72%),rgba(255,255,255,.035);display:grid;gap:9px}
.combo-app-card .combo-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:950}.combo-badge{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 8px;background:linear-gradient(90deg,rgba(229,9,20,.18),rgba(56,189,248,.16));border:1px solid rgba(56,189,248,.24);color:#e9f6ff;font-size:11px;font-weight:950}
.combo-badge:before{content:"";width:6px;height:6px;border-radius:999px;background:#e50914;margin-right:5px;box-shadow:0 0 10px rgba(229,9,20,.7)}
.combo-mobile-tools{display:grid;grid-template-columns:1fr auto;gap:8px}.combo-mobile-toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:12px;font-weight:900;color:var(--muted)}.combo-mobile-toggle input{width:18px;height:18px;accent-color:#38bdf8}
.phone-row{display:flex;gap:6px}.country-select{width:100px;flex:0 0 auto;min-height:46px;border-radius:15px;border:1px solid var(--line);background:#07101d;color:var(--text);padding:0 8px;outline:0}.phone-input{flex:1;min-width:0}.card-actions{display:flex;gap:8px;margin-top:11px}.mini{height:38px;border-radius:13px;padding:0 11px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);font-weight:850;flex:1;display:flex;align-items:center;justify-content:center;gap:7px}.mini .i{width:16px;height:16px}
.empty{padding:24px 16px;text-align:center;border:1px dashed rgba(158,177,214,.22);border-radius:20px;color:var(--muted);background:rgba(255,255,255,.03)}.archived-section{margin-top:20px;border:1px solid rgba(255,93,125,.2);border-radius:20px;overflow:hidden;background:rgba(255,93,125,.04)}.archived-section summary{padding:13px 16px;font-weight:900;font-size:14px;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none;user-select:none}.archived-section summary::-webkit-details-marker{display:none}.archived-section summary .pill{font-size:11px}.archived-section[open] summary{border-bottom:1px solid rgba(255,93,125,.15)}.archived-list{padding:10px;display:grid;gap:8px}.card-archived{opacity:.8}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:rgba(7,13,24,.94);border-top:1px solid var(--line)}
.navbtn{height:54px;border-radius:17px;background:transparent;color:var(--muted);font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.navbtn .i{width:20px;height:20px}.navbtn small{font-size:11px}.navbtn.active{background:rgba(118,92,255,.18);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:28;width:58px;height:58px;border-radius:21px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:28px;font-weight:900;box-shadow:0 16px 35px rgba(0,0,0,.36);display:grid;place-items:center}.fab .i{width:26px;height:26px;stroke-width:2.4}
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.52);opacity:0;pointer-events:none;transition:.18s}
.sheet-back.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;max-height:88vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:#091322;border:1px solid var(--line);box-shadow:0 -22px 55px rgba(0,0,0,.44);transform:translateY(105%);transition:.22s ease}
.sheet.show{transform:translateY(0)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet h3{margin:0;font-size:18px}.grid{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:900}.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:15px;border:1px solid var(--line);background:#07101d;color:var(--text);padding:0 12px;outline:0}.field textarea{padding:12px;min-height:82px;resize:vertical}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.toast{position:fixed;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:80;padding:13px 14px;border-radius:17px;background:#132139;color:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:850;transform:translateY(16px);opacity:0;pointer-events:none;transition:.18s}.toast.show{transform:translateY(0);opacity:1}.toast.ok{border-color:rgba(34,216,154,.35)}.toast.bad{border-color:rgba(255,93,125,.45);background:#321421}
.expired{min-height:100vh;display:grid;place-items:center;padding:22px}.expired-box{max-width:420px;width:100%;padding:20px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.expired-box h1{margin:0 0 8px;font-size:24px}.expired-box p{color:var(--muted);line-height:1.5}.hidden{display:none!important}
@media (min-width:680px){.grid.two{grid-template-columns:1fr 1fr}.wrap{padding-top:20px}.sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%);border-radius:26px}.sheet.show{transform:translate(-50%,0)}}
</style>
</head>

<div id="app" class="app">
  <header class="top">
    <img class="logo" src="/icons/icon-192.png" alt="Disenos Streaming">
    <div class="title"><b>Gestor <span class="beta-badge">Beta</span></b><span id="userLine">Version en mejora</span></div>
    <button class="iconbtn" id="installBtn" title="Instalar gestor" aria-label="Instalar gestor"><svg class="i"><use href="#i-install"></use></svg></button>
    <button class="iconbtn" id="exportTop" title="Exportar Excel" aria-label="Exportar Excel"><svg class="i"><use href="#i-download"></use></svg></button>
    <button class="iconbtn" id="logoutBtn" title="Cerrar sesion" aria-label="Cerrar sesion"><svg class="i"><use href="#i-log-out"></use></svg></button>
  </header>
  <main class="wrap" id="view"></main>
  <button class="fab" id="fab" title="Agregar" aria-label="Agregar"><svg class="i"><use href="#i-plus"></use></svg></button>

  const base = value ? new Date(value + 'T00:00:00') : new Date();
  if(Number.isNaN(base.getTime())) return todayISO();
  const day = base.getDate();
  const target = new Date(base.getFullYear(), base.getMonth() + months, 1);

  target.setDate(Math.min(day, lastDay));

}

  return source.map(t => {

      const text = clean(p);
      return allowed.find(a => a.toLowerCase() === text.toLowerCase()) || text;
    }).filter(Boolean))].slice(0,8);
    return { id: clean(t?.id) || id(), name: clean(t?.name) || 'Combo', platforms };

function normalizePaymentMethods(value){
  const source = Array.isArray(value)
    ? value
    : parsePaymentMethodsText(typeof value === 'string' ? value : '');
  return source
    .map(p => ({
      method: clean(p?.method || 'Pago').slice(0,40),
      number: clean(p?.number).replace(/^939401721$/,'974834197').slice(0,40),
      holder: clean(p?.holder).slice(0,120)
    }))
    .filter(p => p.method || p.number || p.holder)
    .slice(0,30);
}
function parsePaymentMethodsText(text=''){
  return clean(text)
    .replace(/939401721/g,'974834197')
    .replace(/999 999 999/g,'974834197')
    .split(/\r?\n/)
    .map(line => clean(line))
    .filter(Boolean)
    .map(line => {
      const [main, holder=''] = line.split(/\s+-\s+/, 2);
      const parts = main.split(':');
      if(parts.length > 1) return { method: parts.shift(), number: parts.join(':').trim(), holder };
      return { method: 'Pago', number: main, holder };
    });
}
function paymentMethodsText(value=state.settings.paymentMethods){
  if(Array.isArray(value)){
    return value
      .filter(p => clean(p?.method) || clean(p?.number) || clean(p?.holder))
      .map(p => `${clean(p.method) || 'Pago'}${clean(p.number) ? ': ' + clean(p.number) : ''}${clean(p.holder) ? ' - ' + clean(p.holder) : ''}`)
      .join('\n');
  }
  if(value && typeof value === 'object'){
    return Object.entries(value)
      .map(([k,v]) => `${k}: ${clean(v)}`)
      .filter(line => !line.endsWith(':'))
      .join('\n');
  }
  return clean(value);
}

  if (!date) return { label:'Sin fecha', cls:'brand', days:9999 };

  const days = Math.round((due-base)/86400000);
  if (days < 0) return { label:'Vencido', cls:'bad', days };
  if (days === 0) return { label:'Hoy', cls:'warn', days };
  if (days <= 3) return { label:days+' dias', cls:'warn', days };

}

  if(!q) return;
  q.addEventListener('input', e => {
    state.query = e.target.value;
    if(state.view === 'clients') renderClients(true);
    else if(state.view === 'accounts') renderAccounts(true);
    else render();
  });
}
function bindCards(){
  document.querySelectorAll('[data-edit-client]').forEach(b => b.onclick = () => openClientSheet(state.clients.find(c => c.id === b.dataset.editClient)));
  document.querySelectorAll('[data-edit-account]').forEach(b => b.onclick = () => openAccountSheet(state.accounts.find(a => a.id === b.dataset.editAccount)));
  document.querySelectorAll('[data-account-clients]').forEach(b => b.onclick = () => openAccountClientsSheet(state.accounts.find(a => a.id === b.dataset.accountClients)));
  document.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => {
    const c = state.clients.find(x => x.id === b.dataset.wa);
    c?.comboId ? openWhatsAppCombo(activeComboClients(c.comboId), 'delivery') : openWhatsApp(c, 'delivery');
  });
  document.querySelectorAll('[data-wa-renew]').forEach(b => b.onclick = () => {
    const c = state.clients.find(x => x.id === b.dataset.waRenew);
    c?.comboId ? openWhatsAppCombo(activeComboClients(c.comboId), 'renewal') : openWhatsApp(c, 'renewal');
  });
  document.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => renewClient(state.clients.find(c => c.id === b.dataset.renew)));
  document.querySelectorAll('[data-no-renew]').forEach(b => b.onclick = () => markNoRenew(state.clients.find(c => c.id === b.dataset.noRenew)));
  document.querySelectorAll('[data-restore-client]').forEach(b => b.onclick = () => openClientSheet(state.clients.find(c => c.id === b.dataset.restoreClient)));
  document.querySelectorAll('[data-sell-account]').forEach(b => b.onclick = () => {
    const a = state.accounts.find(x => x.id === b.dataset.sellAccount);
    if(!a) return;
    openClientSheet({ accountId:a.id, platform:a.platform, dueDate:addMonthsISO(todayISO(), 1), state:'Activo' });
  });
}

function openSheet(html){
  $('#sheet').innerHTML = html;
  $('#sheetBack').classList.add('show');
  $('#sheet').classList.add('show');
  $('#sheetBack').onclick = closeSheet;
  $('#closeSheet')?.addEventListener('click', closeSheet);
}
function closeSheet(){
  $('#sheetBack').classList.remove('show');
  $('#sheet').classList.remove('show');
}
let deferredInstallPrompt = null;
async function registerGestorServiceWorker(){
  if(!IS_WEB_CONTEXT || !('serviceWorker' in navigator)) return;
  try{
    await navigator.serviceWorker.register('/sw.js');
    await navigator.serviceWorker.ready;
    if(!navigator.serviceWorker.controller && !sessionStorage.getItem('gestor_sw_reload_done')){
      sessionStorage.setItem('gestor_sw_reload_done', '1');
      location.reload();
    }
  }catch(err){
    console.warn('Service worker no disponible:', err);
  }
}
function isStandaloneMode(){
  return window.matchMedia?.('(display-mode: standalone)')?.matches || window.navigator.standalone === true;
}
function updateInstallButton(){
  $('#installBtn')?.classList.toggle('hidden', isStandaloneMode());
  const bannerBtn = $('#installBannerBtn');
  if(bannerBtn) bannerBtn.textContent = deferredInstallPrompt ? 'Instalar' : 'Como instalar';
}
function shouldShowInstallBanner(){
  const dismissed = Number(localStorage.getItem('pwa_gestor_dismissed') || 0);
  return IS_WEB_CONTEXT && !isStandaloneMode() && (!dismissed || Date.now() - dismissed > 7*24*60*60*1000);
}
function showInstallBanner(delay=0){
  if(!shouldShowInstallBanner()) return;
  setTimeout(()=> {
    updateInstallButton();
    $('#installBanner')?.classList.add('show');
  }, delay);
}
function hideInstallBanner(){
  $('#installBanner')?.classList.remove('show');
}
function dismissInstallBanner(){
  hideInstallBanner();
  localStorage.setItem('pwa_gestor_dismissed', Date.now().toString());
}
async function runInstallPrompt(){
  if(!deferredInstallPrompt) return showInstallHelp();
  const promptEvent = deferredInstallPrompt;
  deferredInstallPrompt = null;
  await promptEvent.prompt();
  const choice = await promptEvent.userChoice.catch(()=>null);
  updateInstallButton();
  hideInstallBanner();
  toast(choice?.outcome === 'accepted' ? 'Instalando gestor.' : 'Instalacion cancelada.', choice?.outcome === 'accepted' ? 'ok' : 'bad');
}
function showInstallHelp(){
  hideInstallBanner();
  openSheet(`<div class="sheet-head"><h3>Instalar gestor</h3><button class="iconbtn" id="closeSheet" aria-label="Cerrar">${icon('x')}</button></div>
    <div class="grid">
      <div class="settings-card">
        <strong>${deferredInstallPrompt ? 'Instalacion lista' : 'Android / Chrome'}</strong>
        <span class="beta-note">${deferredInstallPrompt ? 'Tu navegador ya permite instalar el gestor como app.' : 'Android todavia no habilito el instalador automatico. Abre esta pagina en Chrome normal, espera que cargue, y vuelve a tocar Instalar. Si usas navegador Xiaomi, Samsung, Instagram o Facebook, primero abre en Chrome.'}</span>
        ${deferredInstallPrompt ? `<button class="btn ok" id="nativeInstallBtn">${icon('install')}<span>Instalar app ahora</span></button>` : `<button class="btn" id="androidManualBtn">${icon('install')}<span>Ver pasos Android</span></button>`}
        ${!deferredInstallPrompt ? `<button class="btn ok" id="openChromeBtn">${icon('install')}<span>Abrir en Chrome</span></button><button class="btn" id="copyInstallLinkBtn">${icon('copy')}<span>Copiar enlace</span></button>` : ''}
      </div>
      <div class="settings-card">
        <strong>iPhone</strong>
        <span class="beta-note">Abre esta pagina en Safari, toca Compartir y luego Agregar a pantalla de inicio. Apple no muestra un boton automatico de instalar dentro de la web.</span>
      </div>
      <button class="btn" id="installHelpClose">Entendido</button>
    </div>`);
  $('#nativeInstallBtn')?.addEventListener('click', runInstallPrompt);
  $('#androidManualBtn')?.addEventListener('click', () => toast('Chrome: 3 puntos > Instalar app.', 'ok'));
  $('#openChromeBtn')?.addEventListener('click', openInChrome);
  $('#copyInstallLinkBtn')?.addEventListener('click', copyInstallLink);
  $('#installHelpClose')?.addEventListener('click', closeSheet);
}
function installGestorApp(){
  if(isStandaloneMode()) return toast('El gestor ya esta instalado.');
  return deferredInstallPrompt ? runInstallPrompt() : showInstallHelp();
}
function installUrl(){
  return new URL('/gestor-mobile.html', location.origin).href;
}
function openInChrome(){
  const url = installUrl();
  if(/Android/i.test(navigator.userAgent || '')){
    const stripped = url.replace(/^https?:\/\//, '');
    location.href = `intent://${stripped}#Intent;scheme=https;package=com.android.chrome;end`;
    setTimeout(() => { location.href = url; }, 900);
    return;
  }
  location.href = url;
}
async function copyInstallLink(){
  const url = installUrl();
  try{
    await navigator.clipboard.writeText(url);
    toast('Enlace copiado. Abrelo en Chrome.');
  }catch(_){
    toast(url, 'ok');
  }
}

        ${['Activo','Por vencer','Vencido','Pausado'].map(s=>`<option ${clean(c.state||'Activo')===s?'selected':''}>${s}</option>`).join('')}

      <div class="field"><label>Notas</label><textarea name="notes">${esc(c.notes)}</textarea></div>

    </form>`);
  $('#clientForm').onsubmit = async e => {

    const submitBtn = $('#clientSubmitBtn');

    submitBtn.disabled = true;

      submitBtn.disabled = false;
      submitBtn.textContent = isNewSale ? 'Entregar cuenta' : 'Guardar';

  };

}
function accountMatchesComboPlatform(account, platform){
  const a = clean(account?.platform).toLowerCase();
  const p = clean(platform).toLowerCase();
  return a === p || a.includes(p) || p.includes(a);
}
function comboAccountOptions(platform, selected=''){
  const matches = state.accounts
    .filter(a => accountMatchesComboPlatform(a, platform))
    .sort((a,b)=>accountUsed(a.id)-accountUsed(b.id));
  const list = matches.length ? matches : state.accounts;
  return `<option value="">Elige cuenta para ${esc(platform)}</option>${list.map(a=>`<option value="${esc(a.id)}" ${a.id===selected?'selected':''}>${esc(accountName(a))} - ${Math.max(0, Number(a.capacity||0)-accountUsed(a.id))} libres</option>`).join('')}`;
}
function renderComboRows(template, splitDates=false, baseDate=''){
  return template.platforms.map(platform => {
    const first = state.accounts.find(a => accountMatchesComboPlatform(a, platform) && Number(a.capacity||0) > accountUsed(a.id)) || state.accounts.find(a => accountMatchesComboPlatform(a, platform));
    return `<div class="combo-app-card" style="--pcolor:${esc(platformColorMobile(platform))}" data-platform="${esc(platform)}">
      <div class="combo-title"><span>${esc(platform)}</span><span class="combo-badge">App combo</span></div>
      <div class="field"><label>Cuenta madre</label><select class="combo-account">${comboAccountOptions(platform, first?.id || '')}</select></div>
      <div class="grid two">
        <div class="field"><label>Perfil</label><input class="combo-profile" value="${esc(first ? nextProfileSuggestionMobile(first.id) : '')}" placeholder="1"></div>
        <div class="field"><label>PIN</label><input class="combo-pin" placeholder="1234"></div>
      </div>
      <div class="field ${splitDates?'':'hidden'}"><label>Vence esta app</label><input type="date" class="combo-due" value="${esc(baseDate || addMonthsISO(todayISO(), 1))}"></div>
    </div>`;
  }).join('');
}
function platformColorMobile(name){
  const p=clean(name).toLowerCase();
  if(p.includes('netflix')) return '#e50914';
  if(p.includes('disney')) return '#38bdf8';
  if(p.includes('max') || p.includes('hbo')) return '#7c3aed';
  if(p.includes('prime')) return '#00a8e1';
  if(p.includes('spotify')) return '#1db954';
  if(p.includes('youtube')) return '#ff0033';
  return '#765cff';
}
function customMobileComboTemplate(){
  const platforms = clean($('#comboCustomPlatformsMobile')?.value).split(',').map(clean).filter(Boolean).slice(0,8);
  return platforms.length ? { id:'__custom__', name:'Combo personalizado', platforms:[...new Set(platforms)] } : null;
}
function selectedMobileComboTemplate(templates){
  const selected = $('#comboTemplatePicker')?.value;
  if(selected === '__custom__') return customMobileComboTemplate();
  return templates.find(t => t.id === selected) || templates[0] || null;
}
function nextProfileSuggestionMobile(accountId){
  const acc = state.accounts.find(a => a.id === accountId);
  const used = new Set(state.clients.filter(c => c.accountId === accountId && c.state !== 'No renovo').map(c => clean(c.profile)).filter(Boolean));
  for(let i=1;i<=Number(acc?.capacity||0);i++) if(!used.has(String(i))) return String(i);
  return '';
}

async function saveComboFromForm(e){
  e.preventDefault();
  const form = e.currentTarget;
  const btn = $('#saveComboBtn');
  btn.disabled = true;
  const fd = Object.fromEntries(new FormData(form).entries());
  const templates = normalizeComboTemplates(state.settings.comboTemplates, state.settings.categories);
  const template = fd.templateId === '__custom__' ? customMobileComboTemplate() : templates.find(t => t.id === fd.templateId);
  const splitDates = !!$('#comboSplitDatesMobile')?.checked;
  const comboId = id();
  const comboCreatedAt = new Date().toISOString();
  const rows = [...document.querySelectorAll('.combo-app-card')].map(row => {
    const accountId = row.querySelector('.combo-account')?.value || '';
    const account = state.accounts.find(a => a.id === accountId);
    return {
      id:id(), name:fd.name, whatsapp:fd.whatsapp, accountId,
      platform: account?.platform || row.dataset.platform || '',
      profile: row.querySelector('.combo-profile')?.value || '',
      pin: row.querySelector('.combo-pin')?.value || '',
      dueDate: splitDates ? (row.querySelector('.combo-due')?.value || fd.dueDate) : fd.dueDate, state:'Activo', notes:fd.notes || '',
      comboId, comboName:template?.name || 'Combo', comboSize:template?.platforms.length || 0, comboCreatedAt
    };
  }).map(sanitizeClientForSave);
  if(!rows.length || rows.some(c => !c.accountId)){
    toast('Elige una cuenta para cada app.','bad');
    btn.disabled = false;
    return;
  }
  try{
    for(const client of rows) await setDoc(clientRef(client.id), client);
    toast('Combo guardado');
    closeSheet();
    openWhatsAppCombo(rows, 'delivery');
  }catch(err){
    console.error(err);
    toast('No se pudo guardar el combo.','bad');
  }finally{
    btn.disabled = false;
  }
}

async function saveItem(kind,data,opts={}){
  const cleanData = kind === 'account' ? sanitizeAccountForSave(data) : sanitizeClientForSave(data);
  try{
    await setDoc(kind === 'account' ? accountRef(cleanData.id) : clientRef(cleanData.id), cleanData);
    toast('Guardado correctamente');
    closeSheet();
    if(kind === 'client' && opts.newSale){
      state.view = 'clients';
      state.query = data.whatsapp || clientName(data);
      document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === 'clients'));
      render();
      if(!opts.skipDeliverySheet) setTimeout(() => openSaleDeliverySheet(data), 80);
    }
  }catch(err){
    console.error(err);
    if(opts.deliveryWindow && !opts.deliveryWindow.closed) opts.deliveryWindow.close();
    const msg = /permission|permissions|insufficient/i.test(err?.message || '')
      ? 'No se pudo guardar. Actualiza la app o revisa que el usuario este activo.'
      : 'No se pudo guardar. Revisa la conexion.';
    toast(msg,'bad');
  }
}
function sanitizeAccountForSave(data={}){
  return {
    id: clean(data.id) || id(),
    platform: clean(data.platform),
    provider: clean(data.provider),
    providerWhatsapp: clean(data.providerWhatsapp).slice(0,64),
    email: clean(data.email).slice(0,240),
    password: clean(data.password).slice(0,240),
    capacity: Math.max(1, Math.min(500, Number(data.capacity || 1))),
    dueDate: clean(data.dueDate),

const COUNTRY_CODES = [
  {code:'51',flag:'🇵🇪',name:'Peru',digits:9},
  {code:'57',flag:'🇨🇴',name:'Colombia',digits:10},
  {code:'56',flag:'🇨🇱',name:'Chile',digits:9},
  {code:'502',flag:'🇬🇹',name:'Guatemala',digits:8},
  {code:'54',flag:'🇦🇷',name:'Argentina',digits:10},
  {code:'52',flag:'🇲🇽',name:'Mexico',digits:10},
  {code:'593',flag:'🇪🇨',name:'Ecuador',digits:9},
  {code:'591',flag:'🇧🇴',name:'Bolivia',digits:8},
  {code:'595',flag:'🇵🇾',name:'Paraguay',digits:9},
  {code:'598',flag:'🇺🇾',name:'Uruguay',digits:9},
  {code:'58',flag:'🇻🇪',name:'Venezuela',digits:10},
  {code:'1',flag:'🇺🇸',name:'USA / Canada',digits:10},
  {code:'34',flag:'🇪🇸',name:'Espana',digits:9},
];
function stripCountryCode(phone){
  if(!phone) return '';
  let p = clean(phone).replace(/\D/g,'');
  for(const cc of COUNTRY_CODES){
    if(p.startsWith(cc.code) && p.length > cc.code.length){
      return p.slice(cc.code.length);
    }
  }
  return p;
}
function normalizePhone(phone){
  let p = clean(phone).replace(/\D/g,'');
  if(!p) return '';
  // If already has a known country code prefix, return as-is
  for(const cc of COUNTRY_CODES){
    if(p.startsWith(cc.code) && p.length > cc.code.length) return p;
  }
  // Apply configured default country code
  const defaultCode = clean(state?.settings?.defaultCountryCode) || '51';
  return defaultCode + p;
}
function addDaysISO(date, days){
  const d = new Date((date || todayISO()) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
function renewClient(c){
  if(!c) return;
  const currentDue = clean(c.dueDate) || todayISO();
  const base = dueState(currentDue).days > 0 ? currentDue : todayISO();
  const oneMonth = addMonthsISO(base, 1);
  const threeMonths = addMonthsISO(base, 3);
  openSheet(`<div class="sheet-head"><h3>Renovar cliente</h3><button class="iconbtn" id="closeSheet" aria-label="Cerrar">${icon('x')}</button></div>
    <div class="grid">

        <strong>${esc(clientName(c))}</strong>
        <span class="beta-note">Vence actual: ${esc(currentDue || 'Sin fecha')}. Elige cuanto tiempo aumentar antes de guardar.</span>
      </div>
      <button class="btn ok" id="renewOneMonth">${icon('calendar')}<span>Renovar 1 mes</span></button>
      <button class="btn primary" id="renewThreeMonths">${icon('calendar')}<span>Renovar 3 meses</span></button>
      <form id="renewCustomForm" class="grid">
        <div class="field"><label>Seleccionar fecha</label><input type="date" name="dueDate" value="${esc(oneMonth)}" required></div>
        <button class="btn">${icon('save')}<span>Guardar fecha personalizada</span></button>
      </form>
    </div>`);
  $('#renewOneMonth')?.addEventListener('click', () => applyClientRenewal(c, oneMonth, 'Cliente renovado por 1 mes'));
  $('#renewThreeMonths')?.addEventListener('click', () => applyClientRenewal(c, threeMonths, 'Cliente renovado por 3 meses'));
  $('#renewCustomForm')?.addEventListener('submit', e => {
    e.preventDefault();
    const fd = new FormData(e.currentTarget);
    const customDate = clean(fd.get('dueDate'));
    if(!customDate) return toast('Selecciona una fecha valida.','bad');
    applyClientRenewal(c, customDate, 'Cliente renovado hasta ' + customDate);
  });

function comboText(clients, mode='delivery'){
  const first = clients[0] || {};
  const lines = [`Hola ${clientName(first)} ${mode === 'renewal' ? 'te aviso sobre tu combo.' : 'te envio los datos de tu combo:'}`, ''];
  clients.forEach((c,i) => {
    const acc = state.accounts.find(a => a.id === c.accountId);

    lines.push(`Correo: ${clean(acc?.email) || '-'}`);

function whatsappUrlForClient(c, mode='delivery'){

function whatsappPayloadForClient(c, mode='delivery'){
  if(!c) return null;
  const phone = normalizePhone(c.whatsapp);
  if(!phone) return null;
  const acc = state.accounts.find(a => a.id === c.accountId);
  const ds = dueState(c.dueDate);
  const service = platformShort(c.platform || acc?.platform);
  let text = '';
  if(mode === 'renewal'){
    let statusText = `tu cuenta de ${service} esta proxima a vencer.`;
    if(ds.days < 0) statusText = `tu cuenta de ${service} ya vencio el ${c.dueDate || 'dia indicado'}.`;
    else if(ds.days === 0) statusText = `tu cuenta de ${service} vence hoy.`;
    else if(ds.days <= 7) statusText = `tu cuenta de ${service} esta por vencer el ${c.dueDate || 'dia indicado'}.`;
    const payText = paymentMethodsText();
    const pay = payText ? `\n\nMedios de pago:\n${payText}` : '';
    text = `Hola ${clientName(c)} 👋\n\nTe aviso que ${statusText}${pay}\n\nCuando realices el pago, enviame la captura para renovarte el servicio. Gracias 🙌`;
  }else{
    const emoji = {
      saludo:'✨',
      brillo:'⭐',
      correo:'✉️',
      clave:'🔐',
      perfil:'👤',
      pin:'🔢',
      vence:'📅',
      nota:'✅'
    };
    const final = clean(state.settings.finalMessage) ? `\n\n${emoji.nota} ${state.settings.finalMessage}` : '';
    const email = clean(acc?.email);
    const password = clean(acc?.password);
    text = `Hola ${clientName(c)} ${emoji.saludo}\n\n${emoji.brillo} Te envio nuevamente los datos de tu cuenta de ${service}:\n\n${emoji.correo} Correo: ${email || '-'}\n${emoji.clave} Contrasena: ${password || '-'}\n${emoji.perfil} Perfil: ${clean(c.profile) || '-'}\n${emoji.pin} PIN: ${clean(c.pin) || '-'}\n${emoji.vence} Vence: ${clean(c.dueDate) || '-'}${final}`;
  }
  const encodedText = encodeURIComponent(text);
  const webUrl = `https://wa.me/${phone}?text=${encodedText}`;
  const normalUrl = `intent://send?phone=${phone}&text=${encodedText}#Intent;scheme=whatsapp;package=com.whatsapp;S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
  const businessUrl = `intent://send?phone=${phone}&text=${encodedText}#Intent;scheme=whatsapp;package=com.whatsapp.w4b;S.browser_fallback_url=${encodeURIComponent(webUrl)};end`;
  const chooserUrl = `whatsapp://send?phone=${phone}&text=${encodedText}`;
  return { phone, text, encodedText, webUrl, normalUrl, businessUrl, chooserUrl, mode };
}
