<style>
:root{
  color-scheme:dark;
  --bg:#070d18;
  --surface:#0d1726;
  --surface2:#111d30;
  --line:rgba(158,177,214,.16);
  --text:#f7f9ff;
  --muted:#91a2c0;
  --soft:#c8d3e8;
  --brand:#765cff;
  --brand2:#18d5a2;
  --warn:#ffbd4a;
  --bad:#ff5d7d;
  --ok:#22d89a;
  --shadow:0 18px 45px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{padding-bottom:calc(78px + env(safe-area-inset-bottom));font-size:15px}
button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}
.app{min-height:100vh;background:radial-gradient(circle at 0 0,rgba(118,92,255,.16),transparent 34%),linear-gradient(180deg,#091120 0%,#060b14 100%)}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(7,13,24,.92);border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--brand),#31c7ff);display:grid;place-items:center;font-weight:950;box-shadow:0 10px 26px rgba(118,92,255,.25)}
.title{min-width:0;flex:1}.title b{display:flex;align-items:center;gap:7px;font-size:15px}.title span{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.beta-badge{display:inline-flex;align-items:center;min-height:20px;border-radius:999px;padding:0 7px;background:rgba(45,212,191,.10);border:1px solid rgba(45,212,191,.22);color:#a7f3d0;font-size:10px;font-weight:950;letter-spacing:.02em;text-transform:uppercase}.beta-note{color:var(--muted);font-size:11px}
.i{width:18px;height:18px;display:inline-block;vertical-align:middle;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.iconbtn{width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.06);color:var(--text);border:1px solid var(--line);display:grid;place-items:center;font-weight:900}
.wrap{padding:14px;max-width:720px;margin:0 auto}
.hero{display:grid;gap:12px;margin-bottom:12px}
.hello{padding:16px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(17,29,48,.94),rgba(13,23,38,.86));box-shadow:var(--shadow)}
.hello small{display:inline-flex;color:#a997ff;font-weight:850;margin-bottom:7px}.hello h1{margin:0 0 6px;font-size:22px;line-height:1.05}.hello p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{padding:12px;border-radius:18px;background:rgba(255,255,255,.045);border:1px solid var(--line);min-height:76px}
.stat b{display:block;font-size:21px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:750;line-height:1.25}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}
.btn{min-height:46px;border-radius:15px;padding:0 14px;font-weight:900;color:var(--text);background:rgba(255,255,255,.07);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:linear-gradient(135deg,var(--brand),#5d8cff);border-color:transparent}
.btn.ok{background:linear-gradient(135deg,#11b986,#21d9a3);color:#03130e;border-color:transparent}
.btn.bad{background:rgba(255,93,125,.13);border-color:rgba(255,93,125,.32);color:#ffdce4}
.section{margin-top:16px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:0 0 9px}.section-head h2{margin:0;font-size:15px}.section-head span{font-size:12px;color:var(--muted);font-weight:800}
.search{position:sticky;top:67px;z-index:10;margin:0 0 12px;padding:9px;background:rgba(7,13,24,.92);border-bottom:1px solid rgba(255,255,255,.05)}
.search input{width:100%;height:44px;border-radius:14px;border:1px solid var(--line);background:#091322;color:var(--text);padding:0 13px;outline:0}
.list{display:grid;gap:9px}
.card{position:relative;padding:13px;border:1px solid var(--line);border-radius:19px;background:rgba(13,23,38,.86);box-shadow:0 10px 26px rgba(0,0,0,.14);content-visibility:auto;contain-intrinsic-size:92px}
.card-row{display:flex;gap:10px;align-items:center}
.avatar{width:42px;height:42px;border-radius:15px;background:rgba(118,92,255,.16);display:grid;place-items:center;font-weight:950;color:#cfc6ff;flex:0 0 auto}
.avatar.green{background:rgba(34,216,154,.14);color:#8cffd2}.avatar.warn{background:rgba(255,189,74,.15);color:#ffe0a3}.avatar.bad{background:rgba(255,93,125,.14);color:#ffc7d2}
.info{min-width:0;flex:1}.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;min-height:24px;border-radius:999px;padding:0 8px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.06);font-weight:800}
.pill.ok{color:#84ffd1}.pill.warn{color:#ffd88f}.pill.bad{color:#ffbdca}.pill.brand{color:#cfc6ff}
.chips{display:flex;gap:8px;overflow:auto;padding:0 0 10px;margin:0 -2px 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{min-height:36px;border-radius:999px;padding:0 12px;background:rgba(255,255,255,.055);border:1px solid var(--line);color:var(--muted);font-weight:900;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.chip.active{color:#fff;background:rgba(118,92,255,.2);border-color:rgba(118,92,255,.42)}
.chip-input{min-height:46px;border-radius:15px;border:1px solid var(--line);background:#07101d;color:var(--text);padding:0 12px;min-width:0;width:100%;outline:0}
.settings-card{padding:14px;border:1px solid var(--line);border-radius:20px;background:rgba(13,23,38,.86);display:grid;gap:12px}
.category-row{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:10px 11px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06)}
.category-row b{font-size:13px}.danger-icon{width:38px;height:38px;border-radius:13px;background:rgba(255,93,125,.12);border:1px solid rgba(255,93,125,.28);color:#ffb8c6;display:grid;place-items:center}
.card-actions{display:flex;gap:8px;margin-top:11px}.mini{height:38px;border-radius:13px;padding:0 11px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--text);font-weight:850;flex:1;display:flex;align-items:center;justify-content:center;gap:7px}.mini .i{width:16px;height:16px}
.empty{padding:24px 16px;text-align:center;border:1px dashed rgba(158,177,214,.22);border-radius:20px;color:var(--muted);background:rgba(255,255,255,.03)}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:8px 8px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:rgba(7,13,24,.94);border-top:1px solid var(--line)}
.navbtn{height:54px;border-radius:17px;background:transparent;color:var(--muted);font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}.navbtn .i{width:20px;height:20px}.navbtn small{font-size:11px}.navbtn.active{background:rgba(118,92,255,.18);color:#fff}
.fab{position:fixed;right:16px;bottom:calc(86px + env(safe-area-inset-bottom));z-index:28;width:58px;height:58px;border-radius:21px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;font-size:28px;font-weight:900;box-shadow:0 16px 35px rgba(0,0,0,.36);display:grid;place-items:center}.fab .i{width:26px;height:26px;stroke-width:2.4}
.sheet-back{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.52);opacity:0;pointer-events:none;transition:.18s}
.sheet-back.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:55;max-height:88vh;overflow:auto;padding:14px 14px calc(18px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:#091322;border:1px solid var(--line);box-shadow:0 -22px 55px rgba(0,0,0,.44);transform:translateY(105%);transition:.22s ease}
.sheet.show{transform:translateY(0)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet h3{margin:0;font-size:18px}.grid{display:grid;gap:10px}.field{display:grid;gap:5px}.field label{font-size:11px;text-transform:uppercase;color:var(--muted);font-weight:900}.field input,.field select,.field textarea{width:100%;min-height:46px;border-radius:15px;border:1px solid var(--line);background:#07101d;color:var(--text);padding:0 12px;outline:0}.field textarea{padding:12px;min-height:82px;resize:vertical}
.form-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.toast{position:fixed;left:14px;right:14px;bottom:calc(150px + env(safe-area-inset-bottom));z-index:80;padding:13px 14px;border-radius:17px;background:#132139;color:#fff;border:1px solid var(--line);box-shadow:var(--shadow);font-weight:850;transform:translateY(16px);opacity:0;pointer-events:none;transition:.18s}.toast.show{transform:translateY(0);opacity:1}.toast.ok{border-color:rgba(34,216,154,.35)}.toast.bad{border-color:rgba(255,93,125,.45);background:#321421}
.expired{min-height:100vh;display:grid;place-items:center;padding:22px}.expired-box{max-width:420px;width:100%;padding:20px;border-radius:26px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}.expired-box h1{margin:0 0 8px;font-size:24px}.expired-box p{color:var(--muted);line-height:1.5}.hidden{display:none!important}
@media (min-width:680px){.grid.two{grid-template-columns:1fr 1fr}.wrap{padding-top:20px}.sheet{left:50%;right:auto;width:520px;transform:translate(-50%,105%);border-radius:26px}.sheet.show{transform:translate(-50%,0)}}
</style>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, deleteDoc, onSnapshot, collection, getDocs } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "1061544713209",
  appId: "1:1061544713209:web:1c43fc54e43186f4ce4c50",
  measurementId: "G-HTY2JYRQ92"
};

const app = initializeApp(firebaseConfig);
const siteKey = window.FIREBASE_APPCHECK_SITE_KEY || '';
if (siteKey) {
  initializeAppCheck(app, { provider:new ReCaptchaV3Provider(siteKey), isTokenAutoRefreshEnabled:true });
}
const auth = getAuth(app);
const db = getFirestore(app);

const $ = s => document.querySelector(s);
const DEFAULT_CATEGORIES = ['Netflix','Disney','HBO Max','Crunchyroll','Vix','Spotify','Viki Rakuten'];
const DEFAULT_PAYMENT_METHODS = 'Yape / Plin: +51974834197';
const DEFAULT_FINAL_MESSAGE = 'Por favor no cambiar los datos de la cuenta. Muchas gracias.';
const state = {
  uid:null, email:'', active:true, view:'home', query:'', accountCategory:'Todas',
  accounts:[], clients:[], unsub:[],
  settings:{ paymentMethods:DEFAULT_PAYMENT_METHODS, finalMessage:DEFAULT_FINAL_MESSAGE, categories:[...DEFAULT_CATEGORIES] }
};
const icon = name => `<svg class="i"><use href="#i-${name}"></use></svg>`;
const todayISO = () => new Date().toISOString().slice(0,10);
const clean = v => String(v ?? '').trim();
const esc = v => clean(v).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const id = () => (crypto?.randomUUID?.() || ('id_'+Date.now()+'_'+Math.random().toString(16).slice(2)));
const accountsCol = uid => collection(db,'users',uid,'gestor_accounts');
const clientsCol = uid => collection(db,'users',uid,'gestor_clients');
const settingsRef = uid => doc(db,'users',uid,'gestor_config','settings');
const accountRef = itemId => doc(db,'users',state.uid,'gestor_accounts',itemId);
const clientRef = itemId => doc(db,'users',state.uid,'gestor_clients',itemId);

function normalizeSettings(data={}){
  const categories = Array.isArray(data.categories) ? data.categories.map(clean).filter(Boolean) : DEFAULT_CATEGORIES;
  return {
    paymentMethods: clean(data.paymentMethods) || DEFAULT_PAYMENT_METHODS,
    finalMessage: clean(data.finalMessage) || DEFAULT_FINAL_MESSAGE,
    categories: [...new Set(categories)]
  };
}
function accountCategory(a={}){
  if(clean(a.category)) return clean(a.category);
  const p = clean(a.platform).toLowerCase();
  return state.settings.categories.find(cat => p.includes(cat.toLowerCase().split(' ')[0])) || clean(a.platform) || 'Sin categoria';
}

function isExpiredUser(data){
  const status = String(data?.subscriptionStatus || data?.status || '').toLowerCase();
  return data?.active === false || ['expired','vencido','inactive','inactivo','blocked','bloqueado'].includes(status);
}
function dueState(date){
  if (!date) return { label:'Sin fecha', cls:'brand', days:9999 };
  const base = new Date(todayISO()+'T00:00:00');
  const due = new Date(date+'T00:00:00');
  const days = Math.round((due-base)/86400000);
  if (days < 0) return { label:'Vencido', cls:'bad', days };
  if (days === 0) return { label:'Hoy', cls:'warn', days };
  if (days <= 3) return { label:days+' dias', cls:'warn', days };
  return { label:days+' dias', cls:'ok', days };
}
function platformShort(v){ return clean(v) || 'Streaming'; }
function accountName(a){ return [a.platform,a.email].map(clean).filter(Boolean).join(' - ') || 'Cuenta madre'; }
function clientName(c){ return clean(c.name) || 'Cliente sin nombre'; }
function accountUsed(accountId){ return state.clients.filter(c => c.accountId === accountId).length; }
function toast(msg,type='ok'){
  const el = $('#toast');
  el.textContent = msg;
  el.className = 'toast show '+type;
  clearTimeout(toast.t);
  toast.t = setTimeout(()=> el.className='toast', 2600);
}
function setView(view){
  state.view = view;
  state.query = '';
  document.querySelectorAll('.navbtn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  render();
}
function matches(item,q){
  if(!q) return true;
  return JSON.stringify(item).toLowerCase().includes(q.toLowerCase());
}

function render(){
  $('#fab').classList.toggle('hidden', !state.active || state.view === 'settings');
  if(!state.active) return renderExpired();
  if(state.view === 'clients') return renderClients();
  if(state.view === 'accounts') return renderAccounts();
  if(state.view === 'due') return renderDue();
  if(state.view === 'settings') return renderSettings();
  return renderHome();
}
function renderHome(){
  const due = state.clients.map(c => ({...c, due:dueState(c.dueDate)})).sort((a,b)=>a.due.days-b.due.days);
  const expired = due.filter(c => c.due.days < 0).length;
  const today = due.filter(c => c.due.days === 0).length;
  const free = state.accounts.reduce((sum,a)=> sum + Math.max(0, Number(a.capacity||0)-accountUsed(a.id)), 0);
  $('#view').innerHTML = `
    <section class="hero">
      <div class="hello">
        <small>Panel movil</small>
        <h1>Gestion rapida</h1>
        <p>Clientes, cuentas y vencimientos en una vista ligera para celular.</p>
      </div>
      <div class="stats">
        <div class="stat"><b>${expired}</b><span>Vencidos</span></div>
        <div class="stat"><b>${today}</b><span>Vencen hoy</span></div>
        <div class="stat"><b>${free}</b><span>Perfiles libres</span></div>
      </div>
    </section>
    <div class="actions">
      <button class="btn primary" id="newClient">${icon('user-plus')}<span>Nuevo cliente</span></button>
      <button class="btn" id="newAccount">${icon('database-plus')}<span>Nueva cuenta</span></button>
    </div>
    <section class="section">
      <div class="section-head"><h2>Proximos vencimientos</h2><span>${due.length} clientes</span></div>
      <div class="list">${due.slice(0,8).map(clientCard).join('') || empty('No tienes vencimientos pendientes.')}</div>
    </section>`;
  $('#newClient').onclick = () => openClientSheet();
  $('#newAccount').onclick = () => openAccountSheet();
  bindCards();
}
function searchBlock(title,count){
  return `<div class="section-head"><h2>${title}</h2><span>${count}</span></div><div class="search"><input id="q" value="${esc(state.query)}" placeholder="Buscar..." /></div>`;
}
function renderClients(){
  const list = state.clients.filter(c => matches(c,state.query)).sort((a,b)=>dueState(a.dueDate).days-dueState(b.dueDate).days);
  $('#view').innerHTML = searchBlock('Clientes', list.length) + `<div class="list">${list.map(clientCard).join('') || empty('No hay clientes con ese filtro.')}</div>`;
  bindSearch(); bindCards();
}
function renderAccounts(){
  const categories = ['Todas', ...state.settings.categories];
  const list = state.accounts
    .filter(a => state.accountCategory === 'Todas' || accountCategory(a) === state.accountCategory)
    .filter(a => matches(a,state.query))
    .sort((a,b)=>accountName(a).localeCompare(accountName(b)));
  $('#view').innerHTML = searchBlock('Cuentas madre', list.length) + `
    <div class="chips">${categories.map(cat => `<button class="chip ${state.accountCategory===cat?'active':''}" data-cat="${esc(cat)}">${cat==='Todas'?icon('stack'):icon('tag')}<span>${esc(cat)}</span></button>`).join('')}</div>
    <div class="list">${list.map(accountCard).join('') || empty('No hay cuentas con ese filtro.')}</div>`;
  bindSearch(); bindCards();
  document.querySelectorAll('[data-cat]').forEach(b => b.onclick = () => { state.accountCategory = b.dataset.cat; renderAccounts(); });
}
function renderDue(){
  const list = state.clients.map(c => ({...c, due:dueState(c.dueDate)})).filter(c => c.due.days <= 7).sort((a,b)=>a.due.days-b.due.days);
  $('#view').innerHTML = `<section class="section"><div class="section-head"><h2>Vencidos y por vencer</h2><span>${list.length}</span></div><div class="list">${list.map(clientCard).join('') || empty('Nada urgente por ahora.')}</div></section>`;
  bindCards();
}
function renderSettings(){
  const s = state.settings;
  $('#view').innerHTML = `<section class="section">
    <div class="section-head"><h2>Ajustes</h2><span>entrega y categorias</span></div>
    <form class="settings-card" id="settingsForm">
      <div class="field"><label>Medios de pago</label><textarea name="paymentMethods" placeholder="Yape: 999 999 999&#10;Plin: 999 999 999&#10;BCP: ...">${esc(s.paymentMethods)}</textarea></div>
      <div class="field"><label>Mensaje final para entregar cuentas</label><textarea name="finalMessage" placeholder="${esc(DEFAULT_FINAL_MESSAGE)}">${esc(s.finalMessage)}</textarea></div>
      <button class="btn primary">${icon('save')}<span>Guardar ajustes</span></button>
    </form>
    <div class="section">
      <div class="section-head"><h2>Categorias</h2><span>${s.categories.length}</span></div>
      <form class="actions" id="categoryForm">
        <input class="chip-input" name="category" placeholder="Nueva categoria" />
        <button class="btn">${icon('tag')}<span>Agregar</span></button>
      </form>
      <div class="list">${s.categories.map(cat => `<div class="category-row"><b>${esc(cat)}</b><button class="danger-icon" data-del-cat="${esc(cat)}" title="Eliminar">${icon('trash')}</button></div>`).join('')}</div>
    </div>
  </section>`;
  $('#settingsForm').onsubmit = saveSettingsFromForm;
  $('#categoryForm').onsubmit = addCategoryFromForm;
  document.querySelectorAll('[data-del-cat]').forEach(b => b.onclick = () => removeCategory(b.dataset.delCat));
}
function renderExpired(){
  $('#app').innerHTML = `<main class="expired"><div class="expired-box">
    <div class="logo">DS</div>
    <h1>Cuenta sin acceso activo</h1>
    <p>Puedes descargar tus datos en Excel. Para volver a guardar o editar, renueva tu acceso.</p>
    <div class="grid">
      <button class="btn primary" id="expiredExport">Descargar Excel</button>
      <a class="btn ok" href="https://wa.me/51974834197?text=${encodeURIComponent('Hola, quiero renovar mi acceso a Disenos Streaming')}" target="_blank" rel="noopener">Renovar por WhatsApp</a>
      <button class="btn" id="expiredLogout">Cerrar sesion</button>
    </div>
  </div></main>`;
  $('#expiredExport').onclick = exportExcel;
  $('#expiredLogout').onclick = () => signOut(auth);
}
function empty(text){ return `<div class="empty">${esc(text)}</div>`; }
function clientCard(c){
  const ds = dueState(c.dueDate);
  const acc = state.accounts.find(a => a.id === c.accountId);
  const dueActions = state.view === 'due' && ds.days <= 7;
  return `<article class="card" data-client="${esc(c.id)}">
    <div class="card-row"><div class="avatar ${ds.cls}">${esc(clientName(c).slice(0,1).toUpperCase())}</div>
      <div class="info"><b>${esc(clientName(c))}</b><div class="meta">
        <span class="pill ${ds.cls}">${esc(ds.label)}</span><span class="pill">${esc(platformShort(c.platform || acc?.platform))}</span><span class="pill brand">Perfil ${esc(c.profile || '-')}</span>
      </div></div></div>
    <div class="card-actions">
      ${dueActions
        ? `<button class="mini" data-renew="${esc(c.id)}">${icon('calendar')}<span>Renovar</span></button><button class="mini" data-no-renew="${esc(c.id)}">${icon('x')}<span>No renovo</span></button><button class="mini" data-wa-renew="${esc(c.id)}">${icon('message')}<span>WhatsApp</span></button>`
        : `<button class="mini" data-edit-client="${esc(c.id)}">${icon('edit')}<span>Editar</span></button><button class="mini" data-wa="${esc(c.id)}">${icon('message')}<span>WhatsApp</span></button>`}
    </div>
  </article>`;
}
function accountCard(a){
  const used = accountUsed(a.id), cap = Number(a.capacity || 0), free = Math.max(0, cap-used);
  const ds = dueState(a.dueDate);
  const cat = accountCategory(a);
  return `<article class="card" data-account="${esc(a.id)}">
    <div class="card-row"><div class="avatar green">${esc(platformShort(a.platform).slice(0,1).toUpperCase())}</div>
      <div class="info"><b>${esc(accountName(a))}</b><div class="meta">
        <span class="pill brand">${esc(cat)}</span><span class="pill ok">${free} libres</span><span class="pill">${used}/${cap || '-'}</span><span class="pill ${ds.cls}">${esc(ds.label)}</span>
      </div></div></div>
    <div class="card-actions"><button class="mini" data-edit-account="${esc(a.id)}">${icon('edit')}<span>Editar</span></button><button class="mini" data-sell-account="${esc(a.id)}">${icon('user-plus')}<span>Vender perfil</span></button></div>
  </article>`;
}
function bindSearch(){
  const q = $('#q');
  q?.addEventListener('input', e => { state.query = e.target.value; render(); });
  q?.focus();
}
function bindCards(){
  document.querySelectorAll('[data-edit-client]').forEach(b => b.onclick = () => openClientSheet(state.clients.find(c => c.id === b.dataset.editClient)));
  document.querySelectorAll('[data-edit-account]').forEach(b => b.onclick = () => openAccountSheet(state.accounts.find(a => a.id === b.dataset.editAccount)));
  document.querySelectorAll('[data-wa]').forEach(b => b.onclick = () => openWhatsApp(state.clients.find(c => c.id === b.dataset.wa), 'delivery'));
  document.querySelectorAll('[data-wa-renew]').forEach(b => b.onclick = () => openWhatsApp(state.clients.find(c => c.id === b.dataset.waRenew), 'renewal'));
  document.querySelectorAll('[data-renew]').forEach(b => b.onclick = () => renewClient(state.clients.find(c => c.id === b.dataset.renew)));
  document.querySelectorAll('[data-no-renew]').forEach(b => b.onclick = () => markNoRenew(state.clients.find(c => c.id === b.dataset.noRenew)));
  document.querySelectorAll('[data-sell-account]').forEach(b => b.onclick = () => {
    const a = state.accounts.find(x => x.id === b.dataset.sellAccount);
    if(!a) return;
    openClientSheet({ accountId:a.id, platform:a.platform, dueDate:a.dueDate || todayISO(), state:'Activo' });
  });
}

function openSheet(html){
  $('#sheet').innerHTML = html;
  $('#sheetBack').classList.add('show');
  $('#sheet').classList.add('show');
  $('#sheetBack').onclick = closeSheet;
  $('#closeSheet')?.addEventListener('click', closeSheet);
}
function closeSheet(){
  $('#sheetBack').classList.remove('show');
  $('#sheet').classList.remove('show');
}
function openClientSheet(item={}){
  const c = item || {};
  openSheet(`<div class="sheet-head"><h3>${c.id?'Editar cliente':'Nuevo cliente'}</h3><button class="iconbtn" id="closeSheet" aria-label="Cerrar">${icon('x')}</button></div>
    <form id="clientForm" class="grid">
      <div class="field"><label>Nombre</label><input name="name" value="${esc(c.name)}" required></div>
      <div class="field"><label>WhatsApp</label><input name="whatsapp" value="${esc(c.whatsapp)}" inputmode="tel"></div>
      <div class="grid two">
        <div class="field"><label>Plataforma</label><input name="platform" value="${esc(c.platform)}"></div>
        <div class="field"><label>Vence</label><input type="date" name="dueDate" value="${esc(c.dueDate || todayISO())}"></div>
      </div>
      <div class="field"><label>Cuenta madre</label><select name="accountId"><option value="">Sin cuenta</option>${state.accounts.map(a=>`<option value="${esc(a.id)}" ${a.id===c.accountId?'selected':''}>${esc(accountName(a))}</option>`).join('')}</select></div>
      <div class="grid two">
        <div class="field"><label>Perfil</label><input name="profile" value="${esc(c.profile)}"></div>
        <div class="field"><label>PIN</label><input name="pin" value="${esc(c.pin)}"></div>
      </div>
      <div class="field"><label>Estado</label><select name="state">
        ${['Activo','Por vencer','Vencido','Pausado'].map(s=>`<option ${clean(c.state||'Activo')===s?'selected':''}>${s}</option>`).join('')}
      </select></div>
      <div class="field"><label>Notas</label><textarea name="notes">${esc(c.notes)}</textarea></div>
      <div class="form-actions"><button type="button" class="btn ${c.id?'bad':''}" id="deleteClient">${c.id?'Eliminar':'Cancelar'}</button><button class="btn primary">Guardar</button></div>
    </form>`);
  $('#clientForm').onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.currentTarget).entries());
    const account = state.accounts.find(a => a.id === fd.accountId);
    const data = {...c, ...fd, id:c.id || id(), platform:fd.platform || account?.platform || '', updatedAt:new Date().toISOString()};
    if(!c.id) data.createdAt = data.updatedAt;
    await saveItem('client', data);
  };
  $('#deleteClient').onclick = async () => c.id ? removeItem('client', c.id) : closeSheet();
}
function openAccountSheet(item={}){
  const a = item || {};
  openSheet(`<div class="sheet-head"><h3>${a.id?'Editar cuenta':'Nueva cuenta'}</h3><button class="iconbtn" id="closeSheet" aria-label="Cerrar">${icon('x')}</button></div>
    <form id="accountForm" class="grid">
      <div class="grid two">
        <div class="field"><label>Plataforma</label><input name="platform" value="${esc(a.platform)}" required></div>
        <div class="field"><label>Proveedor</label><input name="provider" value="${esc(a.provider)}"></div>
      </div>
      <div class="field"><label>Categoria</label><select name="category">${state.settings.categories.map(cat=>`<option value="${esc(cat)}" ${accountCategory(a)===cat?'selected':''}>${esc(cat)}</option>`).join('')}</select></div>
      <div class="field"><label>WhatsApp proveedor</label><input name="providerWhatsapp" value="${esc(a.providerWhatsapp)}" inputmode="tel"></div>
      <div class="field"><label>Correo</label><input name="email" value="${esc(a.email)}" inputmode="email"></div>
      <div class="grid two">
        <div class="field"><label>Contrasena</label><input name="password" value="${esc(a.password)}"></div>
        <div class="field"><label>Capacidad</label><input name="capacity" type="number" min="1" value="${esc(a.capacity || 5)}"></div>
      </div>
      <div class="field"><label>Vence</label><input type="date" name="dueDate" value="${esc(a.dueDate || todayISO())}"></div>
      <div class="field"><label>Notas</label><textarea name="notes">${esc(a.notes)}</textarea></div>
      <div class="form-actions"><button type="button" class="btn ${a.id?'bad':''}" id="deleteAccount">${a.id?'Eliminar':'Cancelar'}</button><button class="btn primary">Guardar</button></div>
    </form>`);
  $('#accountForm').onsubmit = async e => {
    e.preventDefault();
    const fd = Object.fromEntries(new FormData(e.currentTarget).entries());
    const data = {...a, ...fd, capacity:Number(fd.capacity || 0), id:a.id || id(), updatedAt:new Date().toISOString()};
    if(!a.id) data.createdAt = data.updatedAt;
    await saveItem('account', data);
  };
  $('#deleteAccount').onclick = async () => a.id ? removeItem('account', a.id) : closeSheet();
}
async function saveItem(kind,data){
  try{
    await setDoc(kind === 'account' ? accountRef(data.id) : clientRef(data.id), data, { merge:true });
    toast('Guardado correctamente');
    closeSheet();
  }catch(err){
    console.error(err);
    toast('No se pudo guardar. Revisa permisos o conexion.','bad');
  }
}
async function removeItem(kind,itemId){
  if(!confirm('Eliminar este registro?')) return;
  try{
    await deleteDoc(kind === 'account' ? accountRef(itemId) : clientRef(itemId));
    toast('Eliminado');
    closeSheet();
  }catch(err){
    console.error(err);
    toast('No se pudo eliminar.','bad');
  }
}
async function saveSettings(next){
  state.settings = normalizeSettings(next);
  try{
    await setDoc(settingsRef(state.uid), state.settings, { merge:true });
    toast('Ajustes guardados');
    renderSettings();
  }catch(err){
    console.error(err);
    toast('No se pudieron guardar los ajustes.','bad');
  }
}
async function saveSettingsFromForm(e){
  e.preventDefault();
  const fd = Object.fromEntries(new FormData(e.currentTarget).entries());
  await saveSettings({ ...state.settings, ...fd });
}
async function addCategoryFromForm(e){
  e.preventDefault();
  const fd = new FormData(e.currentTarget);
  const category = clean(fd.get('category'));
  if(!category) return;
  await saveSettings({ ...state.settings, categories:[...state.settings.categories, category] });
}
async function removeCategory(category){
  if(!confirm('Eliminar esta categoria?')) return;
  const categories = state.settings.categories.filter(c => c !== category);
  if(state.accountCategory === category) state.accountCategory = 'Todas';
  await saveSettings({ ...state.settings, categories });
}
function normalizePhone(phone){
  let p = clean(phone).replace(/\D/g,'');
  if(!p) return '';
  if(p.length === 9) p = '51'+p;
  return p;
}
function addDaysISO(date, days){
  const d = new Date((date || todayISO()) + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().slice(0,10);
}
async function renewClient(c){
  if(!c) return;
  const base = dueState(c.dueDate).days > 0 ? c.dueDate : todayISO();
  const nextDate = addDaysISO(base, 30);
  try{
    await setDoc(clientRef(c.id), { ...c, dueDate:nextDate, state:'Activo', updatedAt:new Date().toISOString() }, { merge:true });
    toast('Cliente renovado por 30 dias');
  }catch(err){
    console.error(err);
    toast('No se pudo renovar.','bad');
  }
}
async function markNoRenew(c){
  if(!c) return;
  if(!confirm('Marcar como no renovado?')) return;
  try{
    await setDoc(clientRef(c.id), { ...c, state:'No renovo', updatedAt:new Date().toISOString() }, { merge:true });
    toast('Marcado como no renovado');
  }catch(err){
    console.error(err);
    toast('No se pudo actualizar.','bad');
  }
}
function openWhatsApp(c, mode='delivery'){
  if(!c) return;
  const phone = normalizePhone(c.whatsapp);
  if(!phone) return toast('Ese cliente no tiene WhatsApp.','bad');
  const acc = state.accounts.find(a => a.id === c.accountId);
  const ds = dueState(c.dueDate);
  const service = platformShort(c.platform || acc?.platform);
  let text = '';
  if(mode === 'renewal'){
    let statusText = `tu cuenta de ${service} esta proxima a vencer.`;
    if(ds.days < 0) statusText = `tu cuenta de ${service} ya vencio el ${c.dueDate || 'dia indicado'}.`;
    else if(ds.days === 0) statusText = `tu cuenta de ${service} vence hoy.`;
    else if(ds.days <= 7) statusText = `tu cuenta de ${service} esta por vencer el ${c.dueDate || 'dia indicado'}.`;
    const pay = clean(state.settings.paymentMethods) ? `\n\nMedios de pago:\n${state.settings.paymentMethods}` : '';
    text = `Hola ${clientName(c)}, ${statusText}${pay}`;
  }else{
    const pay = clean(state.settings.paymentMethods) ? `\n\nMedios de pago:\n${state.settings.paymentMethods}` : '';
    const final = clean(state.settings.finalMessage) ? `\n\n${state.settings.finalMessage}` : '';
    text = `Hola ${clientName(c)}, te envio los datos de tu cuenta de ${service}.\n\nPerfil: ${clean(c.profile) || '-'}\nPIN: ${clean(c.pin) || '-'}\nVence: ${clean(c.dueDate) || '-'}${pay}${final}`;
  }
  window.open(`https://wa.me/${phone}?text=${encodeURIComponent(text)}`,'_blank','noopener');
}
function exportExcel(){
  const rows = [];
  rows.push(['Disenos Streaming','Excel con amor hecho por Disenos Streaming','WhatsApp: +51974834197']);
  rows.push([]);
  rows.push(['CLIENTES']);
  rows.push(['Nombre','WhatsApp','Plataforma','Perfil','PIN','Vencimiento','Estado','Cuenta madre','Notas']);
  state.clients.forEach(c => {
    const a = state.accounts.find(x => x.id === c.accountId);
    rows.push([c.name,c.whatsapp,c.platform || a?.platform,c.profile,c.pin,c.dueDate,c.state,accountName(a||{}),c.notes]);
  });
  rows.push([]);
  rows.push(['CUENTAS MADRE']);
  rows.push(['Plataforma','Proveedor','WhatsApp proveedor','Correo','Contrasena','Capacidad','Usados','Vencimiento','Notas']);
  state.accounts.forEach(a => rows.push([a.platform,a.provider,a.providerWhatsapp,a.email,a.password,a.capacity,accountUsed(a.id),a.dueDate,a.notes]));
  const xmlRows = rows.map((r,i)=>`<Row>${r.map(v=>`<Cell ss:StyleID="${i===0?'brand':(String(v)==='CLIENTES'||String(v)==='CUENTAS MADRE')?'section':'cell'}"><Data ss:Type="String">${esc(v)}</Data></Cell>`).join('')}</Row>`).join('');
  const xml = `<?xml version="1.0" encoding="UTF-8"?>
  <Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">
  <Styles>
    <Style ss:ID="brand"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#765CFF" ss:Pattern="Solid"/></Style>
    <Style ss:ID="section"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#18D5A2" ss:Pattern="Solid"/></Style>
    <Style ss:ID="cell"><Borders><Border ss:Position="Bottom" ss:LineStyle="Continuous" ss:Weight="1" ss:Color="#D9E2F3"/></Borders></Style>
  </Styles><Worksheet ss:Name="Mis datos"><Table>${xmlRows}</Table></Worksheet></Workbook>`;
  const blob = new Blob([xml], { type:'application/vnd.ms-excel;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'disenos-streaming-mis-datos.xls';
  a.click();
  URL.revokeObjectURL(a.href);
}
async function loadOnceForExpired(){
  const [acc, cli, cfg] = await Promise.all([getDocs(accountsCol(state.uid)), getDocs(clientsCol(state.uid)), getDoc(settingsRef(state.uid))]);
  state.accounts = acc.docs.map(d => ({id:d.id,...d.data()}));
  state.clients = cli.docs.map(d => ({id:d.id,...d.data()}));
  state.settings = normalizeSettings(cfg.data() || {});
}
function startLive(){
  state.unsub.forEach(fn => fn());
  state.unsub = [
    onSnapshot(accountsCol(state.uid), snap => { state.accounts = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err => { console.error(err); toast('No se pudieron leer cuentas.','bad'); }),
    onSnapshot(clientsCol(state.uid), snap => { state.clients = snap.docs.map(d=>({id:d.id,...d.data()})); render(); }, err => { console.error(err); toast('No se pudieron leer clientes.','bad'); }),
    onSnapshot(settingsRef(state.uid), snap => { state.settings = normalizeSettings(snap.data() || {}); render(); }, err => { console.error(err); toast('No se pudieron leer ajustes.','bad'); })
  ];
}

document.querySelectorAll('.navbtn').forEach(b => b.onclick = () => setView(b.dataset.view));
$('#fab').onclick = () => state.view === 'accounts' ? openAccountSheet() : openClientSheet();
$('#exportTop').onclick = exportExcel;
$('#logoutBtn').onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if(!user){
    window.location.href = `gestor-login.html?next=${encodeURIComponent('/gestor-mobile.html')}`;
    return;
  }
  state.uid = user.uid;
  state.email = user.email || '';
  $('#userLine').textContent = state.email;
  try{
    const userSnap = await getDoc(doc(db,'users',user.uid));
    state.active = !isExpiredUser(userSnap.data() || {});
    if(!state.active){
      await loadOnceForExpired();
      renderExpired();
      return;
    }
    startLive();
    render();
  }catch(err){
    console.error(err);
    toast('No se pudo iniciar el gestor.','bad');
  }
});
</script>
</body>
</html>
