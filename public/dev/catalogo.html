<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<meta name="description" content="Catálogo de streaming. Pide por WhatsApp y recibe tu acceso en minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg,#07050d);color:#fff;-webkit-font-smoothing:antialiased}
.sel{outline:2px dashed transparent;outline-offset:4px;border-radius:8px;transition:outline-color .15s,transform .25s ease,width .25s ease}
.editing .sel:hover{outline-color:color-mix(in srgb,var(--ac) 60%,transparent);cursor:pointer}
.sel.active{outline-color:var(--ac)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:0 24px;height:58px;background:color-mix(in srgb,var(--bg,#07050d) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.nav-brand{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#fff}
.nav-wa{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--wa,#25d366);color:#06251a;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;text-decoration:none}
.hero{padding:72px 0 64px;text-align:center;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 0%,color-mix(in srgb,var(--ac) 38%,transparent),transparent 70%);pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);color:#fff;margin-bottom:22px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-bottom:18px;position:relative}
h1 .ac{color:var(--ac)}
.lead{font-size:18px;line-height:1.6;color:rgba(255,255,255,.72);max-width:560px;margin:0 auto 30px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#06251a;font-weight:700;font-size:16px;padding:15px 28px;border-radius:14px;text-decoration:none;box-shadow:0 12px 30px color-mix(in srgb,var(--wa) 40%,transparent);transition:transform .2s;position:relative}
.cta:hover{transform:translateY(-2px)}
section.block{padding:56px 0}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.sec-head p{color:rgba(255,255,255,.6);max-width:520px;margin:0 auto;line-height:1.55}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
@media(max-width:640px){.pgrid{grid-template-columns:repeat(var(--mob-cols,2),minmax(0,1fr))}}
.pcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,border-color .25s,box-shadow .25s,opacity .6s cubic-bezier(.4,0,.15,1)}
.pcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--ac) 50%,transparent);box-shadow:0 18px 40px rgba(0,0,0,.35)}
.pcard .top{display:flex;align-items:center;gap:12px}
.plogo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.pcard b{font-size:17px}.pcard .slots{font-size:12px;color:rgba(255,255,255,.55)}
.price{font-size:24px;font-weight:800}.price small{font-size:13px;font-weight:600;color:rgba(255,255,255,.55)}
.pbtn{margin-top:auto;text-align:center;background:color-mix(in srgb,var(--ac) 18%,transparent);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);color:#fff;font-weight:700;padding:11px;border-radius:12px;text-decoration:none;transition:background .2s}
.pbtn:hover{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.steps{display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}
.step{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:26px}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-weight:800;margin-bottom:14px}
.step h3{font-size:18px;margin-bottom:8px}.step p{color:rgba(255,255,255,.6);line-height:1.55;font-size:14px}
.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px}
.tcard .stars{color:#fbbf24;margin-bottom:10px}
.tcard p{line-height:1.6;margin-bottom:16px;color:rgba(255,255,255,.85)}
.tcard .who{display:flex;align-items:center;gap:12px}
.tav{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;overflow:hidden}
.tav img{width:100%;height:100%;object-fit:cover}
.faq .qa{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px 20px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.faq .qa b{display:block;margin-bottom:7px}.faq .qa span{color:rgba(255,255,255,.6);font-size:14px;line-height:1.55}
footer{padding:46px 0;text-align:center;color:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.08);margin-top:30px}
.fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--wa);display:grid;place-items:center;box-shadow:0 12px 30px color-mix(in srgb,var(--wa) 45%,transparent);text-decoration:none;font-size:30px;animation:bob 2.4s ease-in-out infinite;z-index:50}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:760px){.steps{grid-template-columns:1fr}.hero{padding:60px 0 44px}}
/* ── motion ── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.4,0,.15,1),transform .6s cubic-bezier(.4,0,.15,1)}
.reveal.in{opacity:1;transform:none}
@keyframes heroIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
/* nav entrance — dispara al crear el elemento, sin depender de .in */
.nav{animation:navSlide .45s cubic-bezier(.4,0,.15,1) both}
@keyframes navSlide{from{transform:translateY(-58px);opacity:0}}
/* hero stagger — CSS puro, sin depender de .in */
.hero .badge{animation:heroIn .5s .15s both cubic-bezier(.34,1.56,.64,1)}
.hero h1{animation:heroIn .6s .32s both cubic-bezier(.4,0,.15,1)}
.hero .lead{animation:heroIn .55s .50s both cubic-bezier(.4,0,.15,1)}
.hero a.cta{animation:heroIn .5s .68s both cubic-bezier(.34,1.56,.64,1)}
/* sheen on accent — sin depender de .in */
.hero .ac{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 6s 1s linear both}
@keyframes sheen{from{background-position:0 0}to{background-position:200% 0}}
/* orbes de fondo — fuera del hero para no ser clippeados por overflow:hidden */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(70px);animation:orbDrift var(--dur,20s) ease-in-out infinite alternate}
@keyframes orbDrift{to{transform:translate(var(--tx,25px),var(--ty,-20px))}}
/* hero glow */
.hero:before{animation:glow 11s ease-in-out infinite alternate}
@keyframes glow{0%{opacity:.65;transform:translateY(0) scale(1)}100%{opacity:1;transform:translateY(10px) scale(1.09)}}
@keyframes sheen{to{background-position:200% 0}}
/* cta ring pulse */
.cta:after{content:"";position:absolute;inset:0;border-radius:14px;animation:ctaPulse 2.8s ease-out infinite;pointer-events:none}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 50%,transparent)}70%,100%{box-shadow:0 0 0 15px transparent}}
/* platform card color glow on hover */
.pcard:hover{border-color:color-mix(in srgb,var(--pc,var(--ac)) 55%,transparent);box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 40px color-mix(in srgb,var(--pc,var(--ac)) 18%,transparent)}
.pcard:hover .plogo{box-shadow:0 0 22px color-mix(in srgb,var(--pc,var(--ac)) 65%,transparent);transition:box-shadow .25s}
.locating{position:relative;z-index:6}
.locating:before{content:"";position:absolute;inset:-7px;border-radius:13px;border:2px solid var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent);animation:locateRing 1.8s ease-out;pointer-events:none}
@keyframes locateRing{0%{opacity:0;transform:scale(1.05)}14%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.locating:after{content:"✎ Editando aquí";position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:locateTag 2s ease forwards;pointer-events:none;z-index:7}
@keyframes locateTag{0%{opacity:0;transform:translateX(-50%) translateY(7px)}13%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){html:not(.force-motion) .reveal{opacity:1;transform:none;transition:none}html:not(.force-motion) .hero .badge,html:not(.force-motion) .hero h1,html:not(.force-motion) .hero .lead,html:not(.force-motion) .hero a.cta,html:not(.force-motion) .nav,html:not(.force-motion) .orb,html:not(.force-motion) .cta:after,html:not(.force-motion) .fab,html:not(.force-motion) .hero:before{animation:none}html:not(.force-motion) .hero .ac{-webkit-text-fill-color:var(--ac);animation:none}}
/* states */
#loader{position:fixed;inset:0;display:grid;place-items:center;gap:14px;color:rgba(255,255,255,.6);background:var(--bg,#07050d);z-index:100}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--ac,#8b40f5);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#notfound{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#notfound h2{font-size:24px}#notfound p{color:rgba(255,255,255,.6);max-width:380px;line-height:1.6}
</style>
</head>
<body>
<div id="loader"><div class="sp"></div><span>Cargando catálogo…</span></div>
<div id="notfound"><h2>Catálogo no disponible</h2><p>Este enlace no existe o fue desactivado. Verifica la dirección con tu proveedor.</p></div>
<main id="root"></main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY',authDomain:'plantillas-bfaeb.firebaseapp.com',projectId:'plantillas-bfaeb',storageBucket:'plantillas-bfaeb.firebasestorage.app',messagingSenderId:'382002543593',appId:'1:382002543593:web:87ad0a3b3c1f32b3daa978'};
const db=getFirestore(initializeApp(firebaseConfig));

const params=new URLSearchParams(location.search);
const slug=params.get('s')||'';
const isPreview=params.get('preview')==='1'||slug==='_preview';
const forceMotion=params.get('motion')==='on';
if(forceMotion) document.documentElement.classList.add('force-motion');

const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sec=(store,id)=>(store.sections||[]).find(s=>s.id===id)||{};
const enabled=(store,id)=>{const s=sec(store,id);return s.enabled!==false;};
const initials=n=>(n||'').trim().split(/\s+/).slice(0,2).map(x=>x[0]||'').join('').toUpperCase()||'CL';

let LAST=null,STYLES={};
function waLink(store,msg){const num=String((store.whatsappPrefix||'')+(store.whatsapp||'')).replace(/\D+/g,'');return num?'https://wa.me/'+num+(msg?'?text='+encodeURIComponent(msg):''):'#';}

function render(store){
  LAST=store;
  const t=store.theme||{};
  const root=document.documentElement.style;
  root.setProperty('--bg',t.background||'#07050d');
  root.setProperty('--ac',t.accent||'#8b40f5');
  root.setProperty('--ac2',t.accent2||'#b06bff');
  root.setProperty('--wa',t.whatsapp||'#25d366');
  document.title=(store.name||'Catálogo')+(store.tagline?' · '+store.tagline:'');
  const h=(sec(store,'hero').data)||{},pl=(sec(store,'platforms').data)||{},st=(sec(store,'steps').data)||{},tt=(sec(store,'testimonials').data)||{},fq=(sec(store,'faq').data)||{};
  const sym=store.currencySymbol||'S/';
  const cols=Math.min(6,Math.max(2,(store.layout&&store.layout.platformColumns)||4));
  const cta=esc(h.cta||'Pedir por WhatsApp');
  const waHero=waLink(store,'Hola '+(store.name||'')+', quiero información sobre los planes disponibles.');
  const ed=(field,key,label,type,tag,cls,content)=>'<'+tag+' class="sel '+cls+'" data-field="'+field+'" data-key="'+key+'" data-label="'+esc(label)+'" data-type="'+esc(type)+'">'+content+'</'+tag+'>';
  let html='';
  html+='<div class="orbs">';
  html+='<div class="orb" style="width:500px;height:500px;background:color-mix(in srgb,var(--ac) 28%,transparent);top:-80px;left:-100px;--dur:22s;--tx:35px;--ty:-25px"></div>';
  html+='<div class="orb" style="width:360px;height:360px;background:color-mix(in srgb,var(--ac2) 22%,transparent);top:60px;right:-80px;--dur:17s;--tx:-28px;--ty:22px;animation-delay:-9s"></div>';
  html+='<div class="orb" style="width:240px;height:240px;background:color-mix(in srgb,var(--wa) 16%,transparent);top:300px;left:42%;--dur:14s;--tx:18px;--ty:-18px;animation-delay:-5s"></div>';
  html+='</div>';
  html+='<nav class="nav"><span class="nav-brand">'+esc(store.name||'Catálogo')+'</span><a class="nav-wa" href="'+waHero+'" target="_blank" rel="noopener">💬 WhatsApp</a></nav>';
  html+='<section class="hero"><div class="wrap reveal">';
  html+=ed('heroBadge','hero-badge','Etiqueta','Insignia','div','badge',esc(h.badge||'Streaming disponible hoy'));
  html+='<h1>'+ed('heroHeadline','hero-headline','Título principal','Encabezado','span','',esc(h.headline||'Más entretenimiento, menos precio'))+' '+ed('heroAccent','hero-accent','Texto resaltado','Encabezado','span','ac',esc(h.accentText||'en un solo lugar'))+'</h1>';
  html+=ed('heroDescription','hero-description','Descripción','Texto','p','lead',esc(h.description||'Elige tu plataforma, escribe por WhatsApp y recibe tu acceso en minutos.'));
  html+='<a class="cta" href="'+waHero+'" target="_blank" rel="noopener">'+ed('heroCta','hero-cta','Botón','Botón','span','',cta)+' →</a>';
  html+='</div></section>';
  if(enabled(store,'platforms')){
    html+='<section class="block"><div class="wrap"><div class="sec-head reveal">'+ed('platformsTitle','platforms-title','Título plataformas','Encabezado','h2','',esc(pl.title||'Plataformas disponibles'))+ed('platformsDesc','platforms-desc','Descripción plataformas','Texto','p','',esc(pl.description||''))+'</div>';
    const mobCols=Math.min(2,Math.max(1,(store.layout&&store.layout.platformMobileColumns)||2));
    html+='<div class="pgrid" style="--cols:'+cols+';--mob-cols:'+mobCols+'">';
    (store.platforms||[]).forEach((p,i)=>{
      const logo=p.logo?'<img src="'+esc(p.logo)+'" style="width:100%;height:100%;object-fit:contain" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:this.alt}))" alt="'+esc((p.platform||'').slice(0,2).toUpperCase())+'">':esc((p.platform||'').slice(0,2).toUpperCase());
      const link=waLink(store,'Hola, me interesa el plan de '+(p.platform||'')+'. ¿Está disponible?');
      html+='<div class="pcard reveal" style="transition-delay:'+(i*55)+'ms;--pc:'+esc(p.color||'var(--ac)')+'"><div class="top"><div class="plogo" style="background:'+esc(p.color||'#8b40f5')+'">'+logo+'</div><div><b>'+esc(p.platform)+'</b><div class="slots">'+(p.freeSlots||0)+' cupos libres</div></div></div><div class="price">'+(p.salePrice?sym+p.salePrice:'Consultar')+' <small>'+(p.salePrice?'/ mes':'')+'</small></div><a class="pbtn" href="'+link+'" target="_blank" rel="noopener">Pedir ahora</a></div>';
    });
    html+='</div></div></section>';
  }
  if(enabled(store,'steps')){
    const steps=[['1','Elige tu plataforma','Mira los planes disponibles y escoge el que necesitas.'],['2','Escríbenos por WhatsApp','Toca el botón y envía tu pedido en segundos.'],['3','Recibe tu acceso','Te entregamos tu cuenta lista para disfrutar en minutos.']];
    html+='<section class="block"><div class="wrap"><div class="sec-head reveal">'+ed('stepsTitle','steps-title','Título pasos','Encabezado','h2','',esc(st.title||'Compra en tres pasos'))+ed('stepsDesc','steps-desc','Descripción pasos','Texto','p','',esc(st.description||''))+'</div><div class="steps">'+steps.map((s,i)=>'<div class="step reveal" style="transition-delay:'+(i*80)+'ms"><div class="n">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>').join('')+'</div></div></section>';
  }
  if(enabled(store,'testimonials')&&(store.testimonials||[]).length){
    html+='<section class="block"><div class="wrap"><div class="sec-head reveal">'+ed('testimonialsTitle','testimonials-title','Título opiniones','Encabezado','h2','',esc(tt.title||'Opiniones de clientes'))+'</div><div class="tgrid">'+(store.testimonials||[]).map((o,i)=>'<div class="tcard reveal" style="transition-delay:'+(i*70)+'ms"><div class="stars">★★★★★</div><p>'+esc(o.text)+'</p><div class="who"><div class="tav">'+(o.photo?'<img src="'+esc(o.photo)+'" alt="">':esc(initials(o.name)))+'</div><b>'+esc(o.name||'Cliente')+'</b></div></div>').join('')+'</div></div></section>';
  }
  if(enabled(store,'faq')){
    const qs=[['¿Cómo recibo mi cuenta?','Te la enviamos por WhatsApp apenas confirmas tu pedido.'],['¿Los precios son mensuales?','Sí, salvo que se indique otra cosa en el plan.'],['¿Tienen garantía?','Sí, damos soporte directo ante cualquier inconveniente.']];
    html+='<section class="block faq"><div class="wrap" style="max-width:760px"><div class="sec-head reveal">'+ed('faqTitle','faq-title','Título FAQ','Encabezado','h2','',esc(fq.title||'Preguntas frecuentes'))+'</div>'+qs.map((q,i)=>'<div class="qa reveal" style="transition-delay:'+(i*70)+'ms"><b>'+q[0]+'</b><span>'+q[1]+'</span></div>').join('')+'</div></section>';
  }
  html+='<footer><div class="wrap">'+ed('footerNote','footer-note','Footer','Texto','div','',esc(store.footerNote||'Más entretenimiento, menos fricción. Pide por WhatsApp y recibe atención directa.'))+'</div></footer>';
  html+='<a class="fab" href="'+waHero+'" target="_blank" rel="noopener" title="WhatsApp">💬</a>';
  document.getElementById('loader').style.display='none';
  document.getElementById('notfound').style.display='none';
  document.getElementById('root').innerHTML=html;
  applyAllStyles();observeReveal();
  if(isPreview)bindSelect();
}

function applyStyle(key,s){document.querySelectorAll('[data-key="'+key+'"]').forEach(el=>{el.style.transform='translate('+(s.x||0)+'px,'+(s.y||0)+'px)';el.style.width=(s.width||100)+'%';el.style.marginLeft=s.align==='left'?'0':'auto';el.style.marginRight=s.align==='right'?'0':'auto';el.style.textAlign=s.align||'center';el.style.color=s.color||'';if((s.width||100)<100)el.style.display='block';});}
function applyAllStyles(){Object.entries(STYLES).forEach(([k,s])=>applyStyle(k,s));}

let _io,_first=true,_lt;
function observeReveal(){
  if(!_first){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));return;}
  _first=false;checkReveal();
  window.addEventListener('scroll',checkReveal,{passive:true});
  window.addEventListener('resize',checkReveal);
}
function checkReveal(){var vh=window.innerHeight||800;document.querySelectorAll('.reveal:not(.in)').forEach(function(el){if(el.getBoundingClientRect().top<vh*0.92)el.classList.add('in');});}
function locate(field){
  const el=document.querySelector('[data-field="'+field+'"]');if(!el)return;
  el.classList.add('in');
  const r=el.getBoundingClientRect();
  const top=Math.max(0,r.top+window.scrollY-(window.innerHeight/2)+r.height/2);
  window.scrollTo({top,behavior:'smooth'});
  document.querySelectorAll('.locating').forEach(x=>x.classList.remove('locating'));
  void el.offsetWidth;el.classList.add('locating');
  clearTimeout(_lt);_lt=setTimeout(()=>el.classList.remove('locating'),2100);
}

// Editor-only interactions (click-to-select + double-click inline edit)
function bindSelect(){
  document.body.classList.add('editing');
  document.querySelectorAll('.sel').forEach(el=>{
    el.addEventListener('click',ev=>{if(el.isContentEditable)return;ev.preventDefault();ev.stopPropagation();document.querySelectorAll('.sel.active').forEach(x=>x.classList.remove('active'));el.classList.add('active');parent.postMessage({type:'CATALOG_SELECT',key:el.dataset.key,label:el.dataset.label,objectType:el.dataset.type},'*');});
    el.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();el.contentEditable='true';el.focus();
      const done=()=>{el.contentEditable='false';el.removeEventListener('blur',done);parent.postMessage({type:'CATALOG_EDIT',field:el.dataset.field,value:el.innerText.trim()},'*');};
      el.addEventListener('blur',done);
      el.addEventListener('keydown',k=>{if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();el.blur();}});
    });
  });
}

window.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;
  if(m.type==='CATALOG_PREVIEW_UPDATE'&&m.store){render(m.store);}
  if(m.type==='CATALOG_APPLY_STYLE'&&m.key){STYLES[m.key]=m.style;applyStyle(m.key,m.style);}
  if(m.type==='CATALOG_LOCATE'&&m.field){locate(m.field);}
});

async function boot(){
  if(isPreview){document.getElementById('loader').querySelector('span').textContent='Vista previa';parent.postMessage({type:'CATALOG_READY'},'*');return;}
  if(!slug){showNotFound();return;}
  try{
    const snap=await getDoc(doc(db,'public_catalogs',slug));
    if(!snap.exists()||snap.data().enabled===false){showNotFound();return;}
    render(snap.data());
  }catch(err){console.error(err);showNotFound();}
}
function showNotFound(){document.getElementById('loader').style.display='none';document.getElementById('notfound').style.display='flex';}
boot();
</script>
</body>
</html>
