<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tienda</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="preconnect" href="https://www.gstatic.com">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    /* === Variables base — sobreescritas por la plantilla elegida === */
    :root{
      --bg:#0d0d1a;
      --surface:#1a1a2e;
      --surface-2:#252540;
      --accent:#7c3aed;
      --text:#f0f0f5;
      --text-muted:#888899;
      --wa:#25D366;
      --wa-hover:#1eb859;
      --radius:16px;
      --card-shadow:0 4px 24px rgba(0,0,0,.4);
      --border:rgba(255,255,255,.07);
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
      background:var(--bg);
      color:var(--text);
      min-height:100vh;
      transition:background .3s,color .3s;
    }

    /* === Header === */
    .header{
      text-align:center;
      padding:48px 24px 28px;
      position:relative;
    }
    .header-avatar{
      width:72px;height:72px;
      background:var(--surface-2);
      border:2px solid var(--border);
      border-radius:50%;
      margin:0 auto 16px;
      display:flex;align-items:center;justify-content:center;
      font-size:30px;
      box-shadow:var(--card-shadow);
    }
    .header-name{font-size:1.8rem;font-weight:800;letter-spacing:-.5px}
    .header-tagline{color:var(--text-muted);margin-top:6px;font-size:.9rem}

    /* === Grid === */
    .grid{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:14px;
      padding:8px 14px 32px;
      max-width:960px;
      margin:0 auto;
    }
    @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr);gap:18px;padding:8px 20px 40px}}
    @media(min-width:800px){.grid{grid-template-columns:repeat(4,1fr)}}

    /* === Card === */
    .card{
      background:var(--surface);
      border-radius:var(--radius);
      padding:20px 14px 16px;
      display:flex;flex-direction:column;align-items:center;gap:9px;
      box-shadow:var(--card-shadow);
      border:1px solid var(--border);
      transition:transform .15s,box-shadow .15s;
    }
    .card:hover{transform:translateY(-3px);box-shadow:0 10px 36px rgba(0,0,0,.5)}

    .card-logo{width:56px;height:56px;object-fit:contain;border-radius:12px}
    .card-logo-fallback{
      width:56px;height:56px;border-radius:12px;
      background:var(--platform-color,var(--accent));
      display:flex;align-items:center;justify-content:center;
      font-size:26px;color:#fff;
    }
    .card-name{font-size:.82rem;font-weight:700;text-align:center;color:var(--text)}
    .card-price{
      font-size:1.3rem;font-weight:800;
      color:var(--platform-color,var(--accent));
      text-align:center;line-height:1;
    }
    .card-price span{font-size:.72rem;font-weight:500;color:var(--text-muted)}
    .card-consult{font-size:.78rem;color:var(--text-muted);font-style:italic}
    .card-wa{
      margin-top:2px;width:100%;
      background:var(--wa);color:#fff;
      border:none;border-radius:10px;
      padding:10px 8px;
      font-size:.78rem;font-weight:700;
      cursor:pointer;text-align:center;
      text-decoration:none;display:block;
      transition:background .15s,transform .1s;
    }
    .card-wa:hover{background:var(--wa-hover);transform:scale(1.02)}
    .card-wa:active{transform:scale(.98)}

    /* === Footer === */
    .footer{
      text-align:center;padding:20px 16px 48px;
      color:var(--text-muted);font-size:.72rem;
      border-top:1px solid var(--border);
      max-width:960px;margin:0 auto;
    }
    .footer strong{color:var(--text-muted)}
    .footer a{color:var(--text-muted);text-decoration:none}

    /* === Skeleton loading === */
    #loading{padding:0 14px 32px;max-width:960px;margin:0 auto}
    #loading .grid{padding:0}
    .skeleton-card{
      background:var(--surface);border-radius:var(--radius);height:195px;
      animation:pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.75}}

    /* === Estado de error === */
    .state-screen{
      min-height:55vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      gap:12px;padding:40px 24px;text-align:center;
    }
    .state-icon{font-size:52px}
    .state-title{font-size:1.25rem;font-weight:700}
    .state-sub{color:var(--text-muted);font-size:.9rem;max-width:320px}
  </style>
</head>
<body>

<div id="app">
  <div class="header">
    <div class="header-avatar" id="headerAvatar">🛍️</div>
    <div class="header-name" id="storeName">Cargando tienda…</div>
    <div class="header-tagline" id="storeTagline"></div>
  </div>

  <div id="loading">
    <div class="grid">
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
      <div class="skeleton-card"></div>
    </div>
  </div>

  <div id="gridWrap" hidden>
    <div class="grid" id="grid"></div>
  </div>

  <div id="errorScreen" hidden class="state-screen">
    <div class="state-icon">🔒</div>
    <div class="state-title" id="errorTitle">Tienda no disponible</div>
    <div class="state-sub" id="errorSub">Esta tienda no existe o no está activa en este momento.</div>
  </div>

  <div class="footer" id="footer" hidden>
    <p id="footerUpdated"></p>
    <p style="margin-top:6px">Impulsado por <strong>Streaming Manager</strong></p>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY',
  authDomain: 'plantillas-bfaeb.firebaseapp.com',
  projectId: 'plantillas-bfaeb',
  storageBucket: 'plantillas-bfaeb.firebasestorage.app',
  messagingSenderId: '382002543593',
  appId: '1:382002543593:web:87ad0a3b3c1f32b3daa978'
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

// ── Configuración ──────────────────────────────────────────────
const CACHE_KEY = 'cat_v1';
const CACHE_TTL = 30 * 60 * 1000; // 30 min — 1 read por sesión/30 min

const PLATFORM_COLORS = {
  'Netflix':'#E50914','Spotify':'#1DB954','YouTube Premium':'#FF0000',
  'Prime Video':'#00A8E0','Disney+':'#0070F3','Max':'#7B2FBE',
  'Crunchyroll':'#F47521','Paramount+':'#0064FF','Viki':'#1A9A5B',
  'ViX':'#E8007D','Apple TV':'#555555','Deezer':'#A238FF',
  'Google One':'#4285F4','Canva':'#00C4CC','ChatGPT':'#10A37F',
  'Capcut':'#000000','IPTV':'#0088cc','Cable Go':'#e74c3c',
};

const LOGO_MAP = {
  'Netflix':'Netflix.svg','Spotify':'Spotify.svg','YouTube Premium':'youtube.svg',
  'Prime Video':'primevideo.svg','Disney+':'Disney.svg','Max':'max.svg',
  'Crunchyroll':'Crunchyroll.svg','Paramount+':'Paramount.svg','Viki':'viki.svg',
  'ViX':'vix.svg','Apple TV':'Apple tv.svg','Deezer':'Deezer.svg',
  'Google One':'Google One.svg','Canva':'Canva.svg','ChatGPT':'Chat GPT.svg',
  'Capcut':'Capcut.svg','IPTV':'IPTV.svg','Cable Go':'Cable Go.svg',
};

const FALLBACK_EMOJI = {
  'Netflix':'🎬','Spotify':'🎵','YouTube Premium':'▶️','Prime Video':'📦',
  'Disney+':'🏰','Max':'🎭','Crunchyroll':'⛩️','Paramount+':'⛰️',
  'Viki':'🌸','ViX':'📺','Apple TV':'🍎','Deezer':'🎧',
  'Google One':'☁️','Canva':'🎨','ChatGPT':'🤖','Capcut':'✂️',
};

// ── Helpers ────────────────────────────────────────────────────
const $id = id => document.getElementById(id);
const slug = () => new URLSearchParams(location.search).get('s') || new URLSearchParams(location.search).get('tienda') || '';

function getCached(s){
  try{
    const raw = localStorage.getItem(`${CACHE_KEY}_${s}`);
    if(!raw) return null;
    const {data,ts} = JSON.parse(raw);
    return (Date.now()-ts < CACHE_TTL) ? data : null;
  }catch{return null;}
}
function setCache(s,data){
  try{ localStorage.setItem(`${CACHE_KEY}_${s}`, JSON.stringify({data,ts:Date.now()})); }catch{}
}

function loadTemplate(name){
  if(!name || name==='default') return; // default = base CSS en este archivo
  const l = document.createElement('link');
  l.rel='stylesheet';
  l.href=`/templates/catalogo-${name}.css`;
  document.head.appendChild(l);
}

function fmtDate(ts){
  if(!ts) return '';
  const d = ts.toDate ? ts.toDate() : new Date(ts.seconds ? ts.seconds*1000 : ts);
  return d.toLocaleDateString('es-PE',{day:'2-digit',month:'long',year:'numeric'});
}

function pColor(platform){ return PLATFORM_COLORS[platform]||'#7c3aed'; }

function logoHtml(platform){
  const file = LOGO_MAP[platform];
  const color = pColor(platform);
  const emoji = FALLBACK_EMOJI[platform]||'📺';
  if(file){
    return `<img class="card-logo" src="/logos/${encodeURIComponent(file)}" alt="${platform}"
      loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="card-logo-fallback" style="display:none;--platform-color:${color}">${emoji}</div>`;
  }
  return `<div class="card-logo-fallback" style="--platform-color:${color}">${emoji}</div>`;
}

function buildWaHref(platform, salePrice, whatsapp, prefix, symbol){
  const priceText = salePrice>0 ? ` por ${symbol}${salePrice}/mes` : '';
  const msg = encodeURIComponent(`Hola! Me interesa ${platform}${priceText}. ¿Está disponible? 😊`);
  return `https://wa.me/${prefix}${whatsapp}?text=${msg}`;
}

function cardHtml(p, store){
  const color  = pColor(p.platform);
  const href   = buildWaHref(p.platform, p.salePrice, store.whatsapp, store.whatsappPrefix||'51', store.currencySymbol||'S/');
  const price  = p.salePrice>0
    ? `<div class="card-price" style="color:${color}">${store.currencySymbol||'S/'}&nbsp;${p.salePrice}<span>&nbsp;/mes</span></div>`
    : `<div class="card-consult">Consultar precio</div>`;
  return `
    <div class="card">
      ${logoHtml(p.platform)}
      <div class="card-name">${p.platform}</div>
      ${price}
      <a class="card-wa" href="${href}" target="_blank" rel="noopener noreferrer">Pedir por WhatsApp →</a>
    </div>`;
}

function renderStore(store){
  loadTemplate(store.template);
  document.title = `${store.name} — Streaming`;
  $id('storeName').textContent  = store.name;
  $id('storeTagline').textContent = store.tagline || 'Plataformas de streaming disponibles';
  $id('headerAvatar').textContent = store.emoji || '🛍️';

  if(!store.platforms?.length){
    showError('Sin plataformas disponibles','No hay plataformas activas en este momento. Vuelve pronto.');
    return;
  }

  $id('grid').innerHTML = store.platforms.map(p => cardHtml(p, store)).join('');
  $id('loading').hidden    = true;
  $id('gridWrap').hidden   = false;

  const upd = fmtDate(store.updatedAt);
  if(upd) $id('footerUpdated').textContent = `Última actualización: ${upd}`;
  $id('footer').hidden = false;
}

function showError(title, sub){
  $id('loading').hidden = true;
  if(title) $id('errorTitle').textContent = title;
  if(sub)   $id('errorSub').textContent   = sub;
  $id('errorScreen').hidden = false;
}

// ── Main ───────────────────────────────────────────────────────
async function main(){
  const s = slug();
  if(!s){ showError('URL inválida','No se indicó ninguna tienda. Verifica el enlace.'); return; }

  const cached = getCached(s);
  if(cached){ renderStore(cached); return; }

  try{
    const snap = await getDoc(doc(db,'public_catalogs',s));
    if(!snap.exists()){ showError(); return; }
    const data = snap.data();
    if(!data.enabled){ showError('Tienda desactivada','Esta tienda no está activa. Contacta al vendedor.'); return; }
    setCache(s, data);
    renderStore(data);
  }catch(e){
    console.error('catalogo error:',e);
    showError('Error de conexión','No se pudo cargar la tienda. Intenta de nuevo en unos momentos.');
  }
}

main();
</script>
</body>
</html>
