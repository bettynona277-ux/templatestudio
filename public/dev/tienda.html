<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="format-detection" content="telephone=no">
<title>Tienda de streaming</title>
<meta name="description" content="Cuentas y perfiles de streaming con atención por WhatsApp.">
<meta name="theme-color" content="#0b0b12">
<!--TIENDA_OG-->
<link rel="icon" href="/icons/icon-192.png" id="tiendaFavicon">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="tiendaTouchIcon">
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#0b0b12;color:#f5f5fa;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  #app:empty{display:none}
  .ts-state{min-height:100vh;min-height:100dvh;box-sizing:border-box}
  .ts-state[hidden]{display:none}

  /* ---------- Skeleton ---------- */
  .ts-skel{padding:18px 18px 40px;max-width:1080px;margin:0 auto;box-sizing:border-box}
  .ts-sk{position:relative;overflow:hidden;background:#171725;border-radius:14px}
  .ts-sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 45%,rgba(167,139,250,.12) 50%,rgba(255,255,255,.07) 55%,transparent);
    animation:ts-shimmer 1.5s ease-in-out infinite}
  @keyframes ts-shimmer{to{transform:translateX(100%)}}
  .ts-skel-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .ts-skel-logo{width:46px;height:46px;border-radius:50%}
  .ts-skel-name{width:150px;height:18px;border-radius:9px}
  .ts-skel-btn{width:96px;height:36px;border-radius:999px;margin-left:auto}
  .ts-skel-hero{height:min(52vh,380px);border-radius:22px;margin-bottom:22px;
    background:radial-gradient(120% 90% at 20% 10%,#2a1f52 0,#171725 55%)}
  .ts-skel-line{height:14px;border-radius:7px;margin:10px 0}
  .ts-skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
  .ts-skel-card{height:190px;border-radius:18px}
  .ts-skel-pulse{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:7px}
  .ts-skel-pulse i{width:8px;height:8px;border-radius:50%;background:#8b5cf6;opacity:.35;animation:ts-dot 1.1s ease-in-out infinite}
  .ts-skel-pulse i:nth-child(2){animation-delay:.15s}.ts-skel-pulse i:nth-child(3){animation-delay:.3s}
  @keyframes ts-dot{50%{opacity:1;transform:translateY(-4px)}}

  /* ---------- Mensajes (404, pausa, error) ---------- */
  .ts-msg{display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(80% 60% at 50% 0%,rgba(124,58,237,.28),transparent 70%),
               radial-gradient(60% 50% at 100% 100%,rgba(34,211,238,.14),transparent 70%),#0b0b12}
  .ts-card{width:100%;max-width:420px;text-align:center;padding:34px 26px 28px;border-radius:24px;box-sizing:border-box;
    background:rgba(23,23,37,.85);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);
    animation:ts-in .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes ts-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .ts-icon{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(135deg,#7c3aed,#22d3ee);color:#fff;animation:ts-float 3.5s ease-in-out infinite}
  .ts-icon svg{width:36px;height:36px}
  @keyframes ts-float{50%{transform:translateY(-6px)}}
  .ts-card h1{font-size:1.35rem;line-height:1.25;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
  .ts-card p{margin:0 0 22px;color:#b7b7c9;font-size:.98rem;line-height:1.5}
  .ts-actions{display:flex;flex-direction:column;gap:10px}
  .ts-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;
    border:0;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#7c3aed,#6d28d9);box-shadow:0 10px 26px rgba(124,58,237,.35);transition:transform .15s}
  .ts-btn:active{transform:scale(.97)}
  .ts-btn.ts-ghost{background:transparent;box-shadow:none;border:1px solid rgba(255,255,255,.14);color:#e7e7f2}
  .ts-btn:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
  .ts-small{margin-top:14px;font-size:.82rem;color:#8a8aa3;min-height:1.2em}
  .ts-brand{margin-top:22px;font-size:.78rem;color:#6f6f88}
  .ts-brand a{color:#a78bfa;text-decoration:none}
  @media (prefers-reduced-motion:reduce){
    .ts-sk::after,.ts-icon,.ts-skel-pulse i,.ts-card{animation:none}
  }
</style>
<script>
window.LANDING_BASE = location.pathname.indexOf('/dev/') === 0 ? '/dev/' : '/';
document.write('<script src="' + window.LANDING_BASE + 'js/landing-core.js?v=3"><\/script>');
</script>
<script>
/* Arranca la lectura de Firestore cuanto antes (en paralelo con las plantillas). */
(function () {
  'use strict';
  var SLUG_RE = /^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$/;
  function readSlug() {
    var m = location.pathname.match(/^\/s\/([^/]+)\/?$/);
    var raw = m ? m[1] : (new URLSearchParams(location.search).get('s') || '');
    try { raw = decodeURIComponent(raw); } catch (_) {}
    raw = String(raw).trim().toLowerCase();
    return SLUG_RE.test(raw) ? raw : '';
  }

  /* Convierte un Value del formato REST de Firestore a JSON plano. */
  function fromRestValue(v) {
    if (v === null || typeof v !== 'object') return v === undefined ? null : v;
    if ('nullValue' in v) return null;
    if ('stringValue' in v) return String(v.stringValue);
    if ('booleanValue' in v) return v.booleanValue === true || v.booleanValue === 'true';
    if ('integerValue' in v) {
      var n = Number(v.integerValue);
      return Number.isSafeInteger(n) ? n : String(v.integerValue);
    }
    if ('doubleValue' in v) return Number(v.doubleValue);
    if ('timestampValue' in v) { var t = Date.parse(v.timestampValue); return Number.isFinite(t) ? t : String(v.timestampValue); }
    if ('referenceValue' in v) return String(v.referenceValue);
    if ('bytesValue' in v) return String(v.bytesValue);
    if ('geoPointValue' in v) {
      var g = v.geoPointValue || {};
      return { latitude: Number(g.latitude) || 0, longitude: Number(g.longitude) || 0 };
    }
    if ('arrayValue' in v) {
      var vals = (v.arrayValue && Array.isArray(v.arrayValue.values)) ? v.arrayValue.values : [];
      return vals.map(fromRestValue);
    }
    if ('mapValue' in v) return fromRestFields(v.mapValue && v.mapValue.fields);
    return null;
  }
  function fromRestFields(fields) {
    var out = {};
    if (!fields || typeof fields !== 'object') return out;
    Object.keys(fields).forEach(function (k) {
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
      out[k] = fromRestValue(fields[k]);
    });
    return out;
  }

  /* Resultado: {status:'ok',data} | {status:'notfound'} | {status:'error',error} */
  function loadCatalog(slug) {
    if (!slug) return Promise.resolve({ status: 'notfound' });
    var core = window.LandingCore;
    if (!core || !core.FIREBASE) return Promise.resolve({ status: 'error', error: new Error('core') });
    var url = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(core.FIREBASE.projectId) +
      '/databases/(default)/documents/' + core.COLLECTION + '/' + encodeURIComponent(slug) +
      '?key=' + encodeURIComponent(core.FIREBASE.apiKey);
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 12000) : 0;
    return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
      .then(function (res) {
        if (res.status === 404 || res.status === 403) return { status: 'notfound' };
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json().then(function (doc) {
          if (!doc || !doc.fields) return { status: 'notfound' };
          return { status: 'ok', data: fromRestFields(doc.fields) };
        });
      })
      .catch(function (error) { return { status: 'error', error: error }; })
      .then(function (r) { clearTimeout(timer); return r; });
  }

  var slug = readSlug();
  window.TiendaPublica = {
    slug: slug, fromRestValue: fromRestValue, fromRestFields: fromRestFields, loadCatalog: loadCatalog,
    first: loadCatalog(slug)
  };
})();
</script>
</head>
<body>
<main id="app" aria-live="polite"></main>

<section id="tsLoading" class="ts-state" aria-busy="true" aria-label="Cargando tienda">
  <div class="ts-skel" aria-hidden="true">
    <div class="ts-skel-top"><div class="ts-sk ts-skel-logo"></div><div class="ts-sk ts-skel-name"></div><div class="ts-sk ts-skel-btn"></div></div>
    <div class="ts-sk ts-skel-hero"></div>
    <div class="ts-sk ts-skel-line" style="width:62%"></div>
    <div class="ts-sk ts-skel-line" style="width:40%"></div>
    <div class="ts-skel-grid">
      <div class="ts-sk ts-skel-card"></div><div class="ts-sk ts-skel-card"></div>
      <div class="ts-sk ts-skel-card"></div><div class="ts-sk ts-skel-card"></div>
    </div>
  </div>
  <div class="ts-skel-pulse" aria-hidden="true"><i></i><i></i><i></i></div>
</section>

<section id="tsMessage" class="ts-state ts-msg" hidden>
  <div class="ts-card" role="alert">
    <div class="ts-icon" id="tsIcon"></div>
    <h1 id="tsTitle"></h1>
    <p id="tsText"></p>
    <div class="ts-actions" id="tsActions"></div>
    <div class="ts-small" id="tsSmall" aria-live="polite"></div>
    <div class="ts-brand">Hecho con <a href="https://disenosstreaming.com/" rel="noopener">Diseños Streaming</a></div>
  </div>
</section>

<script>
(function () {
  'use strict';
  var T = window.TiendaPublica;
  var $ = function (id) { return document.getElementById(id); };
  var ICONS = {
    notfound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>',
    paused: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>'
  };
  var retryTimer = 0, countdownTimer = 0, attempt = 0, rendered = false;
  var params = new URLSearchParams(location.search);
  var NO_REDIRECT = params.has('r');
  if (NO_REDIRECT && history.replaceState) {
    params.delete('r');
    try { history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash); } catch (_) {}
  }
  var MAX_AUTO = 6;

  function setMeta(name, value, attr) {
    attr = attr || 'name';
    var el = document.head.querySelector('meta[' + attr + '="' + name + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
    el.setAttribute('content', value);
  }
  function show(which) {
    $('tsLoading').hidden = which !== 'loading';
    $('tsMessage').hidden = which !== 'message';
  }
  function clearTimers() { clearTimeout(retryTimer); clearInterval(countdownTimer); retryTimer = countdownTimer = 0; }

  function message(kind, title, text, actions, small) {
    clearTimers();
    $('app').innerHTML = ''; $('app').className = '';
    $('tsIcon').innerHTML = ICONS[kind] || ICONS.error;
    $('tsTitle').textContent = title;
    $('tsText').textContent = text;
    var box = $('tsActions'); box.innerHTML = '';
    (actions || []).forEach(function (a) {
      var el = document.createElement(a.href ? 'a' : 'button');
      el.className = 'ts-btn' + (a.ghost ? ' ts-ghost' : '');
      el.textContent = a.label;
      if (a.href) { el.href = a.href; el.rel = 'noopener'; } else { el.type = 'button'; el.addEventListener('click', a.onClick); }
      box.appendChild(el);
    });
    $('tsSmall').textContent = small || '';
    $('tsMessage').setAttribute('data-kind', kind);
    document.title = title;
    show('message');
  }
  var HOME = { label: 'Ir a Diseños Streaming', href: 'https://disenosstreaming.com/' };

  function showNotFound() {
    message('notfound', 'Esta tienda no existe o cambió de enlace',
      'Revisa que el enlace esté bien escrito o pide a tu vendedor su enlace actualizado.', [HOME]);
  }
  function showPaused(data) {
    var name = (data && typeof data.name === 'string' && data.name.trim()) ? data.name.trim().slice(0, 80) : '';
    var acts = [];
    var phone = data && window.LandingCore ? LandingCore.phoneDigits(data.whatsapp) : '';
    if (phone) acts.push({ label: 'Escribir por WhatsApp', href: LandingCore.whatsappUrl(phone, 'Hola, vi tu tienda' + (name ? ' ' + name : '') + ' y quiero información.') });
    acts.push({ label: 'Ir a Diseños Streaming', href: HOME.href, ghost: acts.length > 0 });
    message('paused', 'Esta tienda está en pausa',
      (name ? name + ' pausó su tienda por un momento. ' : 'El dueño pausó su tienda por un momento. ') + 'Vuelve a intentarlo más tarde.', acts);
  }
  function showError(auto) {
    var actions = [{ label: 'Reintentar ahora', onClick: function () { attempt = 0; load(); } }];
    message('error', 'No pudimos cargar la tienda',
      'Parece que hay un problema de conexión. Revisa tu internet y vuelve a intentarlo.', actions);
    if (!auto) return;
    // Reintento automático con backoff exponencial (2s, 4s, 8s… máx 30s) + jitter.
    if (attempt >= MAX_AUTO) { $('tsSmall').textContent = 'Toca “Reintentar ahora” cuando tengas conexión.'; return; }
    var wait = Math.min(30000, 2000 * Math.pow(2, attempt)) + Math.floor(Math.random() * 400);
    attempt++;
    var until = Date.now() + wait;
    var tick = function () {
      var s = Math.max(0, Math.ceil((until - Date.now()) / 1000));
      $('tsSmall').textContent = 'Reintentando automáticamente en ' + s + ' s…';
    };
    tick(); countdownTimer = setInterval(tick, 500);
    retryTimer = setTimeout(function () { clearTimers(); load(); }, wait);
  }
  function showTemplatesError() {
    message('error', 'No pudimos cargar el diseño de la tienda',
      'Vuelve a cargar la página en unos segundos.', [{ label: 'Volver a cargar', onClick: function () { location.reload(); } }]);
  }

  function applyHead(d) {
    document.title = d.name + (d.tagline ? ' · ' + d.tagline : '');
    var desc = d.tagline || d.heroSubtitle || ('Planes de streaming de ' + d.name);
    setMeta('description', desc);
    setMeta('theme-color', d.theme.primary);
    setMeta('og:title', d.name, 'property');
    setMeta('og:description', desc, 'property');
    if (d.logoUrl) {
      $('tiendaFavicon').href = d.logoUrl;
      $('tiendaTouchIcon').href = d.logoUrl;
    }
    document.documentElement.style.colorScheme = d.theme.mode === 'light' ? 'light' : 'dark';
    if (d.theme.mode === 'light') document.documentElement.style.background = document.body.style.background = '#ffffff';
  }

  /* Solo se descarga el archivo de la plantilla que usa la tienda (a: cine/neon/aurora, b: pop/premium/kinetic, c: bio). */
  var TEMPLATE_FILES = { cine: 'a', neon: 'a', aurora: 'a', pop: 'b', premium: 'b', kinetic: 'b', bio: 'c' };
  var loadingFiles = {};
  function hasTemplate(id) {
    var core = window.LandingCore;
    return !!(core && core.listTemplates().some(function (t) { return t.id === id; }));
  }
  function loadTemplate(id) {
    if (hasTemplate(id)) return Promise.resolve(id);
    var file = TEMPLATE_FILES[id] || 'a';
    if (!loadingFiles[file]) {
      loadingFiles[file] = new Promise(function (resolve, reject) {
        var s = document.createElement('script');
        s.src = window.LANDING_BASE + 'js/landing-templates-' + file + '.js?v=3';
        s.async = true;
        s.onload = function () { resolve(); };
        s.onerror = function () { delete loadingFiles[file]; s.remove(); reject(new Error('plantilla ' + file)); };
        document.head.appendChild(s);
      });
    }
    return loadingFiles[file].then(function () {
      if (hasTemplate(id)) return id;
      if (window.LandingCore.listTemplates().length) return window.LandingCore.listTemplates()[0].id;
      throw new Error('sin plantillas');
    });
  }

  function renderStore(raw) {
    var core = window.LandingCore;
    if (!core || typeof core.render !== 'function') { showTemplatesError(); return; }
    if (raw.enabled === false) { showPaused(raw); return; }
    var d = core.normalize(raw, raw.ownerUid);
    var want = TEMPLATE_FILES[d.template] ? d.template : core.DEFAULTS.template;
    rendered = true; // evita pintar dos veces mientras llega la plantilla
    loadTemplate(want).then(function (id) { paint(core, d, id); }, function (err) {
      console.error('[tienda] no se pudo cargar la plantilla', err);
      rendered = false;
      showTemplatesError();
    });
  }
  function paint(core, d, id) {
    try {
      clearTimers();
      show('none');
      core.render($('app'), d, { template: id });
      rendered = true;
      applyHead(d);
    } catch (err) {
      console.error('[tienda] error al pintar', err);
      showTemplatesError();
    }
  }

  // Enlace viejo: el editor deja el doc anterior con redirectTo (normalize lo descarta: se lee del JSON crudo).
  // Un solo salto: con ?r=1 no se vuelve a redirigir.
  function redirectTarget(raw) {
    var core = window.LandingCore, to = raw && raw.redirectTo;
    if (!core || typeof to !== 'string' || NO_REDIRECT) return '';
    to = to.trim().toLowerCase();
    return (!core.slugError(to) && to !== T.slug) ? to : '';
  }
  function handle(result) {
    if (rendered) return;
    if (result.status === 'ok') {
      var to = redirectTarget(result.data);
      if (to) { rendered = true; location.replace(window.LANDING_BASE === '/dev/' ? '/dev/tienda.html?s=' + encodeURIComponent(to) + '&r=1' : '/s/' + to + '?r=1'); return; }
      renderStore(result.data);
    }
    else if (result.status === 'notfound') showNotFound();
    else { console.warn('[tienda] error de red', result.error); showError(true); }
  }

  function load() {
    clearTimers();
    show('loading');
    T.loadCatalog(T.slug).then(handle);
  }

  function start() {
    if (!T) { showTemplatesError(); return; }
    if (!T.slug) { showNotFound(); return; }
    T.first.then(handle);
    // Si estaba sin internet, reintenta en cuanto vuelva la conexión.
    window.addEventListener('online', function () { if (!rendered && !$('tsMessage').hidden && $('tsMessage').getAttribute('data-kind') === 'error' && T.slug) { attempt = 0; load(); } });
  }
  // La plantilla se descarga después de leer Firestore (ver loadTemplate).
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
