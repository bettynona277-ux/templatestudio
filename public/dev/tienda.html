<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="format-detection" content="telephone=no">
<title>Tienda de streaming</title>
<meta name="description" content="Cuentas y perfiles de streaming con atención por WhatsApp.">
<meta name="theme-color" content="#0b0b12">
<!--TIENDA_OG-->
<link rel="icon" href="/icons/icon-192.png" id="tiendaFavicon">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" id="tiendaTouchIcon">
<!-- Conexiones tempranas: Firestore (fetch CORS → crossorigin), imágenes de Firebase Storage (<img> sin CORS → sin crossorigin).
     Cloudinary solo para portadas antiguas: dns-prefetch (barato) en vez de preconnect. -->
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="preconnect" href="https://firebasestorage.googleapis.com">
<link rel="dns-prefetch" href="https://res.cloudinary.com">
<!--TIENDA_DATA-->
<style>
  html,body{margin:0;padding:0;min-height:100%;background:#0b0b12;color:#f5f5fa;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,sans-serif;-webkit-text-size-adjust:100%}
  body{overflow-x:hidden}
  #app:empty{display:none}
  .ts-state{min-height:100vh;min-height:100dvh;box-sizing:border-box}
  .ts-state[hidden]{display:none}

  /* ---------- Skeleton ---------- */
  .ts-skel{padding:18px 18px 40px;max-width:1080px;margin:0 auto;box-sizing:border-box}
  .ts-sk{position:relative;overflow:hidden;background:#171725;border-radius:14px}
  .ts-sk::after{content:"";position:absolute;inset:0;transform:translateX(-100%);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.07) 45%,rgba(167,139,250,.12) 50%,rgba(255,255,255,.07) 55%,transparent);
    animation:ts-shimmer 1.5s ease-in-out infinite}
  @keyframes ts-shimmer{to{transform:translateX(100%)}}
  .ts-skel-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .ts-skel-logo{width:46px;height:46px;border-radius:50%}
  .ts-skel-name{width:150px;height:18px;border-radius:9px}
  .ts-skel-btn{width:96px;height:36px;border-radius:999px;margin-left:auto}
  .ts-skel-hero{height:min(52vh,380px);border-radius:22px;margin-bottom:22px;
    background:radial-gradient(120% 90% at 20% 10%,#2a1f52 0,#171725 55%)}
  .ts-skel-line{height:14px;border-radius:7px;margin:10px 0}
  .ts-skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;margin-top:22px}
  .ts-skel-card{height:190px;border-radius:18px}
  .ts-skel-pulse{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;gap:7px}
  .ts-skel-pulse i{width:8px;height:8px;border-radius:50%;background:#8b5cf6;opacity:.35;animation:ts-dot 1.1s ease-in-out infinite}
  .ts-skel-pulse i:nth-child(2){animation-delay:.15s}.ts-skel-pulse i:nth-child(3){animation-delay:.3s}
  @keyframes ts-dot{50%{opacity:1;transform:translateY(-4px)}}
  .ts-skel-txt{position:fixed;left:0;right:0;bottom:44px;margin:0;text-align:center;font-size:.8rem;color:#8a8aa3}

  /* ---------- Mensajes (404, pausa, error) ---------- */
  .ts-msg{display:flex;align-items:center;justify-content:center;padding:24px;
    background:radial-gradient(80% 60% at 50% 0%,rgba(124,58,237,.28),transparent 70%),
               radial-gradient(60% 50% at 100% 100%,rgba(34,211,238,.14),transparent 70%),#0b0b12}
  .ts-card{width:100%;max-width:420px;text-align:center;padding:34px 26px 28px;border-radius:24px;box-sizing:border-box;
    background:rgba(23,23,37,.85);border:1px solid rgba(255,255,255,.08);box-shadow:0 30px 80px rgba(0,0,0,.45);
    animation:ts-in .5s cubic-bezier(.2,.8,.2,1) both}
  @keyframes ts-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
  .ts-icon{width:74px;height:74px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;
    background:linear-gradient(135deg,#7c3aed,#22d3ee);color:#fff;animation:ts-float 3.5s ease-in-out infinite}
  .ts-icon svg{width:36px;height:36px}
  @keyframes ts-float{50%{transform:translateY(-6px)}}
  .ts-card h1{font-size:1.35rem;line-height:1.25;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
  .ts-card p{margin:0 0 22px;color:#b7b7c9;font-size:.98rem;line-height:1.5}
  .ts-actions{display:flex;flex-direction:column;gap:10px}
  .ts-btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 22px;border-radius:14px;
    border:0;font:inherit;font-weight:700;font-size:1rem;cursor:pointer;text-decoration:none;color:#fff;
    background:linear-gradient(135deg,#7c3aed,#6d28d9);box-shadow:0 10px 26px rgba(124,58,237,.35);transition:transform .15s}
  .ts-btn:active{transform:scale(.97)}
  .ts-btn.ts-ghost{background:transparent;box-shadow:none;border:1px solid rgba(255,255,255,.14);color:#e7e7f2}
  .ts-btn:focus-visible{outline:3px solid #22d3ee;outline-offset:2px}
  .ts-small{margin-top:14px;font-size:.82rem;color:#8a8aa3;min-height:1.2em}
  .ts-brand{margin-top:22px;font-size:.78rem;color:#6f6f88}
  .ts-brand a{color:#a78bfa;text-decoration:none}
  @media (prefers-reduced-motion:reduce){
    .ts-sk::after,.ts-icon,.ts-skel-pulse i,.ts-card{animation:none}
  }
</style>
<script>
/* Arranque de la tienda (sin document.write: el esqueleto se pinta al instante).
 * En paralelo y desde el primer milisegundo: lectura de Firestore, núcleo y plantilla.
 * Datos iniciales, por orden: JSON inyectado por el servidor (window.__TIENDA__) → copia local de la última
 * visita (stale-while-revalidate) → red. */
(function () {
  'use strict';
  var W = window, D = document, HEAD = D.head;
  var BASE = W.LANDING_BASE = W.__TIENDA_BASE__ === '/dev/' || location.pathname.indexOf('/dev/') === 0 ? '/dev/' : '/';
  // Versiones de caché (?v=): súbelas al cambiar el archivo.
  var V = { core: 24, b: 16, d: 28, e: 9, f: 11 };
  // Plantilla → archivo (b: pop/premium, d: navidad). Las retiradas pasan a pop/premium en normalize() → 'b'.
  var FILES = { pop: 'b', premium: 'b', navidad: 'd', navidad2: 'd', navidad3: 'd', lima: 'e', rosa: 'f', verano: 'f' };
  // Igual que LandingCore.FIREBASE / COLLECTION (aquí para no esperar al núcleo antes de pedir los datos).
  var FS = { projectId: 'plantillas-bfaeb', apiKey: 'AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY', collection: 'public_catalogs' };
  var FONT_NAVIDAD = 'https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap';
  var SLUG_RE = /^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])?$/;
  // Dominio propio (plan VIP): el servidor sirve la tienda en https://<dominio>/ e inyecta el slug
  // (window.__TIENDA__ = {slug, host, …} o window.__TIENDA_SLUG__). Ahí la ruta no dice qué tienda es.
  var INJ = W.__TIENDA__ && typeof W.__TIENDA__ === 'object' ? W.__TIENDA__ : null;
  var HOSTED = !!(INJ && typeof INJ.host === 'string' && INJ.host);

  /* Plan VIP (igual que LandingCore.vipState): 'active' | 'expired' | 'none'. */
  function vipState(raw, now) {
    if (!raw || raw.vip !== true) return 'none';
    var u = raw.vipUntil, n = Number(u);
    if (u === null || u === '' || u === undefined) return 'active';
    // Fecha que no es un número positivo: vencido (falla cerrado, igual que el núcleo y server.js).
    // Prueba VIP gratis vencida: la tienda sigue visible como normal.
    if (!(isFinite(n) && n > 0) || n <= (now || Date.now())) return raw.vipTrial === true ? 'none' : 'expired';
    return 'active';
  }
  /* Plantilla que de verdad se pinta: Navidad es solo para VIP vigente (si no, Pop). */
  function effTemplate(raw) {
    var t = String((raw && raw.template) || '');
    return (/^navidad[23]?$/.test(t) && vipState(raw) !== 'active') ? 'pop' : t;
  }

  function readSlug() {
    var forced = HOSTED ? INJ.slug : W.__TIENDA_SLUG__;
    if (typeof forced === 'string' && SLUG_RE.test(forced)) return forced;
    // Enlace corto disenosstreaming.com/<slug>, enlace antiguo /s/<slug> o ?s=<slug> (zona /dev/).
    var m = location.pathname.match(/^\/(?:s\/)?([^/.]+)\/?$/);
    var raw = m ? m[1] : (new URLSearchParams(location.search).get('s') || '');
    try { raw = decodeURIComponent(raw); } catch (_) {}
    raw = String(raw).trim().toLowerCase();
    return SLUG_RE.test(raw) ? raw : '';
  }

  /* Convierte un Value del formato REST de Firestore a JSON plano. */
  function fromRestValue(v) {
    if (v === null || typeof v !== 'object') return v === undefined ? null : v;
    if ('nullValue' in v) return null;
    if ('stringValue' in v) return String(v.stringValue);
    if ('booleanValue' in v) return v.booleanValue === true || v.booleanValue === 'true';
    if ('integerValue' in v) {
      var n = Number(v.integerValue);
      return Number.isSafeInteger(n) ? n : String(v.integerValue);
    }
    if ('doubleValue' in v) return Number(v.doubleValue);
    if ('timestampValue' in v) { var t = Date.parse(v.timestampValue); return Number.isFinite(t) ? t : String(v.timestampValue); }
    if ('referenceValue' in v) return String(v.referenceValue);
    if ('bytesValue' in v) return String(v.bytesValue);
    if ('geoPointValue' in v) {
      var g = v.geoPointValue || {};
      return { latitude: Number(g.latitude) || 0, longitude: Number(g.longitude) || 0 };
    }
    if ('arrayValue' in v) {
      var vals = (v.arrayValue && Array.isArray(v.arrayValue.values)) ? v.arrayValue.values : [];
      return vals.map(fromRestValue);
    }
    if ('mapValue' in v) return fromRestFields(v.mapValue && v.mapValue.fields);
    return null;
  }
  function fromRestFields(fields) {
    var out = {};
    if (!fields || typeof fields !== 'object') return out;
    Object.keys(fields).forEach(function (k) {
      if (k === '__proto__' || k === 'constructor' || k === 'prototype') return;
      out[k] = fromRestValue(fields[k]);
    });
    return out;
  }

  /* Resultado: {status:'ok',data} | {status:'notfound'} | {status:'error',error}.
   * El tiempo límite crece con cada intento (12 s, 20 s, 30 s) para no fallar siempre en redes muy lentas. */
  function loadCatalog(slug, attempt) {
    if (!slug) return Promise.resolve({ status: 'notfound' });
    var url = 'https://firestore.googleapis.com/v1/projects/' + encodeURIComponent(FS.projectId) +
      '/databases/(default)/documents/' + FS.collection + '/' + encodeURIComponent(slug) +
      '?key=' + encodeURIComponent(FS.apiKey);
    var ctrl = typeof AbortController === 'function' ? new AbortController() : null;
    var ms = [12000, 20000, 30000][Math.min(attempt || 0, 2)];
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : 0;
    return fetch(url, { cache: 'no-store', credentials: 'omit', signal: ctrl ? ctrl.signal : undefined })
      .then(function (res) {
        if (res.status === 404 || res.status === 403) return { status: 'notfound' };
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json().then(function (doc) {
          if (!doc || !doc.fields) return { status: 'notfound' };
          return { status: 'ok', data: fromRestFields(doc.fields) };
        });
      })
      .catch(function (error) { return { status: 'error', error: error }; })
      .then(function (r) { clearTimeout(timer); return r; });
  }

  /* ---------- copia local (localStorage) del último JSON de cada tienda ---------- */
  var CK = 'ds-tienda:', CACHE_MAX_AGE = 30 * 864e5, CACHE_KEEP = 6;
  function cacheGet(slug) {
    try {
      var o = JSON.parse(localStorage.getItem(CK + slug) || 'null');
      if (o && o.d && typeof o.d === 'object' && Date.now() - o.t < CACHE_MAX_AGE) return o;
    } catch (_) {}
    return null;
  }
  function cachePut(slug, data) {
    try {
      localStorage.setItem(CK + slug, JSON.stringify({ t: Date.now(), d: data }));
      // Solo las últimas tiendas visitadas (no llenar el almacenamiento del celular).
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(CK) === 0) keys.push(k); }
      if (keys.length > CACHE_KEEP) {
        keys.map(function (k) { var t = 0; try { t = JSON.parse(localStorage.getItem(k)).t || 0; } catch (_) {} return [t, k]; })
          .sort(function (a, b) { return a[0] - b[0]; }).slice(0, keys.length - CACHE_KEEP)
          .forEach(function (x) { localStorage.removeItem(x[1]); });
      }
    } catch (_) {}
  }
  function cacheDel(slug) { try { localStorage.removeItem(CK + slug); } catch (_) {} }

  /* ---------- carga de recursos ---------- */
  function addLink(rel, href, attrs) {
    var l = D.createElement('link');
    l.rel = rel; l.href = href;
    Object.keys(attrs || {}).forEach(function (k) { l.setAttribute(k, attrs[k]); });
    HEAD.appendChild(l);
    return l;
  }
  var scripts = {};
  /* async=false: se descargan en paralelo pero se ejecutan en orden de inserción (núcleo antes que plantilla)
   * sin bloquear el pintado. Si falla, se puede volver a pedir. */
  function loadScript(src) {
    if (!scripts[src]) {
      scripts[src] = new Promise(function (resolve, reject) {
        var s = D.createElement('script');
        s.src = src; s.async = false;
        s.onload = function () { resolve(); };
        s.onerror = function () { delete scripts[src]; s.remove(); reject(new Error('no cargó ' + src)); };
        HEAD.appendChild(s);
      });
    }
    return scripts[src];
  }
  var coreSrc = BASE + 'js/landing-core.js?v=' + V.core;
  var tplFile = function (id) { return FILES[id] || 'b'; };
  var tplSrc = function (file) { return BASE + 'js/landing-templates-' + file + '.js?v=' + V[file]; };
  var hinted = {};
  /* Con los datos (de donde vengan) ya se sabe qué plantilla y qué portada hacen falta: pedirlas ya,
   * antes de que el núcleo termine de llegar. */
  function hint(raw) {
    if (!raw || typeof raw !== 'object' || raw.enabled === false || vipState(raw) === 'expired') return;
    var file = tplFile(effTemplate(raw));
    if (!hinted[file]) {
      hinted[file] = 1;
      loadScript(tplSrc(file)).catch(function () {});
      if (file === 'd') { // Navidad: fuente Great Vibes sin esperar al @import de la plantilla (misma URL → una sola descarga).
        addLink('preconnect', 'https://fonts.gstatic.com', { crossorigin: '' });
        addLink('stylesheet', FONT_NAVIDAD);
      }
    }
    // Portada (casi siempre el LCP): misma regla que el núcleo (≤820 px → versión ligera de 800 px).
    var cover = (W.innerWidth <= 820 && raw.coverSmUrl) || raw.coverUrl;
    if (typeof cover === 'string' && /^https:\/\//i.test(cover) && !hinted[cover]) {
      try { cover = new URL(cover).href; } catch (_) { return; }
      hinted[cover] = 1;
      addLink('preload', cover, { as: 'image', fetchpriority: 'high' });
    }
  }

  var slug = readSlug();
  var core = loadScript(coreSrc);
  core.catch(function () {});

  // Datos inyectados por el servidor (opcional; ver docs/REVISION-PERF.md): {slug, t, doc:{fields}} o {slug, t, notFound:true}.
  var initial = null, inj = W.__TIENDA__, fresh = false;
  if (slug && inj && inj.slug === slug) {
    if (inj.notFound) initial = { status: 'notfound', source: 'server' };
    else if (inj.unavailable) initial = { status: 'unavailable', source: 'server' };
    else if (inj.doc && inj.doc.fields) initial = { status: 'ok', data: fromRestFields(inj.doc.fields), source: 'server' };
    fresh = !!initial && Date.now() - (Number(inj.t) || 0) < 60000;
  }
  var cached = slug ? cacheGet(slug) : null;
  if (!initial && cached) initial = { status: 'ok', data: cached.d, source: 'cache' };
  if (initial && initial.status === 'ok') hint(initial.data);
  // Plantilla desconocida (primera visita sin datos del servidor): se adelanta la descarga de la más usada
  // (pop/premium) solo como preload; no se ejecuta si al final la tienda es de navidad.
  if (slug && !initial) addLink('preload', tplSrc('b'), { as: 'script' });

  var first = (!slug || fresh) ? Promise.resolve(initial || { status: 'notfound' }) : loadCatalog(slug, 0);
  first.then(function (r) { if (r.status === 'ok') hint(r.data); });

  W.TiendaPublica = {
    slug: slug, fromRestValue: fromRestValue, fromRestFields: fromRestFields, loadCatalog: loadCatalog,
    first: first, initial: initial, core: core, loadScript: loadScript, tplFile: tplFile, tplSrc: tplSrc, hint: hint,
    cachePut: cachePut, cacheDel: cacheDel, versions: V, coreSrc: coreSrc, files: FILES,
    hosted: HOSTED, host: HOSTED ? INJ.host : '', vipState: vipState, effTemplate: effTemplate, fs: FS
  };
})();
</script>
</head>
<body>
<main id="app" aria-live="polite"></main>

<section id="tsLoading" class="ts-state" aria-busy="true" aria-label="Cargando tienda">
  <div class="ts-skel" aria-hidden="true">
    <div class="ts-skel-top"><div class="ts-sk ts-skel-logo"></div><div class="ts-sk ts-skel-name"></div><div class="ts-sk ts-skel-btn"></div></div>
    <div class="ts-sk ts-skel-hero"></div>
    <div class="ts-sk ts-skel-line" style="width:62%"></div>
    <div class="ts-sk ts-skel-line" style="width:40%"></div>
    <div class="ts-skel-grid">
      <div class="ts-sk ts-skel-card"></div><div class="ts-sk ts-skel-card"></div>
      <div class="ts-sk ts-skel-card"></div><div class="ts-sk ts-skel-card"></div>
    </div>
  </div>
  <div class="ts-skel-pulse" aria-hidden="true"><i></i><i></i><i></i></div>
  <p class="ts-skel-txt">Cargando tienda…</p>
</section>

<section id="tsMessage" class="ts-state ts-msg" hidden>
  <div class="ts-card" role="alert">
    <div class="ts-icon" id="tsIcon"></div>
    <h1 id="tsTitle"></h1>
    <p id="tsText"></p>
    <div class="ts-actions" id="tsActions"></div>
    <div class="ts-small" id="tsSmall" aria-live="polite"></div>
    <div class="ts-brand">Hecho con <a href="https://disenosstreaming.com/" rel="noopener">Diseños Streaming</a></div>
  </div>
</section>

<script>
(function () {
  'use strict';
  var T = window.TiendaPublica;
  var $ = function (id) { return document.getElementById(id); };
  var ICONS = {
    notfound: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5M8.5 8.5l5 5M13.5 8.5l-5 5"/></svg>',
    paused: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M10 9v6M14 9v6"/></svg>',
    error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16a5 5 0 0 1 7 0"/><path d="M12 20h.01"/></svg>'
  };
  var retryTimer = 0, countdownTimer = 0, attempt = 0;
  var shownKey = '';    // JSON de los datos que están pintados ('' = nada pintado aún)
  var pendingKey = '';  // JSON de los datos que se están pintando (esperando núcleo/plantilla)
  var paintSeq = 0;     // descarta pintados viejos si llegan datos nuevos mientras se descarga la plantilla
  var params = new URLSearchParams(location.search);
  var NO_REDIRECT = params.has('r');
  if (NO_REDIRECT && history.replaceState) {
    params.delete('r');
    try { history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash); } catch (_) {}
  }
  var MAX_AUTO = 6;
  var digits = function (v) { return String(v == null ? '' : v).replace(/\D+/g, '').slice(0, 16); };

  function setMeta(name, value, attr) {
    attr = attr || 'name';
    var el = document.head.querySelector('meta[' + attr + '="' + name + '"]');
    if (!el) { el = document.createElement('meta'); el.setAttribute(attr, name); document.head.appendChild(el); }
    el.setAttribute('content', value);
  }
  function show(which) {
    $('tsLoading').hidden = which !== 'loading';
    $('tsMessage').hidden = which !== 'message';
  }
  function clearTimers() { clearTimeout(retryTimer); clearInterval(countdownTimer); retryTimer = countdownTimer = 0; }

  function message(kind, title, text, actions, small) {
    clearTimers();
    paintSeq++; shownKey = pendingKey = '';
    var app = $('app');
    if (typeof app.__ltCleanup === 'function') { try { app.__ltCleanup(); } catch (_) {} app.__ltCleanup = null; }
    app.innerHTML = ''; app.className = ''; app.removeAttribute('style');
    $('tsIcon').innerHTML = ICONS[kind] || ICONS.error;
    $('tsTitle').textContent = title;
    $('tsText').textContent = text;
    var box = $('tsActions'); box.innerHTML = '';
    (actions || []).forEach(function (a) {
      var el = document.createElement(a.href ? 'a' : 'button');
      el.className = 'ts-btn' + (a.ghost ? ' ts-ghost' : '');
      el.textContent = a.label;
      if (a.href) { el.href = a.href; el.rel = 'noopener'; } else { el.type = 'button'; el.addEventListener('click', a.onClick); }
      box.appendChild(el);
    });
    $('tsSmall').textContent = small || '';
    $('tsMessage').setAttribute('data-kind', kind);
    document.title = title;
    show('message');
  }
  var HOME = { label: 'Ir a Diseños Streaming', href: 'https://disenosstreaming.com/' };
  // En un dominio propio no se manda al visitante fuera de ese dominio.
  var HOMES = T && T.hosted ? [] : [HOME];

  function showNotFound() {
    message('notfound', 'Esta tienda no existe o cambió de enlace',
      'Revisa que el enlace esté bien escrito o pide a tu vendedor su enlace actualizado.', HOMES);
  }
  /* VIP vencido: la tienda no se muestra y no se enseña ningún dato del revendedor. */
  function showUnavailable() {
    message('paused', 'Esta tienda no está disponible por el momento', 'Vuelve a intentarlo más tarde.', HOMES);
    $('tiendaFavicon').href = '/icons/icon-192.png';
    $('tiendaTouchIcon').href = '/icons/apple-touch-icon.png';
    setMeta('description', 'Cuentas y perfiles de streaming con atención por WhatsApp.');
  }
  function showPaused(data) {
    var name = (data && typeof data.name === 'string' && data.name.trim()) ? data.name.trim().slice(0, 80) : '';
    var acts = [];
    var phone = data ? digits(data.whatsapp) : '';
    if (phone) acts.push({ label: 'Escribir por WhatsApp', href: 'https://wa.me/' + phone + '?text=' + encodeURIComponent('Hola, vi tu tienda' + (name ? ' ' + name : '') + ' y quiero información.') });
    if (!T.hosted) acts.push({ label: 'Ir a Diseños Streaming', href: HOME.href, ghost: acts.length > 0 });
    message('paused', 'Esta tienda está en pausa',
      (name ? name + ' pausó su tienda por un momento. ' : 'El dueño pausó su tienda por un momento. ') + 'Vuelve a intentarlo más tarde.', acts);
  }
  function showError(auto) {
    var actions = [{ label: 'Reintentar ahora', onClick: function () { attempt = 0; load(); } }];
    message('error', 'No pudimos cargar la tienda',
      'Parece que hay un problema de conexión. Revisa tu internet y vuelve a intentarlo.', actions);
    if (!auto) return;
    // Reintento automático con backoff exponencial (2s, 4s, 8s… máx 30s) + jitter.
    if (attempt >= MAX_AUTO) { $('tsSmall').textContent = 'Toca “Reintentar ahora” cuando tengas conexión.'; return; }
    var wait = Math.min(30000, 2000 * Math.pow(2, attempt)) + Math.floor(Math.random() * 400);
    attempt++;
    var until = Date.now() + wait;
    var tick = function () {
      var s = Math.max(0, Math.ceil((until - Date.now()) / 1000));
      $('tsSmall').textContent = 'Reintentando automáticamente en ' + s + ' s…';
    };
    tick(); countdownTimer = setInterval(tick, 500);
    retryTimer = setTimeout(function () { clearTimers(); load(); }, wait);
  }
  function showTemplatesError() {
    message('error', 'No pudimos cargar el diseño de la tienda',
      'Vuelve a cargar la página en unos segundos.', [{ label: 'Volver a cargar', onClick: function () { location.reload(); } }]);
  }

  function applyHead(d) {
    document.title = d.name + (d.tagline ? ' · ' + d.tagline : '');
    var desc = d.tagline || d.heroSubtitle || ('Planes de streaming de ' + d.name);
    setMeta('description', desc);
    setMeta('theme-color', d.theme.primary);
    setMeta('og:title', d.name, 'property');
    setMeta('og:description', desc, 'property');
    if (d.logoUrl) {
      $('tiendaFavicon').href = d.logoUrl;
      $('tiendaTouchIcon').href = d.logoUrl;
    }
    var light = d.theme.mode === 'light';
    document.documentElement.style.colorScheme = light ? 'light' : 'dark';
    document.documentElement.style.background = document.body.style.background = light ? '#ffffff' : '';
  }

  /* Núcleo y plantilla: un reintento automático si falla la descarga (datos móviles inestables). */
  function retryOnce(fn) {
    return fn().catch(function () { return new Promise(function (r) { setTimeout(r, 1200); }).then(fn); });
  }
  function ensureCore() {
    return retryOnce(function () {
      return window.LandingCore ? Promise.resolve() : T.loadScript(T.coreSrc);
    }).then(function () {
      if (!window.LandingCore || typeof window.LandingCore.render !== 'function') throw new Error('sin núcleo');
      return window.LandingCore;
    });
  }
  function hasTemplate(id) {
    var core = window.LandingCore;
    return !!(core && core.listTemplates().some(function (t) { return t.id === id; }));
  }
  /* Solo se descarga el archivo de la plantilla que usa la tienda (b: pop/premium, d: navidad). */
  function loadTemplate(id) {
    if (hasTemplate(id)) return Promise.resolve(id);
    var file = T.tplFile(id), extra = 0;
    var once = function () {
      // Si el archivo se ejecutó antes que el núcleo (núcleo reintentado), se vuelve a pedir con otra URL.
      var src = T.tplSrc(file) + (extra ? '&r=' + extra : '');
      return T.loadScript(src).then(function () { if (!hasTemplate(id) && !window.LandingCore.listTemplates().length) { extra++; throw new Error('plantilla sin registrar'); } });
    };
    return retryOnce(once).then(function () {
      if (hasTemplate(id)) return id;
      if (window.LandingCore.listTemplates().length) return window.LandingCore.listTemplates()[0].id;
      throw new Error('sin plantillas');
    });
  }

  function renderStore(raw, key) {
    var seq = ++paintSeq;
    pendingKey = key;
    ensureCore().then(function (core) {
      var d = core.normalize(raw, raw.ownerUid);
      // Sin VIP vigente, Navidad se pinta como Pop (el núcleo hace lo mismo en render()).
      var eff = T.effTemplate(d);
      var want = T.files[eff] ? eff : core.DEFAULTS.template;
      return loadTemplate(want).then(function (id) { if (seq === paintSeq) paint(core, d, id, key); });
    }).catch(function (err) {
      if (seq !== paintSeq) return;
      console.error('[tienda] no se pudo cargar el diseño', err);
      showTemplatesError();
    });
  }
  /* ---------- Estadísticas (solo tiendas VIP vigentes; nunca con ?preview) ----------
   * 1 visita por sesión y 1 clic a WhatsApp por producto (o general) por sesión, en landing_stats/{slug}/days/{AAAA-MM-DD}
   * (día de Lima). Escritura REST sin sesión con incrementos atómicos; las reglas solo aceptan +1 en tiendas VIP vigentes.
   * Se envía después de pintar (keepalive) y nunca bloquea ni retrasa la apertura de WhatsApp. */
  var STATS = (function () {
    var PREVIEW = /[?&]preview(?:[=&]|$)/.test(location.search);
    var on = false, sslug = '', armed = false;
    // El dueño (marcado por el editor en este navegador) no cuenta.
    function ownStore(slug) { try { var a = JSON.parse(localStorage.getItem('ds-own-slugs') || '[]'); return Array.isArray(a) && a.indexOf(slug) >= 0; } catch (_) { return false; } }
    var url = 'https://firestore.googleapis.com/v1/projects/' + T.fs.projectId + '/databases/(default)/documents:commit?key=' + T.fs.apiKey;
    var day = function () { return new Date(Date.now() - 5 * 36e5).toISOString().slice(0, 10); };
    // true si ya se contó en esta sesión (o si no hay sessionStorage: entonces no se cuenta nada).
    function seen(k) {
      try {
        var key = 'ds-st:' + sslug + ':' + day(), o = JSON.parse(sessionStorage.getItem(key) || '{}');
        if (o[k]) return true;
        o[k] = 1; sessionStorage.setItem(key, JSON.stringify(o)); return false;
      } catch (_) { return true; }
    }
    // item: clave del producto (p_<id>/c_<id>) que se suma; va también en `last` porque las reglas lo necesitan para validar.
    function send(paths, item) {
      var body = JSON.stringify({ writes: [{
        update: { name: 'projects/' + T.fs.projectId + '/databases/(default)/documents/landing_stats/' + sslug + '/days/' + day(),
          fields: item ? { last: { stringValue: item } } : {} },
        updateMask: { fieldPaths: item ? ['last'] : [] },
        updateTransforms: paths.map(function (f) { return { fieldPath: f, increment: { integerValue: '1' } }; })
      }] });
      // keepalive solo en clics (la página puede pasar a segundo plano al abrir WhatsApp). Algunos navegadores rechazan
      // keepalive cuando hay preflight CORS (Content-Type JSON): entonces se reintenta una vez sin keepalive.
      var opts = { method: 'POST', body: body, credentials: 'omit', headers: { 'Content-Type': 'application/json' } };
      var plain = function () { try { var q = window.fetch(url, opts); if (q && q.catch) q.catch(function () {}); } catch (_) {} };
      try {
        if (!item && paths[0] === 'views') plain();
        else {
          var p = window.fetch(url, { method: opts.method, body: body, credentials: 'omit', headers: opts.headers, keepalive: true });
          if (p && p.catch) p.catch(plain);
        }
      } catch (_) { plain(); }
      (window.__statsSent = window.__statsSent || []).push(paths.join('+'));
    }
    function onClick(e) {
      if (!on || e.defaultPrevented) return;
      var a = e.target && e.target.closest ? e.target.closest('a[href]') : null;
      if (!a || !$('app').contains(a) || !/^https:\/\/wa\.me\//.test(a.href)) return;
      var box = a.closest('[data-lt-item]'), k = box ? box.getAttribute('data-lt-item') : '';
      if (!/^[pc]_[A-Za-z0-9_]{1,40}$/.test(k || '')) k = '';
      if (seen(k ? 'i:' + k : 'w')) return;
      send(k ? ['wa', 'items.' + k] : ['wa'], k);
    }
    return {
      /* Tras cada pintado: decide si esta tienda cuenta (VIP vigente) y registra la visita de la sesión. */
      painted: function (core, d) {
        on = !PREVIEW && !!T.slug && core.vipActive(d) && !ownStore(T.slug);
        if (!on) return;
        sslug = T.slug;
        if (!armed) { armed = true; document.addEventListener('click', onClick, true); }
        var go = function () { if (on && !seen('v')) send(['views']); };
        if (window.requestIdleCallback) window.requestIdleCallback(go, { timeout: 4000 }); else setTimeout(go, 1500);
      }
    };
  })();
  function paint(core, d, id, key) {
    try {
      clearTimers();
      // Si ya había una versión pintada (copia local) y llegó otra distinta, se conserva la posición de lectura.
      var y = shownKey ? window.scrollY : 0;
      show('none');
      core.render($('app'), d, { template: id });
      shownKey = key; pendingKey = '';
      applyHead(d);
      try { STATS.painted(core, d); } catch (e) { console.warn('[tienda] estadísticas', e); }
      if (y) window.scrollTo(0, y);
    } catch (err) {
      console.error('[tienda] error al pintar', err);
      showTemplatesError();
    }
  }

  // Enlace viejo: el editor deja el doc anterior con redirectTo (normalize lo descarta: se lee del JSON crudo).
  // Un solo salto: con ?r=1 no se vuelve a redirigir.
  function redirectTarget(raw) {
    var to = raw && raw.redirectTo;
    if (typeof to !== 'string' || NO_REDIRECT) return '';
    to = to.trim().toLowerCase();
    var bad = window.LandingCore ? window.LandingCore.slugError(to) : !/^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$/.test(to);
    return (!bad && to !== T.slug) ? to : '';
  }
  /* result.source: 'server' (inyectado) | 'cache' (copia local) | 'network'. */
  function handle(result) {
    var net = result.source === 'network';
    if (result.status === 'ok') {
      if (result.source !== 'cache') T.cachePut(T.slug, result.data);
      var to = redirectTarget(result.data);
      if (to && T.hosted) {
        // Dominio propio: no se sale del dominio; se carga la tienda nueva aquí mismo (un solo salto).
        NO_REDIRECT = true; T.followed = true; T.slug = to; attempt = 0; paintSeq++; load(); return;
      }
      if (to) { paintSeq++; location.replace(window.LANDING_BASE === '/dev/' ? '/dev/tienda.html?s=' + encodeURIComponent(to) + '&r=1' : '/' + to + '?r=1'); return; }
      // VIP vencido o cuenta inhabilitada por el admin: "no disponible" sin datos (también desde la copia local).
      if (T.vipState(result.data) === 'expired' || (result.data.enabled === false && result.data.pausedByAdmin === true)) { T.cacheDel(T.slug); showUnavailable(); return; }
      if (result.data.enabled === false) { showPaused(result.data); return; }
      var key = '';
      try { key = JSON.stringify(result.data); } catch (_) { key = String(Date.now()); }
      if (key === shownKey || key === pendingKey) return; // la red confirmó la copia local: nada que repintar
      renderStore(result.data, key);
    } else if (result.status === 'unavailable') {
      T.cacheDel(T.slug);
      showUnavailable();
    } else if (result.status === 'notfound') {
      if (net) T.cacheDel(T.slug);
      showNotFound();
    } else {
      console.warn('[tienda] error de red', result.error);
      if (shownKey || pendingKey) return; // se queda la copia local ya pintada (o en camino)
      // Ya se decidió con datos (copia local o servidor): no disponible / en pausa / no existe → no se cambia por "sin conexión".
      var kind = $('tsMessage').hidden ? '' : $('tsMessage').getAttribute('data-kind');
      if (kind === 'paused' || kind === 'notfound') return;
      if (attempt === 0) { attempt++; retryTimer = setTimeout(load, 600); return; } // 1.er fallo: reintento silencioso
      showError(true);
    }
  }
  function fromNet(p) { return p.then(function (r) { r.source = r.source || 'network'; return r; }); }

  function load() {
    clearTimers();
    if (!shownKey) show('loading');
    fromNet(T.loadCatalog(T.slug, attempt)).then(handle);
  }

  function start() {
    if (!T) { showTemplatesError(); return; }
    if (!T.slug) { showNotFound(); return; }
    if (T.initial) handle(T.initial);
    // Red (si los datos del servidor no eran recientes, T.first es la lectura de Firestore ya en curso).
    T.first.then(function (r) { if (r !== T.initial && !T.followed) { r.source = r.source || 'network'; handle(r); } });
    // Si estaba sin internet, reintenta en cuanto vuelva la conexión.
    window.addEventListener('online', function () { if (!shownKey && !$('tsMessage').hidden && $('tsMessage').getAttribute('data-kind') === 'error' && T.slug) { attempt = 0; load(); } });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
  else start();
})();
</script>
</body>
</html>
