<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diseños Streaming — Acceso</title>
<script>window.FIREBASE_APPCHECK_SITE_KEY=window.FIREBASE_APPCHECK_SITE_KEY||'';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at top right,#182957 0%,#0b1428 36%,#060c16 100%);
  color:#f4f7ff;
  display:grid;
  place-items:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:400px;
  background:rgba(13,23,40,.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(138,161,255,.15);
  border-radius:28px;
  padding:40px 36px;
  box-shadow:0 32px 80px rgba(0,0,0,.5);
}
.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:36px;
}
.logo{
  width:52px;height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#8aa1ff,#7c5cff);
  display:grid;place-items:center;
  font-weight:900;font-size:22px;
  box-shadow:0 8px 24px rgba(124,92,255,.4);
  flex-shrink:0;
}
.brand-text h1{
  font-size:18px;font-weight:800;letter-spacing:-.04em;
}
.brand-text small{
  display:block;margin-top:3px;
  color:#95a5cb;font-size:12px;
}
h2{
  font-size:24px;font-weight:800;letter-spacing:-.05em;
  margin-bottom:6px;
}
.subtitle{color:#95a5cb;font-size:14px;margin-bottom:28px;}

label{
  display:block;
  font-size:13px;font-weight:600;
  color:#95a5cb;
  margin-bottom:6px;margin-top:18px;
  letter-spacing:.01em;
}
input{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(138,161,255,.15);
  border-radius:12px;
  padding:12px 16px;
  color:#f4f7ff;
  font-size:15px;
  outline:none;
  transition:.2s;
}
input:focus{
  border-color:rgba(138,161,255,.5);
  background:rgba(138,161,255,.07);
}
input::placeholder{color:#4a5a7a}

.btn{
  width:100%;
  margin-top:26px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#8aa1ff,#7c5cff);
  color:#fff;
  font-size:15px;font-weight:700;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 6px 20px rgba(124,92,255,.35);
  position:relative;
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(124,92,255,.45)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}

.error{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(251,113,133,.1);
  border:1px solid rgba(251,113,133,.25);
  color:#fb7185;
  font-size:13px;
  display:none;
}
.error.show{display:block}
.success{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(74,222,128,.1);
  border:1px solid rgba(74,222,128,.25);
  color:#bbf7d0;
  font-size:13px;
  display:none;
}
.success.show{display:block}
.security-note{
  margin-top:16px;
  padding:12px 14px;
  border-radius:14px;
  background:rgba(45,212,191,.08);
  border:1px solid rgba(45,212,191,.20);
  color:#dffdf7;
  font-size:12.5px;
  line-height:1.45;
}
.security-note strong{display:block;color:#f4f7ff;margin-bottom:3px}
.auth-links{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-top:18px;
  font-size:13px;
}
.auth-links a,
.link-btn{
  color:#b8c5ff;
  text-decoration:none;
  font-weight:700;
}
.auth-links a:hover,
.link-btn:hover{text-decoration:underline}
.link-btn{
  border:0;
  padding:0;
  background:transparent;
  cursor:pointer;
}

.spinner{
  display:inline-block;
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.footer{
  text-align:center;
  margin-top:28px;
  color:#4a5a7a;
  font-size:12px;
}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">▶</div>
    <div class="brand-text">
      <h1>Diseños Streaming</h1>
      <small>Panel de gestión</small>
    </div>
  </div>

  <h2>Bienvenido</h2>
  <p class="subtitle">Ingresa tus credenciales para continuar</p>

  <label for="email">Correo electrónico</label>
  <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email" />

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />

  <button class="btn" id="loginBtn" onclick="handleLogin()">Ingresar</button>

  <div class="error" id="errorMsg"></div>
  <div class="success" id="successMsg"></div>
  <div class="security-note">
    <strong>Datos protegidos</strong>
    Tu gestor es privado. Al entrar, cambia tu contrasena inicial desde Seguridad para que solo tu la conozcas.
  </div>

  <div class="auth-links">
    <a href="https://wa.me/51974834197?text=Hola%2C%20quiero%20solicitar%20acceso%20a%20Dise%C3%B1os%20Streaming." target="_blank" rel="noopener">Solicitar acceso</a>
    <button class="link-btn" type="button" onclick="handlePasswordReset()">Olvidé mi contraseña</button>
  </div>

  <div class="footer">Diseños Streaming © 2025 · Acceso restringido</div>
</div>

<!-- Firebase SDK -->
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, sendPasswordResetEmail }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

const firebaseConfig = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978",
  measurementId: "G-NX5226C0P4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const params = new URLSearchParams(window.location.search);
if (params.get('registered') === '1') {
  showSuccess('Cuenta creada. Revisa tu correo para verificarla y luego inicia sesión.');
}
if (params.get('reset') === '1') {
  showSuccess('Te enviamos el enlace para restablecer tu contraseña.');
}

// Si ya esta logueado, redirige directo
function nextUrl() {
  const next = new URLSearchParams(window.location.search).get('next') || '/gestor.html';
  if (next.startsWith('/dev/gestor.html') || next.startsWith('/dev/gestor-mobile.html')) return next;
  if (next.startsWith('/gestor-mobile.html')) return '/gestor-mobile.html';
  return '/gestor.html';
}

onAuthStateChanged(auth, user => {
  if (user) window.location.href = nextUrl();
});

window.handleLogin = async function() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('loginBtn');
  const errEl    = document.getElementById('errorMsg');

  if (!email || !password) {
    showError('Completa correo y contraseña.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Ingresando...';
  errEl.classList.remove('show');

  try {
    await signInWithEmailAndPassword(auth, email, password);
    // onAuthStateChanged redirige automáticamente
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = 'Ingresar';
    showError(friendlyError(err.code));
  }
};

window.handlePasswordReset = async function() {
  const email = document.getElementById('email').value.trim();
  if (!email) {
    showError('Escribe tu correo para enviarte el enlace de recuperación.');
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('Te enviamos un enlace para restablecer tu contraseña.');
  } catch (err) {
    showError(friendlyError(err.code));
  }
};

function showError(msg) {
  const el = document.getElementById('errorMsg');
  document.getElementById('successMsg').classList.remove('show');
  el.textContent = msg;
  el.classList.add('show');
}

function showSuccess(msg) {
  const el = document.getElementById('successMsg');
  document.getElementById('errorMsg').classList.remove('show');
  el.textContent = msg;
  el.classList.add('show');
}

function friendlyError(code) {
  const map = {
    'auth/invalid-email':          'El correo no es válido.',
    'auth/user-not-found':         'No existe una cuenta con ese correo.',
    'auth/wrong-password':         'Contraseña incorrecta.',
    'auth/invalid-credential':     'Correo o contraseña incorrectos.',
    'auth/user-disabled':          'Esta cuenta fue deshabilitada en Firebase Auth. Para exportar Excel, reactiva el inicio de sesion y deja active:false en Firestore.',
    'auth/too-many-requests':      'Demasiados intentos. Intenta más tarde.',
    'auth/network-request-failed': 'Sin conexión. Verifica tu internet.',
  };
  return map[code] || 'Error al ingresar. Intenta nuevamente.';
}

// Enter para login
document.addEventListener('keydown', e => {
  if (e.key === 'Enter') window.handleLogin();
});
</script>
</body>
</html>
