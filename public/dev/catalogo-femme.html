<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Catálogo</title>
<meta name="description" content="Catálogo de streaming. Pide por WhatsApp y recibe tu acceso en minutos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg,#07050d);color:#fff;-webkit-font-smoothing:antialiased}
#root{position:relative;z-index:2}
.sel{outline:2px dashed transparent;outline-offset:4px;border-radius:8px;transition:outline-color .15s,transform .25s ease}
.editing .sel:hover{outline-color:color-mix(in srgb,var(--ac) 60%,transparent);cursor:pointer}
.sel.active{outline-color:var(--ac)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
.nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;padding:0 24px;height:58px;background:color-mix(in srgb,var(--bg,#07050d) 80%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,.07)}
.nav-brand{font-size:17px;font-weight:800;letter-spacing:-.02em;color:#fff}
.nav-wa{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:var(--wa,#25d366);color:#06251a;font-weight:700;font-size:13px;padding:8px 14px;border-radius:10px;text-decoration:none}
.wa-icon{width:1.15em;height:1.15em;display:inline-block;flex:none;fill:currentColor}
.fab .wa-icon{width:30px;height:30px}
.hero{padding:70px 0 64px;text-align:left;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(58% 42% at 50% 0%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 72%);pointer-events:none}
.hero-layout{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(320px,.92fr);align-items:center;gap:40px;position:relative;z-index:1}
.hero-art{position:relative;min-height:360px;display:grid;place-items:center;isolation:isolate}
.hero-art:before,.hero-art:after{content:"";position:absolute;border-radius:999px;filter:blur(34px);pointer-events:none;z-index:-1;animation:tvReflection 7s ease-in-out infinite alternate}
.hero-art:before{width:72%;height:22%;left:11%;bottom:19%;background:color-mix(in srgb,var(--ac) 48%,transparent);transform:rotate(-6deg)}
.hero-art:after{width:42%;height:18%;right:7%;top:18%;background:color-mix(in srgb,var(--ac2) 34%,transparent);animation-duration:9s;animation-delay:-3s}
.hero-tv{width:min(100%,680px);height:auto;display:block;filter:drop-shadow(0 34px 42px rgba(0,0,0,.55)) drop-shadow(0 0 24px color-mix(in srgb,var(--ac) 24%,transparent));animation:tvFloat 6.5s ease-in-out infinite alternate}
.tv-shine{position:absolute;inset:8% 6% 18% 5%;border-radius:22px;overflow:hidden;pointer-events:none;z-index:2;opacity:.26;mix-blend-mode:screen;transform:skewX(-7deg) rotate(-3deg)}
.tv-shine:before{content:"";position:absolute;inset:-20% -80%;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.18) 47%,rgba(255,255,255,.05) 54%,transparent 63%);animation:screenSweep 5.4s ease-in-out infinite}
.tv-glint{position:absolute;width:92px;height:2px;border-radius:999px;background:rgba(255,255,255,.7);filter:blur(4px);opacity:.28;z-index:3;pointer-events:none;animation:glintPulse 4.8s ease-in-out infinite}
.tv-glint.g1{right:8%;top:12%;transform:rotate(-5deg);animation-delay:-1.2s}
.tv-glint.g2{left:18%;bottom:23%;width:70px;transform:rotate(4deg);animation-delay:-3s}
.hero-copy{max-width:560px;justify-self:end}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:8px 16px;border-radius:999px;background:color-mix(in srgb,var(--ac) 16%,transparent);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);color:#fff;margin-bottom:22px}
.badge:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 25%,transparent)}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.03em;margin-bottom:18px;position:relative}
h1 .ac{color:var(--ac)}
.lead{font-size:18px;line-height:1.6;color:rgba(255,255,255,.72);max-width:560px;margin:0 0 30px}
.cta{display:inline-flex;align-items:center;gap:10px;background:var(--wa);color:#06251a;font-weight:700;font-size:16px;padding:15px 28px;border-radius:14px;text-decoration:none;box-shadow:0 12px 30px color-mix(in srgb,var(--wa) 40%,transparent);transition:transform .2s;position:relative;overflow:hidden}
.cta:hover{transform:translateY(-2px)}
.cta:before{content:"";position:absolute;inset:0;border-radius:14px;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.22) 50%,transparent 70%);transform:translateX(-160%);transition:transform .5s;pointer-events:none}
.cta:hover:before{transform:translateX(160%)}
/* badge glow pulse */
@keyframes badgeGlow{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ac) 0%,transparent)}50%{box-shadow:0 0 18px 4px color-mix(in srgb,var(--ac) 35%,transparent)}}
section.block{padding:56px 0;content-visibility:auto;contain-intrinsic-size:0 420px}
.sec-head{text-align:center;margin-bottom:36px}
.sec-head h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:10px}
.sec-head p{color:rgba(255,255,255,.6);max-width:520px;margin:0 auto;line-height:1.55}
.pgrid{display:grid;gap:16px;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr))}
@media(max-width:640px){.pgrid{grid-template-columns:repeat(var(--mob-cols,2),minmax(0,1fr))}}
.pcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px;transition:transform .25s,border-color .25s,box-shadow .25s,opacity .6s cubic-bezier(.4,0,.15,1);position:relative;overflow:hidden}
.pcard:before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.11) 50%,transparent 70%);transform:translateX(-160%);transition:transform .65s cubic-bezier(.4,0,.15,1);pointer-events:none;z-index:1}
.pcard:hover:before{transform:translateX(160%)}
.pcard:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--pc,var(--ac)) 55%,transparent);box-shadow:0 20px 50px rgba(0,0,0,.4),0 0 40px color-mix(in srgb,var(--pc,var(--ac)) 18%,transparent)}
.pcard .top{display:flex;align-items:center;gap:12px}
.pcard .top>div:last-child{min-width:0}
.plogo{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;overflow:hidden}
.pcard b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pcard b .mq{display:inline-block;animation:pNameScroll var(--mdur,3s) .6s ease-in-out infinite}.pcard .slots{font-size:12px;color:rgba(255,255,255,.55)}
@keyframes pNameScroll{0%,18%{transform:translateX(0)}68%,82%{transform:translateX(var(--mdist,0px))}95%,100%{transform:translateX(0)}}
.price{font-size:clamp(15px,5vw,24px);font-weight:800;word-break:break-all;line-height:1.1}.price small{font-size:13px;font-weight:600;color:rgba(255,255,255,.55);word-break:normal}
.pbtn{margin-top:auto;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;background:color-mix(in srgb,var(--ac) 18%,transparent);border:1px solid color-mix(in srgb,var(--ac) 40%,transparent);color:#fff;font-weight:700;padding:11px;border-radius:12px;text-decoration:none;transition:background .2s}
.pbtn:hover{background:color-mix(in srgb,var(--ac) 30%,transparent)}
.steps{display:grid;gap:18px;grid-template-columns:repeat(3,1fr)}
.step{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:26px}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--ac);display:grid;place-items:center;font-weight:800;margin-bottom:14px}
.step h3{font-size:18px;margin-bottom:8px}.step p{color:rgba(255,255,255,.6);line-height:1.55;font-size:14px}
.tgrid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.tcard{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:22px}
.tcard .stars{color:#fbbf24;margin-bottom:10px}
.tcard p{line-height:1.6;margin-bottom:16px;color:rgba(255,255,255,.85)}
.tcard .who{display:flex;align-items:center;gap:12px}
.tav{width:40px;height:40px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:700;overflow:hidden}
.tav img{width:100%;height:100%;object-fit:cover}
.faq .qa{border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:18px 20px;margin-bottom:12px;background:rgba(255,255,255,.03)}
.faq .qa b{display:block;margin-bottom:7px}.faq .qa span{color:rgba(255,255,255,.6);font-size:14px;line-height:1.55}
footer{padding:46px 0;text-align:center;color:rgba(255,255,255,.55);border-top:1px solid rgba(255,255,255,.08);margin-top:30px}
.fab{position:fixed;right:18px;bottom:18px;width:60px;height:60px;border-radius:50%;background:var(--wa);color:#06251a;display:grid;place-items:center;box-shadow:0 12px 30px color-mix(in srgb,var(--wa) 45%,transparent);text-decoration:none;font-size:30px;animation:bob 2.4s ease-in-out infinite;z-index:50}
.fab .wa-icon path{fill:#06251a}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@media(max-width:760px){.steps{grid-template-columns:1fr}.hero{padding:42px 0 44px;text-align:center}.hero-layout{grid-template-columns:1fr;gap:18px}.hero-art{min-height:230px;order:0}.hero-copy{order:1;justify-self:center}.lead{margin-left:auto;margin-right:auto}.hero-tv{width:min(112%,440px)}.popcorn-float{width:118px;opacity:.18;filter:blur(8px)}.popcorn-float.p2{right:-54px;top:58%}.popcorn-float.p3{display:none}}
/* ── mobile: todas las animaciones activas, reemplazar las caras por versiones GPU ── */
@media(max-width:640px){
  .orb{filter:blur(15px)}
  @keyframes badgeGlow{0%,100%{opacity:1}50%{opacity:.6}}
  .cta:after{animation:none;opacity:0}
  .reveal{transition-duration:.38s}
}
/* ── motion ── */
.reveal{opacity:0;transform:translateY(22px);transition:opacity .6s cubic-bezier(.4,0,.15,1),transform .6s cubic-bezier(.4,0,.15,1)}
.reveal.in{opacity:1;transform:none}
@keyframes heroIn{from{opacity:0;transform:translateY(26px)}to{opacity:1;transform:none}}
/* nav entrance — dispara al crear el elemento, sin depender de .in */
.nav{animation:navSlide .45s cubic-bezier(.4,0,.15,1) both}
@keyframes navSlide{from{transform:translateY(-58px);opacity:0}}
/* hero stagger — CSS puro, activa al crear el elemento en el DOM */
.hero .badge{animation:heroIn .5s .15s both cubic-bezier(.34,1.56,.64,1),badgeGlow 3s 1.2s ease-in-out infinite}
.hero h1{animation:heroIn .65s .30s both cubic-bezier(.4,0,.15,1)}
.hero .lead{animation:heroIn .6s .48s both cubic-bezier(.4,0,.15,1)}
.hero a.cta{animation:heroIn .55s .65s both cubic-bezier(.34,1.56,.64,1)}
/* sheen on accent — sin depender de .in */
.hero .ac{background:linear-gradient(90deg,var(--ac),var(--ac2),var(--ac));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:sheen 6s 1s linear both}
@keyframes sheen{to{background-position:200% 0}}
/* orbes de fondo — fuera del hero para no ser clippeados por overflow:hidden */
.orbs{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;opacity:.55}
.orb{position:absolute;border-radius:50%;filter:blur(92px);animation:orbDrift var(--dur,20s) ease-in-out infinite alternate;will-change:transform}
.popcorn-layer{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none}
.popcorn-float{position:absolute;width:clamp(96px,13vw,170px);height:auto;opacity:.24;filter:blur(7px) saturate(1.05);transform-origin:center;animation:popcornFloat var(--dur,12s) ease-in-out infinite alternate;will-change:transform}
.popcorn-float.p1{left:-58px;top:18%;--dur:12s;--tx:22px;--ty:-28px;--rot-start:7deg;--rot:-8deg}
.popcorn-float.p2{right:-70px;top:44%;--dur:15s;--tx:-28px;--ty:24px;--rot-start:-6deg;--rot:10deg;animation-delay:-5s}
.popcorn-float.p3{left:5%;bottom:-88px;--dur:18s;--tx:18px;--ty:-34px;--rot-start:-4deg;--rot:5deg;animation-delay:-9s;opacity:.18}
@keyframes orbDrift{to{transform:translate(var(--tx,25px),var(--ty,-20px))}}
@keyframes popcornFloat{0%{transform:translate3d(0,0,0) rotate(var(--rot-start,-4deg)) scale(.96)}100%{transform:translate3d(var(--tx,24px),var(--ty,-24px),0) rotate(var(--rot,8deg)) scale(1.04)}}
@keyframes tvFloat{to{transform:translateY(-8px) rotate(.35deg)}}
@keyframes tvReflection{0%{opacity:.45;transform:translate3d(0,0,0) rotate(-6deg) scale(.96)}100%{opacity:.78;transform:translate3d(18px,-10px,0) rotate(-3deg) scale(1.04)}}
@keyframes screenSweep{0%,18%{transform:translateX(-42%)}58%,100%{transform:translateX(42%)}}
@keyframes glintPulse{0%,100%{opacity:.14;transform:translateY(0) scaleX(.82) rotate(var(--glint-rot,0deg))}50%{opacity:.42;transform:translateY(-4px) scaleX(1.08) rotate(var(--glint-rot,0deg))}}
/* hero glow */
.hero:before{animation:glow 11s ease-in-out infinite alternate}
@keyframes glow{0%{opacity:.65;transform:translateY(0) scale(1)}100%{opacity:1;transform:translateY(10px) scale(1.09)}}
/* cta ring pulse */
.cta:after{content:"";position:absolute;inset:0;border-radius:14px;animation:ctaPulse 2.8s ease-out infinite;pointer-events:none}
@keyframes ctaPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--wa) 50%,transparent)}70%,100%{box-shadow:0 0 0 15px transparent}}
/* platform card color glow on hover */
.pcard:hover .plogo{box-shadow:0 0 22px color-mix(in srgb,var(--pc,var(--ac)) 65%,transparent);transition:box-shadow .25s}
.locating{position:relative;z-index:6}
.locating:before{content:"";position:absolute;inset:-7px;border-radius:13px;border:2px solid var(--ac);box-shadow:0 0 0 4px color-mix(in srgb,var(--ac) 22%,transparent);animation:locateRing 1.8s ease-out;pointer-events:none}
@keyframes locateRing{0%{opacity:0;transform:scale(1.05)}14%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
.locating:after{content:"✎ Editando aquí";position:absolute;top:-32px;left:50%;transform:translateX(-50%);background:var(--ac);color:#fff;font-size:11px;font-weight:800;padding:4px 11px;border-radius:9px;white-space:nowrap;box-shadow:0 8px 20px rgba(0,0,0,.45);animation:locateTag 2s ease forwards;pointer-events:none;z-index:7}
@keyframes locateTag{0%{opacity:0;transform:translateX(-50%) translateY(7px)}13%{opacity:1;transform:translateX(-50%) translateY(0)}80%{opacity:1}100%{opacity:0}}
@media(prefers-reduced-motion:reduce){html:not(.force-motion) .reveal{opacity:1;transform:none;transition:none}html:not(.force-motion) .hero .badge,html:not(.force-motion) .hero h1,html:not(.force-motion) .hero .lead,html:not(.force-motion) .hero a.cta,html:not(.force-motion) .nav,html:not(.force-motion) .orb,html:not(.force-motion) .popcorn-float,html:not(.force-motion) .tv-shine:before,html:not(.force-motion) .tv-glint,html:not(.force-motion) .cta:after,html:not(.force-motion) .fab,html:not(.force-motion) .hero:before,html:not(.force-motion) .hero-tv,html:not(.force-motion) .hero-art:before,html:not(.force-motion) .hero-art:after{animation:none}html:not(.force-motion) .hero .ac{-webkit-text-fill-color:var(--ac);animation:none}}
/* states */
#loader{position:fixed;inset:0;display:grid;place-items:center;gap:14px;color:rgba(255,255,255,.6);background:var(--bg,#07050d);z-index:100}
.sp{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.18);border-top-color:var(--ac,#8b40f5);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#notfound{display:none;min-height:100vh;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:30px}
#notfound h2{font-size:24px}#notfound p{color:rgba(255,255,255,.6);max-width:380px;line-height:1.6}
/* ── Femme theme ────────────────────────────────────────────────── */
[data-theme="femme"] .pcard{border-color:rgba(244,114,182,.14);background:linear-gradient(140deg,rgba(244,114,182,.07),rgba(232,121,249,.04));border-radius:22px}
[data-theme="femme"] .cta{background:linear-gradient(135deg,#f472b6,#e879f9);color:#fff;box-shadow:0 12px 32px rgba(244,114,182,.35)}
[data-theme="femme"] .nav-wa{background:rgba(244,114,182,.15);color:#f9a8d4;border:1px solid rgba(244,114,182,.28)}
[data-theme="femme"] .step{background:rgba(244,114,182,.05);border-color:rgba(244,114,182,.11)}
[data-theme="femme"] .tcard{border-color:rgba(244,114,182,.12);background:rgba(244,114,182,.04)}
[data-theme="femme"] .tcard .stars{color:#f472b6}
[data-theme="femme"] .tav{background:linear-gradient(135deg,#f472b6,#e879f9)}
[data-theme="femme"] .faq .qa{border-color:rgba(244,114,182,.13);background:rgba(244,114,182,.04)}
[data-theme="femme"] footer{border-top-color:rgba(244,114,182,.15)}
[data-theme="femme"] .fab{background:linear-gradient(135deg,#f472b6,#e879f9);box-shadow:0 12px 30px rgba(244,114,182,.4);color:#fff}
[data-theme="femme"] .fab .wa-icon path{fill:#fff}
[data-theme="femme"] .star-bg::before,[data-theme="femme"] .star-bg::after{filter:sepia(.7) saturate(3.5) hue-rotate(300deg) brightness(1.1)}

/* Femme japonesa independiente */
html,body{overflow-x:hidden}
.sakura-layer{position:fixed;inset:0;z-index:1;overflow:hidden;pointer-events:none;display:none}
.sakura-petal{position:absolute;width:18px;height:14px;border-radius:70% 0 70% 0;background:linear-gradient(135deg,#fff7fc,#ff9ad6 55%,#ff4aac);box-shadow:0 0 16px rgba(255,255,255,.32);opacity:.7;filter:blur(.2px);animation:sakuraFall var(--fall,13s) linear infinite}
.sakura-petal:nth-child(1){left:8%;top:-8%;--fall:14s;--drift:72px;animation-delay:-1s}
.sakura-petal:nth-child(2){left:24%;top:-10%;--fall:17s;--drift:-58px;animation-delay:-7s;transform:scale(.76)}
.sakura-petal:nth-child(3){left:46%;top:-12%;--fall:15s;--drift:44px;animation-delay:-4s;transform:scale(.92)}
.sakura-petal:nth-child(4){left:67%;top:-9%;--fall:19s;--drift:-78px;animation-delay:-10s;transform:scale(.68)}
.sakura-petal:nth-child(5){left:82%;top:-11%;--fall:16s;--drift:54px;animation-delay:-6s}
.sakura-petal:nth-child(6){left:94%;top:-7%;--fall:20s;--drift:-96px;animation-delay:-12s;transform:scale(.82)}
@keyframes sakuraFall{0%{transform:translate3d(0,-12vh,0) rotate(0deg)}50%{transform:translate3d(calc(var(--drift,50px)*.55),48vh,0) rotate(135deg)}100%{transform:translate3d(var(--drift,50px),108vh,0) rotate(290deg)}}
[data-theme="femme"] body{background:radial-gradient(circle at 22% 14%,rgba(255,255,255,.34),transparent 17%),radial-gradient(circle at 82% 20%,rgba(255,244,252,.28),transparent 23%),radial-gradient(circle at 50% -12%,#ff91d6 0,#ff37a6 34%,transparent 66%),linear-gradient(160deg,#ff2f9e 0%,#f01888 46%,#9d176e 100%)}
[data-theme="femme"] body:before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.18;background:radial-gradient(circle at 16px 16px,rgba(255,255,255,.78) 0 1px,transparent 2px) 0 0/42px 42px,linear-gradient(135deg,transparent 47%,rgba(255,255,255,.22) 49%,transparent 52%) 0 0/82px 82px}
[data-theme="femme"] .sakura-layer{display:block}
[data-theme="femme"] .orbs{opacity:.62}
[data-theme="femme"] .orb{filter:blur(74px)}
[data-theme="femme"] .nav{background:rgba(123,0,78,.28);border-bottom-color:rgba(255,255,255,.2);box-shadow:0 18px 45px rgba(113,0,73,.12)}
[data-theme="femme"] .hero:before{background:radial-gradient(44% 40% at 28% 28%,rgba(255,255,255,.2),transparent 70%),radial-gradient(55% 48% at 76% 0%,rgba(255,219,242,.28),transparent 72%)}
[data-theme="femme"] .hero-art:before{background:rgba(255,255,255,.54);filter:blur(40px)}
[data-theme="femme"] .hero-art:after{background:rgba(255,191,225,.52);filter:blur(30px)}
[data-theme="femme"] .hero-tv{filter:drop-shadow(0 34px 44px rgba(108,0,68,.42)) drop-shadow(0 0 30px rgba(255,255,255,.28))}

// Estrellas — box-shadow posicionado dentro del viewport exacto (overflow:hidden clipa lo de afuera)
(function(){
  var mob=window.innerWidth<640;
  var rnd=function(max){return Math.floor(Math.random()*max);};
  var W=window.innerWidth-2,H=window.innerHeight-2;
  var n1=mob?35:100,n2=mob?12:35;
  var s1=[],s2=[];
  for(var i=0;i<n1;i++){
    var op=(Math.random()*.5+.25).toFixed(2),sz=Math.random()<.7?1:2;
    s1.push(rnd(W)+'px '+rnd(H)+'px '+sz+'px rgba(255,255,255,'+op+')');
  }
  for(var j=0;j<n2;j++){s2.push(rnd(W)+'px '+rnd(H)+'px 2px rgba(255,255,255,.2)');}
  var st=document.createElement('style');
  st.textContent=
    '.star-bg{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}'+
    '.star-bg:before,.star-bg:after{content:"";position:absolute;top:0;left:0;width:1px;height:1px;border-radius:50%;will-change:opacity}'+
    '.star-bg:before{box-shadow:'+s1.join(',')+';animation:starTw 2.8s ease-in-out infinite alternate}'+
    '.star-bg:after{box-shadow:'+s2.join(',')+';animation:starTw 4.1s .9s ease-in-out infinite alternate-reverse}'+
    '@keyframes starTw{0%,100%{opacity:.04}50%{opacity:1}}';
  document.head.appendChild(st);
  var div=document.createElement('div');div.className='star-bg';
  document.body.prepend(div);
})();
</script>

    html+='<div class="pgrid" style="--cols:'+cols+';--mob-cols:'+mobCols+'">';
    (store.platforms||[]).forEach((p,i)=>{
      const logo=p.logo?'<img src="'+esc(p.logo)+'" style="width:100%;height:100%;object-fit:contain" onerror="this.replaceWith(Object.assign(document.createElement(\'span\'),{textContent:this.alt}))" alt="'+esc((p.platform||'').slice(0,2).toUpperCase())+'">':esc((p.platform||'').slice(0,2).toUpperCase());
      const link=waLink(store,'Hola, me interesa el plan de '+(p.platform||'')+'. ¿Está disponible?');
      html+='<div class="pcard reveal" style="transition-delay:'+(i*55)+'ms;--pc:'+esc(p.color||'var(--ac)')+'"><div class="top"><div class="plogo" style="background:'+esc(p.color||'#8b40f5')+'">'+logo+'</div><div><b>'+esc(p.platform)+'</b><div class="slots">'+(p.freeSlots||0)+' cupos libres</div></div></div><div class="price">'+(p.salePrice?sym+p.salePrice:'Consultar')+' <small>'+(p.salePrice?'/ mes':'')+'</small></div><a class="pbtn" href="'+link+'" target="_blank" rel="noopener">'+WA_ICON+'Pedir ahora</a></div>';
    });
    html+='</div></div></section>';
  }
  if(enabled(store,'steps')){
    const steps=[['1','Elige tu plataforma','Mira los planes disponibles y escoge el que necesitas.'],['2','Escríbenos por WhatsApp','Toca el botón y envía tu pedido en segundos.'],['3','Recibe tu acceso','Te entregamos tu cuenta lista para disfrutar en minutos.']];
    html+='<section class="block"><div class="wrap"><div class="sec-head reveal">'+ed('stepsTitle','steps-title','Título pasos','Encabezado','h2','',esc(st.title||'Compra en tres pasos'))+ed('stepsDesc','steps-desc','Descripción pasos','Texto','p','',esc(st.description||''))+'</div><div class="steps">'+steps.map((s,i)=>'<div class="step reveal" style="transition-delay:'+(i*80)+'ms"><div class="n">'+s[0]+'</div><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div>').join('')+'</div></div></section>';
  }
  if(enabled(store,'testimonials')&&(store.testimonials||[]).length){
    html+='<section class="block"><div class="wrap"><div class="sec-head reveal">'+ed('testimonialsTitle','testimonials-title','Título opiniones','Encabezado','h2','',esc(tt.title||'Opiniones de clientes'))+'</div><div class="tgrid">'+(store.testimonials||[]).map((o,i)=>'<div class="tcard reveal" style="transition-delay:'+(i*70)+'ms"><div class="stars">★★★★★</div><p>'+esc(o.text)+'</p><div class="who"><div class="tav">'+(o.photo?'<img src="'+esc(o.photo)+'" alt="">':esc(initials(o.name)))+'</div><b>'+esc(o.name||'Cliente')+'</b></div></div>').join('')+'</div></div></section>';
  }
  if(enabled(store,'faq')){
    const qs=[['¿Cómo recibo mi cuenta?','Te la enviamos por WhatsApp apenas confirmas tu pedido.'],['¿Los precios son mensuales?','Sí, salvo que se indique otra cosa en el plan.'],['¿Tienen garantía?','Sí, damos soporte directo ante cualquier inconveniente.']];
    html+='<section class="block faq"><div class="wrap" style="max-width:760px"><div class="sec-head reveal">'+ed('faqTitle','faq-title','Título FAQ','Encabezado','h2','',esc(fq.title||'Preguntas frecuentes'))+'</div>'+qs.map((q,i)=>'<div class="qa reveal" style="transition-delay:'+(i*70)+'ms"><b>'+q[0]+'</b><span>'+q[1]+'</span></div>').join('')+'</div></section>';
  }
  html+='<footer><div class="wrap">'+ed('footerNote','footer-note','Footer','Texto','div','',esc(store.footerNote||'Más entretenimiento, menos fricción. Pide por WhatsApp y recibe atención directa.'))+'</div></footer>';
  html+='<a class="fab" href="'+waHero+'" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp">'+WA_ICON+'</a>';
  document.getElementById('loader').style.display='none';
  document.getElementById('notfound').style.display='none';
  document.getElementById('root').innerHTML=html;
  applyAllStyles();requestAnimationFrame(()=>{observeReveal();requestAnimationFrame(applyMarquee);});
  if(isPreview)bindSelect();
}

function applyStyle(key,s){document.querySelectorAll('[data-key="'+key+'"]').forEach(el=>{el.style.transform='translate('+(s.x||0)+'px,'+(s.y||0)+'px)';el.style.width=(s.width||100)+'%';el.style.marginLeft=s.align==='left'?'0':'auto';el.style.marginRight=s.align==='right'?'0':'auto';el.style.textAlign=s.align||'center';el.style.color=s.color||'';if((s.width||100)<100)el.style.display='block';});}
function applyAllStyles(){Object.entries(STYLES).forEach(([k,s])=>applyStyle(k,s));}

let _first=true,_lt;
function observeReveal(){
  if(!_first){document.querySelectorAll('.reveal').forEach(el=>el.classList.add('in'));return;}
  _first=false;checkReveal();
  window.addEventListener('scroll',checkReveal,{passive:true});
  window.addEventListener('resize',checkReveal);
}
function checkReveal(){var vh=window.innerHeight||800;document.querySelectorAll('.reveal:not(.in)').forEach(function(el){if(el.getBoundingClientRect().top<vh*0.92)el.classList.add('in');});}
function applyMarquee(){
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  document.querySelectorAll('.pcard b').forEach(function(el){
    if(el.querySelector('.mq'))return;
    var ov=el.scrollWidth-el.clientWidth;
    if(ov>2){
      var txt=el.textContent;
      el.textContent='';
      el.style.textOverflow='clip';
      var s=document.createElement('span');
      s.className='mq';
      s.textContent=txt;
      el.style.setProperty('--mdist','-'+ov+'px');
      el.style.setProperty('--mdur',Math.max(2.5,ov/30).toFixed(1)+'s');
      el.appendChild(s);
    }
  });
}
function locate(field){
  const el=document.querySelector('[data-field="'+field+'"]');if(!el)return;
  el.classList.add('in');
  const r=el.getBoundingClientRect();
  const top=Math.max(0,r.top+window.scrollY-(window.innerHeight/2)+r.height/2);
  window.scrollTo({top,behavior:'smooth'});
  document.querySelectorAll('.locating').forEach(x=>x.classList.remove('locating'));
  void el.offsetWidth;el.classList.add('locating');
  clearTimeout(_lt);_lt=setTimeout(()=>el.classList.remove('locating'),2100);
}

// Editor-only interactions (click-to-select + double-click inline edit)
function bindSelect(){
  document.body.classList.add('editing');
  document.querySelectorAll('.sel').forEach(el=>{
    el.addEventListener('click',ev=>{if(el.isContentEditable)return;ev.preventDefault();ev.stopPropagation();document.querySelectorAll('.sel.active').forEach(x=>x.classList.remove('active'));el.classList.add('active');parent.postMessage({type:'CATALOG_SELECT',key:el.dataset.key,label:el.dataset.label,objectType:el.dataset.type},'*');});
    el.addEventListener('dblclick',ev=>{ev.preventDefault();ev.stopPropagation();el.contentEditable='true';el.focus();
      const done=()=>{el.contentEditable='false';el.removeEventListener('blur',done);parent.postMessage({type:'CATALOG_EDIT',field:el.dataset.field,value:el.innerText.trim()},'*');};
      el.addEventListener('blur',done);
      el.addEventListener('keydown',k=>{if(k.key==='Enter'&&!k.shiftKey){k.preventDefault();el.blur();}});
    });
  });
}

window.addEventListener('message',e=>{const m=e.data;if(!m||typeof m!=='object')return;
  if(m.type==='CATALOG_PREVIEW_UPDATE'&&m.store){render(m.store);}
  if(m.type==='CATALOG_APPLY_STYLE'&&m.key){STYLES[m.key]=m.style;applyStyle(m.key,m.style);}
  if(m.type==='CATALOG_LOCATE'&&m.field){locate(m.field);}
});

async function boot(){
  if(isPreview){document.getElementById('loader').querySelector('span').textContent='Vista previa';parent.postMessage({type:'CATALOG_READY'},'*');return;}
  if(!slug){showNotFound();return;}
  const root=document.getElementById('root');
  const cKey='_cat_'+slug;
  // 1. Cache instantáneo (visitantes recurrentes)
  try{const raw=localStorage.getItem(cKey);if(raw){const c=JSON.parse(raw);if(c?.enabled!==false)render(c);}}catch(e){}
  // 2. Firestore REST — sin SDK, sin cascada de módulos
  try{
    const data=await fsGet(slug);
    if(!data||data.enabled===false){if(!root.innerHTML)showNotFound();return;}
    try{localStorage.setItem(cKey,JSON.stringify(data));}catch(e){}
    render(data);
  }catch(err){console.error(err);if(!root.innerHTML)showNotFound();}
}
function showNotFound(){document.getElementById('loader').style.display='none';document.getElementById('notfound').style.display='flex';}
boot();
</script>
