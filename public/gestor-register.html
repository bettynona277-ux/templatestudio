<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diseños Streaming - Registro</title>
<script src="app-check-config.js"></script>
<script>window.FIREBASE_APPCHECK_SITE_KEY=window.FIREBASE_APPCHECK_SITE_KEY||'';</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{
  min-height:100vh;
  font-family:Inter,system-ui,-apple-system,sans-serif;
  background:radial-gradient(circle at top right,#182957 0%,#0b1428 36%,#060c16 100%);
  color:#f4f7ff;
  display:grid;
  place-items:center;
  padding:20px;
}
.card{
  width:100%;
  max-width:420px;
  background:rgba(13,23,40,.85);
  backdrop-filter:blur(20px);
  border:1px solid rgba(138,161,255,.15);
  border-radius:28px;
  padding:40px 36px;
  box-shadow:0 32px 80px rgba(0,0,0,.5);
}
.brand{display:flex;align-items:center;gap:14px;margin-bottom:36px}
.logo{
  width:52px;height:52px;
  border-radius:16px;
  background:linear-gradient(135deg,#8aa1ff,#7c5cff);
  display:grid;place-items:center;
  font-weight:900;font-size:22px;
  box-shadow:0 8px 24px rgba(124,92,255,.4);
  flex-shrink:0;
}
.brand-text h1{font-size:18px;font-weight:800;letter-spacing:-.04em}
.brand-text small{display:block;margin-top:3px;color:#95a5cb;font-size:12px}
h2{font-size:24px;font-weight:800;letter-spacing:-.05em;margin-bottom:6px}
.subtitle{color:#95a5cb;font-size:14px;margin-bottom:28px}
label{
  display:block;
  font-size:13px;
  font-weight:600;
  color:#95a5cb;
  margin-bottom:6px;
  margin-top:18px;
  letter-spacing:.01em;
}
input{
  width:100%;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(138,161,255,.15);
  border-radius:12px;
  padding:12px 16px;
  color:#f4f7ff;
  font-size:15px;
  outline:none;
  transition:.2s;
}
input:focus{border-color:rgba(138,161,255,.5);background:rgba(138,161,255,.07)}
input::placeholder{color:#4a5a7a}
.btn{
  width:100%;
  margin-top:26px;
  padding:14px;
  border-radius:14px;
  border:none;
  background:linear-gradient(135deg,#8aa1ff,#7c5cff);
  color:#fff;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
  box-shadow:0 6px 20px rgba(124,92,255,.35);
}
.btn:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(124,92,255,.45)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.error{
  margin-top:16px;
  padding:12px 14px;
  border-radius:12px;
  background:rgba(251,113,133,.1);
  border:1px solid rgba(251,113,133,.25);
  color:#fb7185;
  font-size:13px;
  display:none;
}
.error.show{display:block}
.spinner{
  display:inline-block;
  width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-links{margin-top:18px;text-align:center;font-size:13px}
.auth-links a{color:#b8c5ff;text-decoration:none;font-weight:700}
.auth-links a:hover{text-decoration:underline}
.footer{text-align:center;margin-top:28px;color:#4a5a7a;font-size:12px}
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="logo">▶</div>
    <div class="brand-text">
      <h1>Diseños Streaming</h1>
      <small>Panel de gestión</small>
    </div>
  </div>

  <h2>Crear cuenta</h2>
  <p class="subtitle">Regístrate para guardar tus cuentas y clientes de forma privada.</p>

  <label for="email">Correo electrónico</label>
  <input type="email" id="email" placeholder="correo@ejemplo.com" autocomplete="email" />

  <label for="password">Contraseña</label>
  <input type="password" id="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" />

  <label for="passwordConfirm">Confirmar contraseña</label>
  <input type="password" id="passwordConfirm" placeholder="Repite tu contraseña" autocomplete="new-password" />

  <button class="btn" id="registerBtn" onclick="handleRegister()">Crear cuenta</button>

  <div class="error" id="errorMsg"></div>

  <div class="auth-links">
    <a href="gestor-login.html">Ya tengo cuenta</a>
  </div>

  <div class="footer">Diseños Streaming © 2025 · Registro seguro</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { initializeAppCheck, ReCaptchaV3Provider } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app-check.js';
import {
  getAuth, createUserWithEmailAndPassword, sendEmailVerification, signOut
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import {
  getFirestore, doc, setDoc, serverTimestamp
} from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978",
  measurementId: "G-NX5226C0P4"
};

const app = initializeApp(firebaseConfig);
const APP_CHECK_SITE_KEY = window.FIREBASE_APPCHECK_SITE_KEY || '';
if (APP_CHECK_SITE_KEY) {
  initializeAppCheck(app, {
    provider: new ReCaptchaV3Provider(APP_CHECK_SITE_KEY),
    isTokenAutoRefreshEnabled: true
  });
}
const auth = getAuth(app);
const db = getFirestore(app);

window.handleRegister = async function() {
  showError('El acceso se crea desde el panel admin de Diseños Streaming. Usa el mismo correo y contraseña que ya tienes.');
  return;

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const passwordConfirm = document.getElementById('passwordConfirm').value;
  const btn = document.getElementById('registerBtn');

  if (!email || !password || !passwordConfirm) {
    showError('Completa correo y contraseña.');
    return;
  }
  if (password.length < 6) {
    showError('La contraseña debe tener al menos 6 caracteres.');
    return;
  }
  if (password !== passwordConfirm) {
    showError('Las contraseñas no coinciden.');
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Creando cuenta...';

  try {
    const credential = await createUserWithEmailAndPassword(auth, email, password);
    const user = credential.user;

    await Promise.all([
      setDoc(doc(db, 'users', user.uid), {
        uid: user.uid,
        email: user.email,
        name: '',
        plan: 'trial',
        active: true,
        createdAt: serverTimestamp()
      }),
      setDoc(doc(db, 'users', user.uid, 'gestor_config', 'settings'), {
        paymentMethods: [],
        whatsappPrefix: '51',
        freeSort: 'platform'
      })
    ]);

    await sendEmailVerification(user);
    await signOut(auth);
    window.location.href = 'gestor-login.html?registered=1';
  } catch (err) {
    btn.disabled = false;
    btn.innerHTML = 'Crear cuenta';
    showError(friendlyError(err.code));
  }
};

function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.add('show');
}

function friendlyError(code) {
  const map = {
    'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
    'auth/invalid-email': 'El correo no es válido.',
    'auth/weak-password': 'La contraseña es muy débil.',
    'auth/operation-not-allowed': 'Activa el proveedor Email/Password en Firebase Authentication.',
    'auth/network-request-failed': 'Sin conexión. Verifica tu internet.',
    'permission-denied': 'Firestore rechazó la creación. Revisa las reglas de seguridad.'
  };
  return map[code] || 'No se pudo crear la cuenta. Intenta nuevamente.';
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') window.handleRegister();
});
</script>
</body>
</html>
