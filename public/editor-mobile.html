<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diseños Streaming — Editor</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Poppins:wght@300;400;500;600;700;800&family=Montserrat:wght@300;400;500;600;700;800&family=Bebas+Neue&family=Oswald:wght@400;700&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#070b14;--panel:#0e1422;--panel2:#141c2f;
  --border:rgba(255,255,255,0.08);
  --accent:#15d6a4;--blue:#5b8cff;--red:#ff6b81;
  --text:#eef4ff;--muted:#93a0bb;
}
html,body{height:100%;overflow:hidden;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);}

/* ── TOPBAR ── */
.topbar{
  height:52px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;flex-shrink:0;position:relative;z-index:100;
}
.topbar-logo{display:flex;align-items:center;gap:8px;}
.topbar-logo img{height:32px;width:32px;border-radius:7px;object-fit:contain;}
.topbar-logo span{font-weight:800;font-size:0.9rem;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.topbar-actions{display:flex;gap:8px;}
.tbtn{height:36px;padding:0 14px;border-radius:10px;border:none;font-family:inherit;font-size:0.78rem;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;}
.tbtn-green{background:var(--accent);color:#002b22;}
.tbtn-blue{background:var(--blue);color:#fff;}
.tbtn-ghost{background:rgba(255,255,255,0.07);color:var(--text);border:1px solid var(--border);}

/* ── LAYOUT ── */
.layout{display:flex;flex-direction:column;height:calc(100vh - 52px);}
.canvas-wrap{
  flex:1;overflow:scroll;
  background:#040408;
  background-image:radial-gradient(circle,rgba(255,255,255,0.025) 1px,transparent 1px);
  background-size:18px 18px;
  position:relative;
  -webkit-overflow-scrolling:touch;
}
.canvas-inner{
  min-width:100%;min-height:100%;
  display:flex;align-items:center;justify-content:center;
  padding:40px;box-sizing:border-box;
}
#cvs{
  position:relative;overflow:hidden;flex-shrink:0;
  box-shadow:0 16px 56px rgba(0,0,0,0.7);
  transform-origin:center center;
}
.cel{position:absolute;cursor:pointer;user-select:none;overflow:visible;}
.cel.active-touch{outline:2px solid var(--accent);outline-offset:2px;}
.txt-inner{outline:none;white-space:pre-wrap;word-break:break-word;line-height:1.2;padding:2px;pointer-events:none;}

/* ── BOTTOM PANEL ── */
.bottom-panel{
  background:var(--panel);border-top:1px solid var(--border);
  flex-shrink:0;
  /* Altura dinámica: ~38% de la pantalla */
  height:38vh;
  display:flex;flex-direction:column;
}
.panel-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0;}
.ptab{
  flex:1;padding:10px 4px;font-size:0.72rem;font-weight:700;
  background:none;border:none;color:var(--muted);cursor:pointer;
  border-bottom:2px solid transparent;font-family:inherit;
  transition:all 0.2s;
}
.ptab.active{color:var(--accent);border-bottom-color:var(--accent);}
.panel-body{overflow-y:auto;flex:1;padding-bottom:env(safe-area-inset-bottom,12px);}
.panel-body::-webkit-scrollbar{width:3px;}
.panel-body::-webkit-scrollbar-thumb{background:var(--panel2);}

/* ── TEXT EDITOR PANEL ── */
.text-panel{padding:10px 14px;}
.text-panel-empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:0.82rem;line-height:1.6;}
.text-panel-empty .icon{font-size:2rem;margin-bottom:8px;}
.field-label{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:5px;}
.text-input{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;
  font-size:0.9rem;outline:none;resize:none;
}
.text-input:focus{border-color:rgba(21,214,164,0.5);box-shadow:0 0 0 3px rgba(21,214,164,0.1);}
.color-row{display:flex;gap:10px;align-items:center;margin-top:12px;}
.color-preview{width:100%;height:38px;border-radius:10px;border:2px solid var(--border);cursor:pointer;overflow:hidden;position:relative;}
.color-preview-swatch{width:100%;height:100%;border-radius:9px;}
/* Color picker modal */
.cpicker-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:8000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.cpicker-overlay.open{opacity:1;pointer-events:all;}
.cpicker-sheet{background:#1a1f2e;border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px;}
.cpicker-sheet h4{font-size:0.9rem;font-weight:800;margin-bottom:16px;text-align:center;}
.cpicker-preview{width:100%;height:44px;border-radius:10px;margin-bottom:16px;border:2px solid rgba(255,255,255,0.1);}
.cpicker-row{margin-bottom:12px;}
.cpicker-lbl{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;}
.cpicker-slider{width:100%;height:20px;border-radius:10px;outline:none;cursor:pointer;-webkit-appearance:none;}
.cpicker-slider::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:2px solid rgba(0,0,0,0.3);box-shadow:0 2px 6px rgba(0,0,0,0.4);cursor:pointer;}
#cp-hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
.cpicker-hex{width:100%;background:rgba(255,255,255,0.07);border:1px solid var(--border);border-radius:10px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:14px;text-align:center;font-weight:700;letter-spacing:0.1em;}
.cpicker-hex:focus{border-color:var(--accent);}
.cpicker-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.cpicker-btn{padding:12px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:0.88rem;cursor:pointer;}
.cpicker-ok{background:var(--accent);color:#002b22;}
.cpicker-cancel{background:rgba(255,255,255,0.07);color:var(--text);border:1px solid var(--border);}
.size-row{display:flex;gap:8px;margin-top:12px;}
.size-btn{flex:1;height:38px;border-radius:9px;border:1px solid var(--border);background:rgba(255,255,255,0.04);color:var(--text);font-size:1rem;cursor:pointer;}
.size-btn:active{background:rgba(21,214,164,0.15);}
.active-flip{background:rgba(21,214,164,0.2)!important;border-color:var(--accent)!important;color:var(--accent)!important;}
.layer-name-badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(21,214,164,0.12);border:1px solid rgba(21,214,164,0.25);
  border-radius:999px;padding:3px 10px;font-size:0.72rem;font-weight:700;
  color:var(--accent);margin-bottom:6px;
}

/* ── LOGOS PANEL ── */
.logos-panel{padding:12px;}
.logos-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
.logo-card{
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:12px;aspect-ratio:1;position:relative;overflow:hidden;
  cursor:pointer;transition:all 0.15s;
}
.logo-card:active{transform:scale(0.93);border-color:var(--accent);}
.logo-card img{width:100%;height:100%;object-fit:contain;padding:6px;pointer-events:none;}
.logo-card .add-btn{
  position:absolute;bottom:3px;right:3px;
  background:var(--accent);color:#002b22;
  border:none;border-radius:6px;
  width:22px;height:22px;font-size:0.9rem;font-weight:900;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
}
.logos-empty{text-align:center;padding:28px 16px;color:var(--muted);font-size:0.82rem;}

/* ── LOADING ── */
.loading{position:fixed;inset:0;background:rgba(7,11,20,0.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;opacity:0;pointer-events:none;transition:opacity 0.25s;}
.loading.show{opacity:1;pointer-events:all;}
.spin{width:44px;height:44px;border:3px solid rgba(21,214,164,0.15);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;margin-bottom:14px;}
@keyframes sp{to{transform:rotate(360deg);}}
.load-text{font-size:0.85rem;color:var(--muted);}

/* ── TOAST ── */
#m-toast{
  position:fixed;bottom:300px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.88);color:#fff;
  padding:8px 18px;border-radius:999px;font-size:0.78rem;font-weight:600;
  z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.3s;
  white-space:nowrap;
}

/* ── SAVE MODAL ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(6px);z-index:500;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.2s;}
.overlay.open{opacity:1;pointer-events:all;}
.modal-sheet{background:var(--panel);border-radius:20px 20px 0 0;padding:24px 20px 32px;width:100%;max-width:480px;}
.modal-sheet h3{font-size:1rem;font-weight:800;margin-bottom:6px;}
.modal-sheet p{font-size:0.8rem;color:var(--muted);margin-bottom:16px;}
.modal-inp{width:100%;background:rgba(255,255,255,0.05);border:1.5px solid var(--border);border-radius:11px;padding:12px 14px;color:var(--text);font-family:inherit;font-size:0.9rem;outline:none;margin-bottom:10px;}
.modal-inp:focus{border-color:var(--accent);}
.modal-btn{width:100%;padding:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:0.9rem;cursor:pointer;margin-bottom:8px;}
.modal-btn-green{background:var(--accent);color:#002b22;}
.modal-btn-ghost{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);}
.modal-status{font-size:0.75rem;text-align:center;min-height:16px;margin-top:4px;}

/* ── HANDLES DE TRANSFORMACIÓN ── */
.sel-box{
  position:fixed;pointer-events:none;z-index:9000;
  border:2.5px solid var(--accent);
  box-shadow:0 0 0 1px rgba(0,0,0,0.5),0 0 12px rgba(21,214,164,0.3);
}
.sel-handle{
  position:absolute;width:16px;height:16px;
  background:var(--accent);border:2.5px solid #fff;
  border-radius:5px;pointer-events:all;cursor:pointer;
  transform:translate(-50%,-50%);z-index:9001;
  box-shadow:0 2px 8px rgba(0,0,0,0.5);
}
.sel-handle.nw{top:0;left:0;}
.sel-handle.ne{top:0;left:100%;}
.sel-handle.sw{top:100%;left:0;}
.sel-handle.se{top:100%;left:100%;}

/* ── BOTÓN ELIMINAR ── */
#del-btn{
  position:fixed;z-index:9002;
  background:linear-gradient(135deg,#ff4757,#ff6b81);
  color:#fff;border:none;border-radius:10px;
  padding:8px 16px;font-size:0.8rem;font-weight:800;
  font-family:inherit;cursor:pointer;
  display:none;white-space:nowrap;
  box-shadow:0 4px 16px rgba(255,71,87,0.5);
  transform:translateX(-50%);
  letter-spacing:0.02em;
  border:1.5px solid rgba(255,255,255,0.2);
}

/* zoom via pinch only */
</style>
</head>

function ls(src){
  return new Promise((r,j)=>{
    if(document.querySelector(`script[src="${src}"]`)) return r();
    const s=document.createElement('script');
    s.src=src; s.onload=r; s.onerror=j;
    document.head.appendChild(s);
  });
}

async function initFB(){
  const savedCfg = localStorage.getItem('ts_firebase_config');
  const config = savedCfg ? JSON.parse(savedCfg) : FIREBASE_CONFIG;
  try{
    await ls('https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js');
    await ls('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js');
    await ls('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js');

    try { fbApp = firebase.app('ts-client'); }
    catch(e) { fbApp = firebase.initializeApp(config, 'ts-client'); }

    fbDb = firebase.firestore(fbApp);
    fbAuth = firebase.auth(fbApp);

    try{ await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL); }catch(_){}
  }catch(e){ console.warn('Firebase init error:', e); }
}

// ══════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════
function toast(msg){
  const t = document.getElementById('m-toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.style.opacity='0', 2000);
}

// ══════════════════════════════════════════
// LOADING
// ══════════════════════════════════════════
function showLoad(txt){ document.getElementById('loading').classList.add('show'); document.getElementById('load-text').textContent=txt||'Cargando...'; }
function hideLoad(){ document.getElementById('loading').classList.remove('show'); }

// ══════════════════════════════════════════
// CANVAS & LAYERS
// ══════════════════════════════════════════
function extractPayload(data){
  if(!data||typeof data!=='object') return null;
  if(data.template&&typeof data.template==='object') return data.template;
  if(data.templateData&&typeof data.templateData==='object') return data.templateData;
  if(data.type==='psd-layers'&&Array.isArray(data.layers)) return data;
  return null;
}

function loadDesign(tpl){
  if(!tpl||tpl.type!=='psd-layers') return;
  Array.from(cvs.children).forEach(el=>el.remove());
  layers = [];
  // sel-box es fixed, asegurarse que esté en el body
  const box = document.getElementById('sel-box');
  if(box && box.parentNode !== document.body) document.body.appendChild(box);
  const delBtn = document.getElementById('del-btn');
  if(delBtn && delBtn.parentNode !== document.body) document.body.appendChild(delBtn);

  cvs.style.width = (tpl.canvasW||800)+'px';
  cvs.style.height = (tpl.canvasH||800)+'px';

  (tpl.layers||[]).forEach(ld=>{
    // Deep copy para evitar que capas compartan referencias
    // Para frames: SIEMPRE usar frameImage (tiene prioridad sobre src que puede estar corrupto)
    // El editor PC guarda el logo correcto en frameImage; src puede tener URL incorrecta
    let resolvedSrc = (ld.type === 'frame')
      ? (ld.frameImage || ld.src || null)
      : (ld.src || null);
    const l = {
      ...ld,
      el: null,
      tp: ld.tp ? {...ld.tp} : null,
      src: resolvedSrc
    };
    layers.push(l);
    buildEl(l);
  });

  fitCanvas();
  desel();
  history_ = []; // limpiar historial al cargar
  snapshot();    // guardar estado inicial
}

// ══════════════════════════════════════════
// SISTEMA DE SELECCIÓN Y TRANSFORMACIÓN
// ══════════════════════════════════════════
let selBox = null;
let activeLayer = null; // capa actualmente seleccionada para mover/escalar

// ── HISTORIAL ──
const HISTORY_MAX = 20;
let history_ = [];

function snapshot(){
  const state = JSON.stringify(layers.map(l=>({
    ...l, el:null,
    tp: l.tp ? {...l.tp} : null
  })));
  if(history_.length && history_[history_.length-1] === state) return;
  history_.push(state);
  if(history_.length > HISTORY_MAX) history_.shift();
  updateUndoBtn();
}

function undoStep(){
  if(history_.length < 2){ toast('No hay más pasos'); return; }
  history_.pop(); // quitar estado actual
  const prev = JSON.parse(history_[history_.length-1]);
  desel();
  // Reconstruir capas
  Array.from(cvs.children).forEach(el=>{
    if(el.id!=='sel-box'&&el.id!=='del-btn') el.remove();
  });
  layers = [];
  prev.forEach(ld=>{
    const resolvedSrc = (ld.type === 'frame')
      ? (ld.frameImage || ld.src || null)
      : (ld.src || null);
    const l = {...ld, el:null, tp: ld.tp?{...ld.tp}:null, src: resolvedSrc};
    layers.push(l);
    buildEl(l);
  });
  toast('↩ Deshecho');
  updateUndoBtn();
}

function updateUndoBtn(){
  const btn = document.getElementById('btn-undo');
  if(btn) btn.style.opacity = history_.length > 1 ? '1' : '0.35';
}

function getSelBox(){ return document.getElementById('sel-box'); }

function showSelBox(layer){
  const box = getSelBox();
  if(!box||!layer||!layer.el) return;
  activeLayer = layer;
  updateSelBox();
  box.style.display = 'block';
  attachHandles(layer);
  // Mostrar botón eliminar usando coordenadas de pantalla
  const rect = layer.el.getBoundingClientRect();
  const delBtn = document.getElementById('del-btn');
  if(delBtn){
    delBtn.style.display = 'block';
    delBtn.style.left = (rect.left + rect.width/2) + 'px';
    delBtn.style.top  = Math.max(8, rect.top - 44) + 'px';
    delBtn.style.transform = 'translateX(-50%)';
  }
}

function updateSelBox(){
  if(!activeLayer || !activeLayer.el) return;
  const box = getSelBox();
  const rect = activeLayer.el.getBoundingClientRect();
  // Usar posición real en pantalla (fixed)
  box.style.left   = (rect.left - 3) + 'px';
  box.style.top    = (rect.top  - 3) + 'px';
  box.style.width  = (rect.width  + 6) + 'px';
  box.style.height = (rect.height + 6) + 'px';
  // Reposicionar el del-btn
  const delBtn = document.getElementById('del-btn');
  if(delBtn && delBtn.style.display !== 'none'){
    delBtn.style.left = (rect.left + rect.width/2) + 'px';
    delBtn.style.top  = Math.max(8, rect.top - 44) + 'px';
    delBtn.style.transform = 'translateX(-50%)';
  }
}

function hideSelBox(){
  const box = getSelBox();
  if(box) box.style.display = 'none';
  const delBtn = document.getElementById('del-btn');
  if(delBtn) delBtn.style.display = 'none';
  activeLayer = null;
}

// Handles de escala proporcional desde esquinas
function attachHandles(layer){
  const handles = {
    nw: document.getElementById('sh-nw'),
    ne: document.getElementById('sh-ne'),
    sw: document.getElementById('sh-sw'),
    se: document.getElementById('sh-se')
  };
  Object.entries(handles).forEach(([corner, handle])=>{
    if(!handle) return;
    // Limpiar listeners anteriores
    const newHandle = handle.cloneNode(true);
    handle.parentNode.replaceChild(newHandle, handle);
    
    let t0x, t0y, origW, origH, origX, origY;
    
    newHandle.addEventListener('touchstart', e=>{
      e.stopPropagation(); e.preventDefault();
      const t = e.touches[0];
      t0x = t.clientX; t0y = t.clientY;
      origW = layer.w; origH = layer.h;
      origX = layer.x; origY = layer.y;
    },{passive:false});

    newHandle.addEventListener('touchmove', e=>{
      e.stopPropagation(); e.preventDefault();
      const t = e.touches[0];
      // Diferencia en pantalla → convertir a espacio canvas
      const dx = (t.clientX - t0x) / zoom_;
      const dy = (t.clientY - t0y) / zoom_;
      
      // Escalar proporcionalmente
      const diag = Math.sqrt(dx*dx + dy*dy);
      const sign = (dx + dy) > 0 ? 1 : -1;
      const delta = sign * diag * 0.7;
      
      const ratio = origH / origW;
      let newW, newH, newX, newY;
      
      if(corner === 'se'){
        newW = Math.max(20, origW + delta);
        newH = Math.max(20, newW * ratio);
        newX = origX; newY = origY;
      } else if(corner === 'sw'){
        newW = Math.max(20, origW - delta);
        newH = Math.max(20, newW * ratio);
        newX = origX + (origW - newW); newY = origY;
      } else if(corner === 'ne'){
        newW = Math.max(20, origW + delta);
        newH = Math.max(20, newW * ratio);
        newX = origX; newY = origY + (origH - newH);
      } else { // nw
        newW = Math.max(20, origW - delta);
        newH = Math.max(20, newW * ratio);
        newX = origX + (origW - newW);
        newY = origY + (origH - newH);
      }
      
      layer.w = Math.round(newW);
      layer.h = Math.round(newH);
      layer.x = Math.round(newX);
      layer.y = Math.round(newY);
      
      if(layer.el){
        layer.el.style.width  = layer.w + 'px';
        layer.el.style.height = layer.h + 'px';
        layer.el.style.left   = layer.x + 'px';
        layer.el.style.top    = layer.y + 'px';
      }
      updateSelBox();
    },{passive:false});

    newHandle.addEventListener('touchend', e=>{ e.stopPropagation(); },{passive:true});
  });
}

// Drag de la capa cuando ya está seleccionada
function makeDraggable(el, layer, onTap){
  let startX=0, startY=0, startL=0, startT=0;
  let moved=false;
  const MOVE_THRESHOLD = 8;

  el.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    e.stopPropagation();
    const t=e.touches[0];
    startX=t.clientX; startY=t.clientY;
    startL=layer.x; startT=layer.y;
    moved=false;
  },{passive:true});

  el.addEventListener('touchmove', e=>{
    if(e.touches.length!==1) return;
    // Solo mover si esta capa está activa
    if(activeLayer !== layer) return;
    e.preventDefault(); e.stopPropagation();
    const t=e.touches[0];
    const dx=(t.clientX-startX)/zoom_;
    const dy=(t.clientY-startY)/zoom_;
    if(Math.abs(dx)>MOVE_THRESHOLD||Math.abs(dy)>MOVE_THRESHOLD) moved=true;
    if(moved){
      layer.x=Math.round(startL+dx);
      layer.y=Math.round(startT+dy);
      el.style.left=layer.x+'px';
      el.style.top=layer.y+'px';
      updateSelBox();
    }
  },{passive:false});

  el.addEventListener('touchend', e=>{
    e.stopPropagation();
    if(moved){
      snapshot(); // guardar después de mover
    }
    if(!moved){
      // TAP: seleccionar esta capa y mostrar handles
      if(activeLayer === layer){
        // Segundo tap = acción específica del tipo
        if(layer.type==='text') fillTextPanel(layer);
        else if(layer.type==='img') openImgPanel(layer);
        else if(onTap) onTap();
      } else {
        // Primer tap = seleccionar y mostrar handles
        layers.forEach(x=>{ if(x.el) x.el.classList.remove('active-touch'); });
        layer.el?.classList.add('active-touch');
        showSelBox(layer);
        selId = layer.id;
        // Ocultar tab img si no es imagen
        if(layer.type!=='img' && layer.type!=='frame'){
          document.getElementById('ptab-img').style.display = 'none';
          if(currentTab==='img') switchTab('text');
        }
        if(layer.type==='text') fillTextPanel(layer);
        else if(layer.type==='img') openImgPanel(layer);
        else if(layer.type==='frame' && onTap) onTap();
      }
    }
    moved=false;
  },{passive:true});
}

function buildOuterStrokeShadow(width, color){
  const w = parseInt(width||0);
  if(w <= 0) return '';
  const offsets = [];
  for(let x=-w; x<=w; x++){
    for(let y=-w; y<=w; y++){
      if(x===0 && y===0) continue;
      if(Math.max(Math.abs(x), Math.abs(y)) <= w){
        offsets.push(`${x}px ${y}px 0 ${color}`);
      }
    }
  }
  return offsets.join(', ');
}

function applyTextStylesMobile(layer){
  if(!layer?.tp) return;
  const d = document.getElementById('ti-'+layer.id);
  if(!d) return;
  const tp = layer.tp;
  // Construir text-shadow: borde exterior + sombra
  const parts = [];
  const outerStroke = buildOuterStrokeShadow(tp.strokeWidth||0, tp.strokeColor||'#000000');
  if(outerStroke) parts.push(outerStroke);
  const drop = parseInt(tp.shadowBlur||0);
  if(drop > 0){
    const sc = tp.shadowColor || 'rgba(0,0,0,0.45)';
    parts.push(`0 ${Math.max(1,Math.round(drop*0.18))}px ${Math.max(3,drop*0.8)}px ${sc}`);
  }
  d.style.webkitTextStroke = '';
  d.style.textShadow = parts.join(', ');
  d.style.fontSize = (tp.fontSize||24) + 'px';
  d.style.fontWeight = tp.fontWeight || '400';
  d.style.fontFamily = tp.fontFamily || "'Poppins'";
  d.style.color = tp.color || '#fff';
  d.style.textAlign = tp.textAlign || tp.align || 'left';
  d.style.width = '100%';
  d.style.height = '100%';
  d.style.fontStyle = tp.italic ? 'italic' : 'normal';
  d.style.textDecoration = tp.underline ? 'underline' : 'none';
  d.style.letterSpacing = (parseFloat(tp.letterSpacing)||0) + 'px';
  d.style.lineHeight = tp.lineHeight || 1.2;
  d.style.textTransform = tp.textTransform || 'none';
  d.style.whiteSpace = 'pre-wrap';
  d.style.wordBreak = 'break-word';
  d.style.pointerEvents = 'none';
}

function buildEl(l){
  const el = document.createElement('div');
  el.className = 'cel';
  el.style.cssText = `left:${l.x}px;top:${l.y}px;width:${l.w}px;height:${l.h}px;z-index:${l.zIndex||0};position:absolute;`;
  if(l.opacity !== undefined) el.style.opacity = l.opacity;
  if(!l.visible) el.style.display = 'none';

  if(l.type === 'text' && l.tp){
    const d = document.createElement('div');
    d.className = 'txt-inner';
    d.id = 'ti-'+l.id;
    d.textContent = l.tp.text || '';
    el.appendChild(d);
    makeDraggable(el, l, ()=>selectLayer(l.id));

  } else if(l.type === 'img'){
    const img = document.createElement('img');
    img.src = l.src||'';
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;';
    if(l.flipX||l.flipY) img.style.transform=`scale(${l.flipX?-1:1},${l.flipY?-1:1})`;
    if(l.blur>0) img.style.filter=`blur(${l.blur}px)`;
    el.appendChild(img);
    makeDraggable(el, l);

  } else if(l.type === 'frame'){
    el.style.borderRadius = (l.frameRadius||0)+'px';
    el.style.overflow = 'hidden';
    // Nombres del editor PC: frameBorderWidth, frameShadow, frameInnerShadow
    const fBW  = Number(l.frameBorderWidth  || l.borderWidth  || 0);
    const fBC  = l.frameBorderColor || l.borderColor || '#00ffc3';
    const fSh  = Number(l.frameShadow       || l.shadowBlur   || 0);
    const fISh = Number(l.frameInnerShadow  || l.innerShadow  || 0);
    const shadowParts = [];
    if(fSh>0)  shadowParts.push(`0 4px ${fSh}px rgba(0,0,0,0.6)`);
    if(fISh>0) shadowParts.push(`inset 0 0 ${fISh}px rgba(0,0,0,0.7)`);
    if(shadowParts.length) el.style.boxShadow = shadowParts.join(', ');
    if(l.src){
      if(fBW>0) el.style.outline = `${fBW}px solid ${fBC}`;
      const img = document.createElement('img');
      img.src = l.src;
      img.className = 'frame-inner';
      img.id = 'fi-'+l.id;
      img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
      el.appendChild(img);
    } else {
      // Marco vacío — borde de efectos o dashed
      if(fBW>0){
        el.style.border = `${fBW}px solid ${fBC}`;
      } else {
        el.style.border = '2px dashed rgba(21,214,164,0.3)';
      }
      const hint = document.createElement('div');
      hint.className = 'frame-empty-hint';
      hint.style.cssText = 'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:rgba(21,214,164,0.4);pointer-events:none;';
      hint.textContent = '🖼';
      el.appendChild(hint);
    }
    // Frame: drag para mover, tap para seleccionar/insertar logo
    {
      let sx,sy,sl,st,moved=false;
      el.addEventListener('touchstart',e=>{
        if(e.touches.length!==1)return;
        e.stopPropagation();
        const t=e.touches[0];
        sx=t.clientX;sy=t.clientY;sl=l.x;st=l.y;moved=false;
      },{passive:true});
      el.addEventListener('touchmove',e=>{
        if(e.touches.length!==1)return;
        e.preventDefault();e.stopPropagation();
        const t=e.touches[0];
        const dx=(t.clientX-sx)/zoom_, dy=(t.clientY-sy)/zoom_;
        if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
        if(moved){
          l.x=Math.round(sl+dx);l.y=Math.round(st+dy);
          el.style.left=l.x+'px';el.style.top=l.y+'px';
          if(activeLayer===l) updateSelBox();
        }
      },{passive:false});
      el.addEventListener('touchend',e=>{
        e.stopPropagation();
        if(!moved) selectFrame(l.id);
        moved=false;
      },{passive:true});
    }

  } else if(l.type === 'shape'){
    if(l.shapeType === 'rect'||!l.shapeType){
      el.style.background = l.fill||'rgba(255,255,255,0.2)';
      el.style.borderRadius = (l.radius||0)+'px';
    } else {
      const svg = document.createElement('div');
      svg.innerHTML = buildShapeSVG(l);
      svg.style.cssText = 'width:100%;height:100%;';
      el.appendChild(svg);
    }
    makeDraggable(el, l);
  }

  cvs.appendChild(el);
  l.el = el;
  // Aplicar efectos DESPUÉS de que el elemento está en el DOM
  if(l.type === 'text') applyTextStylesMobile(l);
}

function buildShapeSVG(l){
  const fill = l.fill||'rgba(255,255,255,0.2)';
  const w = l.w, h = l.h;
  if(l.shapeType==='circle') return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><ellipse cx="${w/2}" cy="${h/2}" rx="${w/2}" ry="${h/2}" fill="${fill}"/></svg>`;
  if(l.shapeType==='triangle') return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><polygon points="${w/2},0 ${w},${h} 0,${h}" fill="${fill}"/></svg>`;
  return `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><rect width="${w}" height="${h}" fill="${fill}"/></svg>`;
}

function fillTextPanel(l){

  document.getElementById('layer-name-lbl').textContent = l.name||'Texto';

function selectLayer(id){
  const l = layers.find(x=>x.id===id);
  if(!l || l.type!=='text') return;
  layers.forEach(x=>{ if(x.el) x.el.classList.remove('active-touch'); });
  selId = id;
  if(l.el) l.el.classList.add('active-touch');
  showSelBox(l);
  fillTextPanel(l);
}

function deleteActive(){
  if(!activeLayer) return;
  snapshot();
  const l = activeLayer;
  if(l.el) l.el.remove();
  layers = layers.filter(x=>x.id !== l.id);
  frameSelId = null;
  desel();
  toast('🗑 Eliminado');
}

function desel(){
  selId = null;
  frameSelId = null;
  hideSelBox();
  layers.forEach(x=>{ if(x.el) x.el.classList.remove('active-touch'); });
  document.getElementById('text-empty').style.display = 'block';
  document.getElementById('text-editor').style.display = 'none';
  document.getElementById('frame-hint').style.display = 'none';
}

let frameSelId = null;

function selectFrame(id){
  const l = layers.find(x=>x.id===id);
  if(!l || l.type!=='frame') return;
  const alreadySel = frameSelId === id;
  layers.forEach(x=>{ if(x.el) x.el.classList.remove('active-touch'); });
  frameSelId = id;
  selId = l.id;
  if(l.el) l.el.classList.add('active-touch');
  showSelBox(l);
  if(alreadySel){
    // Segundo tap → panel imagen (flip/blur/orientación)
    openImgPanel(l);
  } else {
    // Primer tap → mostrar logos para insertar
    document.getElementById('text-empty').style.display = 'none';
    document.getElementById('text-editor').style.display = 'none';
    document.getElementById('frame-hint').style.display = 'block';
    switchTab('logos');
    if(logoCache.length===0) loadLogos();
  }
}

  if(!l || l.type!=='frame') return false;
  l.src = src;

    l.el.style.border = 'none';
    l.el.innerHTML = '';
    const img = document.createElement('img');
    img.src = src;
    img.className = 'frame-inner';
    img.id = 'fi-'+l.id;
    img.style.cssText = 'width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;';
    l.el.appendChild(img);
    {
      let sx,sy,sl,st,moved=false;
      l.el.addEventListener('touchstart',e=>{
        if(e.touches.length!==1)return;
        e.stopPropagation();
        const t=e.touches[0];
        sx=t.clientX;sy=t.clientY;sl=l.x;st=l.y;moved=false;
      },{passive:true});
      l.el.addEventListener('touchmove',e=>{
        if(e.touches.length!==1)return;
        e.preventDefault();e.stopPropagation();
        const t=e.touches[0];
        const dx=(t.clientX-sx)/zoom_, dy=(t.clientY-sy)/zoom_;
        if(Math.abs(dx)>8||Math.abs(dy)>8) moved=true;
        if(moved){
          l.x=Math.round(sl+dx);l.y=Math.round(st+dy);
          l.el.style.left=l.x+'px';l.el.style.top=l.y+'px';
        }
      },{passive:false});

}

let _cpCurrentColor = '#ffffff';

function hsvToHex(h,s,v){
  s/=100; v/=100;
  const c=v*s, x=c*(1-Math.abs((h/60)%2-1)), m=v-c;
  let r,g,b;
  if(h<60){r=c;g=x;b=0;}else if(h<120){r=x;g=c;b=0;}
  else if(h<180){r=0;g=c;b=x;}else if(h<240){r=0;g=x;b=c;}
  else if(h<300){r=x;g=0;b=c;}else{r=c;g=0;b=x;}
  const toHex=n=>Math.round((n+m)*255).toString(16).padStart(2,'0');
  return '#'+toHex(r)+toHex(g)+toHex(b);
}

function hexToHsv(hex){
  const r=parseInt(hex.slice(1,3),16)/255;
  const g=parseInt(hex.slice(3,5),16)/255;
  const b=parseInt(hex.slice(5,7),16)/255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0,s=max===0?0:d/max,v=max;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h=Math.round(h*60); if(h<0) h+=360;
  }
  return [h, Math.round(s*100), Math.round(v*100)];
}

function cpUpdate(){
  const h=parseInt(document.getElementById('cp-hue').value);
  const s=parseInt(document.getElementById('cp-sat').value);
  const v=parseInt(document.getElementById('cp-val').value);
  const hex=hsvToHex(h,s,v);
  _cpCurrentColor=hex;
  document.getElementById('cp-preview').style.background=hex;
  document.getElementById('cp-hex').value=hex;
  // Actualizar gradientes de los sliders
  const satTrack=`linear-gradient(to right, ${hsvToHex(h,0,v)}, ${hsvToHex(h,100,v)})`;
  const valTrack=`linear-gradient(to right, #000, ${hsvToHex(h,s,100)})`;
  document.getElementById('cp-sat').style.background=satTrack;
  document.getElementById('cp-val').style.background=valTrack;
}

function cpHexInput(val){
  if(!/^#[0-9a-fA-F]{6}$/.test(val)) return;
  _cpCurrentColor=val;
  document.getElementById('cp-preview').style.background=val;
  const [h,s,v]=hexToHsv(val);
  document.getElementById('cp-hue').value=h;
  document.getElementById('cp-sat').value=s;
  document.getElementById('cp-val').value=v;
  cpUpdate();
}

function openColorPicker(){
  const col=document.getElementById('color-swatch').style.background||'#ffffff';
  // Convertir rgb() a hex si es necesario
  let hex=col;
  if(col.startsWith('rgb')){
    const m=col.match(/\d+/g);
    hex='#'+[m[0],m[1],m[2]].map(x=>parseInt(x).toString(16).padStart(2,'0')).join('');
  }
  if(!/^#[0-9a-fA-F]{6}$/.test(hex)) hex='#ffffff';
  _cpCurrentColor=hex;
  const [h,s,v]=hexToHsv(hex);
  document.getElementById('cp-hue').value=h;
  document.getElementById('cp-sat').value=s;
  document.getElementById('cp-val').value=v;
  document.getElementById('cp-hex').value=hex;
  document.getElementById('cp-preview').style.background=hex;
  cpUpdate();
  document.getElementById('cpicker-overlay').classList.add('open');
}

function closeColorPicker(){
  document.getElementById('cpicker-overlay').classList.remove('open');
}

function applyColorPicker(){
  updateColor(_cpCurrentColor);
  closeColorPicker();
}

async function loadLogos(){
  const grid = document.getElementById('logos-grid');
  const empty = document.getElementById('logos-empty');
  if(!fbDb){ empty.textContent='Firebase no conectado.'; return; }
  if(!fbAuth?.currentUser){ empty.textContent='Inicia sesión para ver logos.'; return; }
  empty.textContent='Cargando logos...';
  try{
    const snap = await fbDb.collection('logos').orderBy('createdAt','desc').get();
    logoCache = [];
    snap.forEach(doc=>logoCache.push({id:doc.id,...doc.data()}));
    renderLogos();
  }catch(e){
    empty.textContent='Error al cargar logos.';
    console.warn(e);
  }
}

function renderLogos(){
  const grid = document.getElementById('logos-grid');
  const empty = document.getElementById('logos-empty');
  if(logoCache.length===0){ empty.textContent='No hay logos en la biblioteca.'; grid.innerHTML=''; return; }
  empty.style.display='none';
  grid.innerHTML='';
  logoCache.forEach(logo=>{
    const src = (logo.url||logo.src||'').replace(/'/g,"%27");
    const name = (logo.name||'Logo').replace(/'/g,"%27");
    const card = document.createElement('div');
    card.className='logo-card';
    card.innerHTML=`
      <img src="${logo.url||logo.src||''}" alt="${logo.name||'Logo'}">
      <button class="add-btn" onclick="handleLogoTap('${src}','${name}')">+</button>
    `;
    grid.appendChild(card);
  });
}

function handleLogoTap(src, name){
  // Si hay un marco seleccionado, insertar ahí; si no, añadir al canvas
  if(frameSelId){
    applyLogoToFrame(src, name);
  } else {
    addLogoToCanvas(src, name);
  }
}

function addLogoToCanvas(src, name){
  const cw = parseInt(cvs.style.width)||800;
  const ch = parseInt(cvs.style.height)||800;
  const size = Math.round(Math.min(cw,ch)*0.25);
  const l = {
    id: Date.now(),
    type:'img',
    name: name||'Logo',
    src,
    x: Math.round((cw-size)/2),
    y: Math.round((ch-size)/2),
    w: size, h: size,
    zIndex: layers.length,
    opacity: 1,
    visible: true
  };
  layers.push(l);
  buildEl(l);
  snapshot();
  toast('✓ Logo añadido');
}

function toggleFlip(axis){
  const l = layers.find(x=>x.id===selId);
  if(!l) return;
  if(axis==='x') l.flipX = !l.flipX;
  else l.flipY = !l.flipY;
  const img = l.el?.querySelector('img');
  if(img) img.style.transform = `scale(${l.flipX?-1:1},${l.flipY?-1:1})`;
  document.getElementById('btn-flipx')?.classList.toggle('active-flip', !!l.flipX);
  document.getElementById('btn-flipy')?.classList.toggle('active-flip', !!l.flipY);
  snapshot();
}

function updateBlur(val){
  const l = layers.find(x=>x.id===selId);
  if(!l) return;
  l.blur = parseFloat(val);
  const img = l.el?.querySelector('img');
  if(img) img.style.filter = val>0 ? `blur(${val}px)` : '';
  document.getElementById('blur-lbl').textContent = val+'px';
}

  document.getElementById('tab-logos').style.display = tab==='logos'?'block':'none';

function fitCanvas(){
  const area = document.getElementById('canvas-area');
  const aw = area.clientWidth - 32;
  const ah = area.clientHeight - 32;
  const w = parseInt(cvs.style.width)||800;
  const h = parseInt(cvs.style.height)||800;
  zoom_ = Math.min(1, Math.min(aw/w, ah/h));
  zoom_ = Math.max(0.1, Math.round(zoom_*100)/100);
  applyZoom();
}

function doZoom(d){
  zoom_ = Math.min(3, Math.max(0.05, zoom_+d));
  applyZoom();
}

function applyZoom(){
  cvs.style.transform = `scale(${zoom_})`;
  if(activeLayer) requestAnimationFrame(updateSelBox);
}

// Pinch to zoom
let initDist=0, initZoom=1;
document.getElementById('canvas-area').addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    initDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    initZoom=zoom_;
  }
},{passive:true});
document.getElementById('canvas-area').addEventListener('touchmove',e=>{
  if(e.touches.length===2){
    e.preventDefault();
    const dist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    zoom_=Math.min(3,Math.max(0.1,initZoom*(dist/initDist)));
    applyZoom();
  }
},{passive:false});
document.getElementById('canvas-area').addEventListener('touchend',e=>{
  // Al soltar el pinch, ocultar sel-box temporalmente para evitar posición incorrecta
  if(activeLayer) setTimeout(updateSelBox, 80);
},{passive:true});

// Tap en canvas vacío → deseleccionar
cvs.addEventListener('touchend', e=>{
  if(e.target===cvs){ e.preventDefault(); desel(); }
},{passive:false});
cvs.addEventListener('click', e=>{ if(e.target===cvs) desel(); });

function openSave(){
  const name = localStorage.getItem('ts_design_name')||'';
  document.getElementById('save-name').value = name;
  document.getElementById('save-st').textContent='';
  document.getElementById('save-overlay').classList.add('open');
}
function closeSave(){ document.getElementById('save-overlay').classList.remove('open'); }

async function doSave(){
  if(!fbDb||!fbAuth?.currentUser){ toast('✗ Sin sesión. Vuelve al inicio.'); return; }
  const name = document.getElementById('save-name').value.trim();
  if(!name){ document.getElementById('save-st').textContent='Escribe un nombre'; return; }

  const st = document.getElementById('save-st');
  st.textContent='Generando miniatura...';st.style.color='var(--muted)';

  // Miniatura
  let thumb='';
  try{
    desel();
    const savedT=cvs.style.transform; cvs.style.transform='scale(1)';
    await new Promise(r=>setTimeout(r,60));
    const cw=parseInt(cvs.style.width)||800;
    const sc=Math.min(1,320/cw);
    const tc=await html2canvas(cvs,{scale:sc,useCORS:true,allowTaint:true,backgroundColor:'#000',logging:false,width:cw,height:parseInt(cvs.style.height)||800});
    cvs.style.transform=savedT;
    const b64=tc.toDataURL('image/jpeg',0.8);
    st.textContent='Subiendo...';
    const fd=new FormData();
    fd.append('file',b64);fd.append('upload_preset',CLOUDINARY_PRESET);fd.append('folder','templatestudio');
    const res=await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD}/image/upload`,{method:'POST',body:fd});
    if(res.ok){ const d=await res.json(); thumb=d.secure_url||''; }
  }catch(e){ console.warn('Thumb error:',e.message); }

  // Layers data
  const layerData = layers.map(l=>({
    id:l.id,type:l.type,name:l.name,
    x:l.x,y:l.y,w:l.w,h:l.h,
    zIndex:l.zIndex,opacity:l.opacity,visible:l.visible,
    // Para frames: guardar src también como frameImage (compatibilidad con editor PC)
    src: (l.type==='frame') ? null : (l.src||null),
    frameImage: (l.type==='frame') ? (l.src||null) : null,
    tp:l.tp?{...l.tp}:null,
    fill:l.fill||null,shapeType:l.shapeType||null,
    frameRadius:l.frameRadius||null,
    // Guardar con nombres del editor PC Y legacy para máxima compatibilidad
    frameBorderWidth: l.frameBorderWidth || l.borderWidth || 0,
    frameBorderColor: l.frameBorderColor || l.borderColor || '#00ffc3',
    frameBorderStyle: 'inner',
    frameShadow: l.frameShadow || l.shadowBlur || 0,
    frameInnerShadow: l.frameInnerShadow || l.innerShadow || 0,
    // Legacy (por si acaso el PC los lee)
    borderWidth: l.frameBorderWidth || l.borderWidth || 0,
    borderColor: l.frameBorderColor || l.borderColor || '#00ffc3',
    shadowBlur: l.frameShadow || l.shadowBlur || 0,
    innerShadow: l.frameInnerShadow || l.innerShadow || 0,
    flipX:l.flipX||false,flipY:l.flipY||false,
    blur:l.blur||0,
    radius:l.radius||null,
    groupId:l.groupId||null
  }));

  const data={
    name,thumb,
    updatedAt:Date.now(),
    template:{type:'psd-layers',canvasW:parseInt(cvs.style.width),canvasH:parseInt(cvs.style.height),layers:layerData},
    tplId:tplId||null,
    uid:fbAuth.currentUser.uid
  };

  st.textContent='Guardando...';
  try{
    if(clientDesignId){
      await fbDb.collection('user_designs').doc(clientDesignId).update(data);
    } else {
      data.createdAt=Date.now();
      const ref=await fbDb.collection('user_designs').add(data);
      clientDesignId=ref.id;
      const u=new URL(window.location.href);
      u.searchParams.set('did',clientDesignId);
      window.history.replaceState({},'',u.toString());
    }
    localStorage.setItem('ts_design_name',name);
    st.textContent='✓ Guardado correctamente';st.style.color='var(--accent)';
    toast('✓ Diseño guardado');
    setTimeout(closeSave,1500);
  }catch(e){
    st.textContent='✗ Error: '+e.message;st.style.color='var(--red)';
  }
}

// DESCARGAR PNG — renderer Canvas 2D propio
// ══════════════════════════════════════════
function loadImgCors(src){
  return new Promise((res,rej)=>{
    if(!src){ res(null); return; }
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload  = ()=>res(img);
    img.onerror = ()=>{
      // retry sin crossOrigin por si el servidor no lo soporta
      const img2 = new Image();
      img2.onload  = ()=>res(img2);
      img2.onerror = ()=>res(null);
      img2.src = src;
    };
    img.src = src;
  });
}

function parseColor(str){
  // Devuelve [r,g,b,a] desde hex o rgba()
  if(!str) return [0,0,0,0];
  str = str.trim();
  if(str.startsWith('#')){
    let h = str.slice(1);
    if(h.length===3) h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    const n=parseInt(h,16);
    return [(n>>16)&255,(n>>8)&255,n&255,1];
  }
  const m = str.match(/rgba?\(([^)]+)\)/);
  if(m){
    const p=m[1].split(',').map(Number);
    return [p[0]||0,p[1]||0,p[2]||0,p[3]!==undefined?p[3]:1];
  }
  return [0,0,0,1];
}

function roundedRectPath(ctx, x, y, w, h, r){
  r = Math.min(r, w/2, h/2);
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);
  ctx.quadraticCurveTo(x+w, y, x+w, y+r);
  ctx.lineTo(x+w, y+h-r);
  ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  ctx.lineTo(x+r, y+h);
  ctx.quadraticCurveTo(x, y+h, x, y+h-r);
  ctx.lineTo(x, y+r);
  ctx.quadraticCurveTo(x, y, x+r, y);
  ctx.closePath();
}

async function downloadPNG(){
  toast('Generando PNG...');
  desel();
  await new Promise(r=>setTimeout(r,60));

  const CW = parseInt(cvs.style.width)  || 800;
  const CH = parseInt(cvs.style.height) || 800;
  const SCALE = 2;

  const canvas = document.createElement('canvas');
  canvas.width  = CW * SCALE;
  canvas.height = CH * SCALE;
  const ctx = canvas.getContext('2d');
  ctx.scale(SCALE, SCALE);

  // Ordenar capas por zIndex
  const sorted = [...layers]
    .filter(l => l.visible !== false)
    .sort((a,b) => (a.zIndex||0) - (b.zIndex||0));

  // Precargar todas las imágenes en paralelo
  const imgMap = {};
  await Promise.all(sorted.map(async l=>{
    if(l.type==='img' && l.src)       imgMap[l.id] = await loadImgCors(l.src);
    if(l.type==='frame' && l.src)     imgMap[l.id] = await loadImgCors(l.src);
  }));

  for(const l of sorted){
    ctx.save();
    ctx.globalAlpha = l.opacity ?? 1;

    const x=l.x, y=l.y, w=l.w, h=l.h;

    // ── SHAPE ──
    if(l.type==='shape'){
      ctx.save();
      const fill = l.fill || 'rgba(255,255,255,0.2)';
      if(l.shapeType==='circle'){
        ctx.beginPath();
        ctx.ellipse(x+w/2, y+h/2, w/2, h/2, 0, 0, Math.PI*2);
        ctx.fillStyle = fill; ctx.fill();
      } else if(l.shapeType==='triangle'){
        ctx.beginPath();
        ctx.moveTo(x+w/2, y); ctx.lineTo(x+w, y+h); ctx.lineTo(x, y+h);
        ctx.closePath();
        ctx.fillStyle = fill; ctx.fill();
      } else {
        const r = l.radius||0;
        roundedRectPath(ctx, x, y, w, h, r);
        ctx.fillStyle = fill; ctx.fill();
      }
      ctx.restore();

    // ── IMG ──
    } else if(l.type==='img'){
      const img = imgMap[l.id];
      if(img){
        ctx.save();
        // Flip
        if(l.flipX || l.flipY){
          ctx.translate(x + (l.flipX?w:0), y + (l.flipY?h:0));
          ctx.scale(l.flipX?-1:1, l.flipY?-1:1);
          // blur
          if(l.blur>0) ctx.filter = `blur(${l.blur}px)`;
          ctx.drawImage(img, 0, 0, w, h);
        } else {
          if(l.blur>0) ctx.filter = `blur(${l.blur}px)`;
          ctx.drawImage(img, x, y, w, h);
        }
        ctx.restore();
      }

    // ── FRAME ──
    } else if(l.type==='frame'){
      const radius = l.frameRadius || 0;
      const fBW    = Number(l.frameBorderWidth || l.borderWidth || 0);
      const fBC    = l.frameBorderColor || l.borderColor || '#00ffc3';
      const fSh    = Number(l.frameShadow    || l.shadowBlur  || 0);
      const fISh   = Number(l.frameInnerShadow || l.innerShadow || 0);

      ctx.save();

      // Sombra exterior
      if(fSh > 0){
        ctx.shadowColor   = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur    = fSh;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 4;
      }

      const img = imgMap[l.id];
      if(img){
        // Clip con border-radius
        roundedRectPath(ctx, x, y, w, h, radius);
        ctx.clip();
        ctx.shadowColor = 'transparent'; // evitar que sombra afecte la imagen
        // Flip
        if(l.flipX || l.flipY){
          ctx.translate(x+(l.flipX?w:0), y+(l.flipY?h:0));
          ctx.scale(l.flipX?-1:1, l.flipY?-1:1);
          if(l.blur>0) ctx.filter=`blur(${l.blur}px)`;
          ctx.drawImage(img, 0, 0, w, h);
        } else {
          if(l.blur>0) ctx.filter=`blur(${l.blur}px)`;
          ctx.drawImage(img, x, y, w, h);
        }
      } else {
        // Marco vacío: fondo semitransparente
        roundedRectPath(ctx, x, y, w, h, radius);
        ctx.fillStyle = 'rgba(21,214,164,0.08)';
        ctx.fill();
      }
      ctx.restore();

      // Borde del marco (outline = dibujado encima)
      if(fBW > 0){
        ctx.save();
        roundedRectPath(ctx, x, y, w, h, radius);
        ctx.strokeStyle = fBC;
        ctx.lineWidth   = fBW;
        ctx.stroke();
        ctx.restore();
      }

      // Inner shadow (dibujado encima con clip)
      if(fISh > 0){
        ctx.save();
        roundedRectPath(ctx, x, y, w, h, radius);
        ctx.clip();
        ctx.shadowColor   = 'rgba(0,0,0,0.7)';
        ctx.shadowBlur    = fISh;
        ctx.shadowOffsetX = 0;
        ctx.shadowOffsetY = 0;
        // Truco: dibujar un rect exterior grande con clip interior
        ctx.strokeStyle = 'rgba(0,0,0,0.7)';
        ctx.lineWidth   = fISh * 2;
        roundedRectPath(ctx, x, y, w, h, radius);
        ctx.stroke();
        ctx.restore();
      }

    // ── TEXT ──
    } else if(l.type==='text' && l.tp){
      const tp = l.tp;
      const fs = tp.fontSize || 24;
      const fw = tp.fontWeight || '400';
      const ff = (tp.fontFamily||'Poppins').replace(/'/g,'');
      const color = tp.color || '#ffffff';
      const align = tp.align || tp.textAlign || 'left';
      const italic = tp.italic ? 'italic ' : '';
      const lh = parseFloat(tp.lineHeight) || 1.2;
      const ls = parseFloat(tp.letterSpacing) || 0;
      const tt = tp.textTransform || 'none';
      const strokeW = parseInt(tp.strokeWidth||0);
      const strokeC = tp.strokeColor || '#000000';
      const shadowBlur_ = parseInt(tp.shadowBlur||0);
      const shadowC = tp.shadowColor || 'rgba(0,0,0,0.45)';

      ctx.save();
      ctx.font = `${italic}${fw} ${fs}px ${ff}`;
      ctx.textAlign = align==='center'?'center':align==='right'?'right':'left';
      ctx.textBaseline = 'top';

      // Text shadow
      if(shadowBlur_ > 0){
        ctx.shadowColor   = shadowC;
        ctx.shadowBlur    = shadowBlur_ * 0.8;
        ctx.shadowOffsetY = Math.max(1, Math.round(shadowBlur_*0.18));
      }

      // Texto multilinea
      let rawText = tp.text || '';
      if(tt==='uppercase') rawText = rawText.toUpperCase();
      else if(tt==='lowercase') rawText = rawText.toLowerCase();

      const lines = rawText.split('\n');
      const lineH = fs * lh;

      // textX según alineación
      const textX = align==='center' ? x+w/2 : align==='right' ? x+w : x;

      // Outer stroke como múltiples shadows
      if(strokeW > 0){
        ctx.shadowColor='transparent';
        ctx.strokeStyle = strokeC;
        ctx.lineWidth   = strokeW * 2;
        ctx.lineJoin    = 'round';
        let yOff = y;
        for(const line of lines){
          ctx.strokeText(line, textX, yOff);
          yOff += lineH;
        }
      }

      // Fill
      ctx.fillStyle = color;
      let yOff = y;
      for(const line of lines){
        ctx.fillText(line, textX, yOff);
        yOff += lineH;
      }

      // Underline manual
      if(tp.underline){
        ctx.save();
        ctx.strokeStyle = color;
        ctx.lineWidth = Math.max(1, fs*0.06);
        let yU = y;
        for(const line of lines){
          const tw = ctx.measureText(line).width;
          const ux = align==='center'?textX-tw/2:align==='right'?textX-tw:textX;
          ctx.beginPath();
          ctx.moveTo(ux, yU+fs+2);
          ctx.lineTo(ux+tw, yU+fs+2);
          ctx.stroke();
          yU += lineH;
        }
        ctx.restore();
      }

      ctx.restore();
    }

    ctx.restore(); // globalAlpha
  }

  // Descargar
  try{
    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.download = 'diseño.png';
    a.href = dataUrl;
    a.click();
    toast('✓ PNG descargado');
  }catch(e){
    console.warn('Download error:', e);
    toast('✗ Error al exportar');
  }
}

window.addEventListener('load', async()=>{
  showLoad('Conectando...');
  await initFB();

  // Esperar sesión
  const user = await new Promise(resolve=>{
    if(!fbAuth){ resolve(null); return; }
    let settled=false;
    const unsub=fbAuth.onAuthStateChanged(u=>{
      if(settled) return;
      if(!u&&!fbAuth.currentUser) return;
      settled=true;try{unsub();}catch(_){}
      resolve(u||fbAuth.currentUser||null);
    });
    setTimeout(()=>{ if(settled)return; settled=true; try{unsub();}catch(_){} resolve(fbAuth.currentUser||null); },8000);
  });

  if(!user){
    hideLoad();
    document.getElementById('load-text').textContent='';
    toast('✗ Sin sesión. Vuelve al inicio.');
    setTimeout(()=>window.location.href='index.html',2000);
    return;
  }

  const p=new URLSearchParams(window.location.search);
  tplId=p.get('tpl')||null;
  const did=p.get('did')||null;

  let loaded=false;

  // Cargar diseño guardado
  if(did&&fbDb){
    showLoad('Cargando tu diseño...');
    clientDesignId=did;
    try{
      const d=await fbDb.collection('user_designs').doc(did).get();
      if(d&&d.exists){
        const dd=d.data()||{};
        if(dd.name) localStorage.setItem('ts_design_name',dd.name);
        const pl=extractPayload(dd);
        if(pl){ loadDesign(pl); loaded=true; }
      }
    }catch(e){ console.warn('Error cargando diseño:',e); }
  }

  // Cargar desde plantilla base
  if(!loaded&&tplId&&fbDb){
    showLoad('Cargando plantilla...');
    try{
      const t=await fbDb.collection('templates').doc(tplId).get();
      if(t&&t.exists){
        const td=t.data()||{};
        const pl=extractPayload(td);
        if(pl){ loadDesign(pl); loaded=true; }
      }
    }catch(e){ console.warn('Error cargando plantilla:',e); }
  }

  hideLoad();

  if(!loaded){
    toast('⚠ No se pudo cargar el diseño');
  }
});
