<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseños Streaming - Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#08080f;--panel:#111118;--panel2:#1a1a24;--border:rgba(255,255,255,0.07);--accent:#00C896;--accent2:#FF6B6B;--blue:#4F8EF7;--yellow:#F5C842;--text:#eeeef5;--muted:#666;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* TOPBAR */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.logo{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.layout{display:flex;min-height:calc(100vh - 52px);}
.sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 0;}
.nav-item{padding:10px 20px;font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.03);}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(0,200,150,0.05);}

.content{flex:1;padding:32px;overflow-y:auto;}
.section{display:none;}
.section.active{display:block;}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:6px;}
.page-sub{font-size:0.82rem;color:var(--muted);margin-bottom:28px;}

/* BOTONES */
.btn{padding:9px 20px;border-radius:9px;border:none;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-green{background:var(--accent);color:#000;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-red{background:rgba(255,107,107,0.12);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}

/* GRID */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;}
.tpl-card{background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden;}
.tpl-thumb{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#000;}
.tpl-info{padding:16px;}
.tpl-name{font-size:0.9rem;font-weight:700;margin-bottom:10px;}
.tpl-actions{display:flex;gap:8px;}

.users-table{width:100%;border-collapse:collapse;margin-top:10px;}
.users-table th{text-align:left;font-size:0.7rem;color:var(--muted);padding:10px;border-bottom:1px solid var(--border);}
.users-table td{padding:12px 10px;font-size:0.8rem;border-bottom:1px solid rgba(255,255,255,0.03);}

.status-msg{font-size:0.78rem;padding:10px 14px;border-radius:8px;margin-top:10px;display:none;}
.status-ok{background:rgba(0,200,150,0.1);color:var(--accent);border:1px solid rgba(0,200,150,0.2);}
.status-err{background:rgba(255,107,107,0.1);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="admin-login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:40px;width:350px;">
    <div style="text-align:center;margin-bottom:30px;">
        <div style="font-size:1.5rem;font-weight:800;color:var(--accent);">Diseños Streaming</div>
        <div style="font-size:0.8rem;color:var(--muted);">Panel de Control</div>
    </div>
    <div style="margin-bottom:12px;">
        <input type="email" id="admin-email" style="width:100%; background:var(--panel2); border:1px solid var(--border); padding:10px; border-radius:8px; color:#fff;" placeholder="Email">
    </div>
    <div style="margin-bottom:12px;">
        <input type="password" id="admin-pass" style="width:100%; background:var(--panel2); border:1px solid var(--border); padding:10px; border-radius:8px; color:#fff;" placeholder="Contraseña">
    </div>
    <div id="admin-login-err" style="color:var(--accent2);font-size:0.75rem;margin-bottom:15px;text-align:center;"></div>
    <button onclick="doAdminLogin()" class="btn btn-green" style="width:100%;">Entrar al Panel</button>
  </div>
</div>

<div id="admin-main" style="display:none;">
    <div class="topbar">
        <div class="logo">DISEÑOS STREAMING ADMIN</div>
        <button onclick="logout()" class="btn btn-red" style="padding:5px 12px;font-size:0.7rem;">Cerrar Sesión</button>
    </div>

    <div class="layout">
        <div class="sidebar">
            <div class="nav-item active" onclick="showSection('templates')">📦 Mis Plantillas</div>
            <div class="nav-item" onclick="showSection('users')">👥 Gestión Clientes</div>
        </div>

        <div class="content">
            <div class="section active" id="section-templates">
                <div class="page-title">Catálogo de Plantillas</div>
                <div style="margin-bottom:25px;">
                    <button class="btn btn-blue" onclick="window.open('paginaeditprueba.html?mode=admin', '_blank')">+ Crear Nueva Plantilla</button>
                </div>
                <div id="templates-grid" class="tpl-grid"></div>
            </div>

            <div class="section" id="section-users">
                <div class="page-title">Gestión de Clientes</div>
                <div id="users-list-wrap"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978",
  measurementId: "G-NX5226C0P4"
};

let fbApp, fbAuth, fbDb;

async function initFB() {
  if (!firebase.apps.length) fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  else fbApp = firebase.app();
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
}

window.addEventListener('load', async () => {
  await initFB();
  fbAuth.onAuthStateChanged(async (user) => {
    if (user) {
      const adminDoc = await fbDb.collection('admins').doc(user.uid).get();
      if (adminDoc.exists) {
        document.getElementById('admin-login-screen').style.display = 'none';
        document.getElementById('admin-main').style.display = 'block';
        loadTemplates();
        loadUsers();
      } else { await fbAuth.signOut(); }
    }
  });
});

async function doAdminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  const err = document.getElementById('admin-login-err');
  try {
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    const adminDoc = await fbDb.collection('admins').doc(cred.user.uid).get();
    if(!adminDoc.exists){ await fbAuth.signOut(); err.textContent = '✗ No eres admin'; return; }
  } catch (e) { err.textContent = '✗ Datos incorrectos'; }
}

async function loadTemplates() {
  const grid = document.getElementById('templates-grid');
  try {
    const snap = await fbDb.collection('templates').orderBy('updatedAt', 'desc').get();
    grid.innerHTML = '';
    snap.forEach(doc => {
      const t = doc.data();
      const div = document.createElement('div');
      div.className = 'tpl-card';
      div.innerHTML = `
        <img class="tpl-thumb" src="${t.thumb || ''}">
        <div class="tpl-info">
          <div class="tpl-name">${t.name}</div>
          <div class="tpl-actions">
            <button class="btn btn-blue" style="font-size:0.7rem;" onclick="editTemplate('${doc.id}')">Editar (Jefe)</button>
            <button class="btn btn-red" style="font-size:0.7rem;" onclick="deleteTemplate('${doc.id}')">Borrar</button>
          </div>
        </div>`;
      grid.appendChild(div);
    });
  } catch(e) { grid.innerHTML = 'Error cargando plantillas.'; }
}

function editTemplate(id) {
    // ESTO ASEGURA QUE SE ABRA TU ARCHIVO DE 4000 LINEAS COMO ADMIN
    window.location.href = `paginaeditprueba.html?tpl=${id}&mode=admin`;
}

async function loadUsers() {
    const wrap = document.getElementById('users-list-wrap');
    try {
        const snap = await fbDb.collection('users').get();
        let html = '<table class="users-table"><tr><th>Email</th><th>Acción</th></tr>';
        snap.forEach(doc => {
            html += `<tr><td>${doc.data().email}</td><td><button onclick="deleteUserDoc('${doc.id}')" style="color:#FF6B6B; background:none; border:none; cursor:pointer;">Eliminar</button></td></tr>`;
        });
        wrap.innerHTML = html + '</table>';
    } catch(e) { wrap.innerHTML = 'Error usuarios.'; }
}

function showSection(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById('section-' + id).classList.add('active');
}

async function deleteTemplate(id) { if(confirm('¿Borrar?')) { await fbDb.collection('templates').doc(id).delete(); loadTemplates(); } }
async function logout() { await fbAuth.signOut(); window.location.reload(); }
</script>
</body>
</html>
