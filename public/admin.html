<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseños Streaming - Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#08080f;--panel:#111118;--panel2:#1a1a24;--border:rgba(255,255,255,0.07);--accent:#00C896;--accent2:#FF6B6B;--blue:#4F8EF7;--yellow:#F5C842;--text:#eeeef5;--muted:#666;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* TOPBAR */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.logo{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.badge{padding:3px 10px;border-radius:100px;font-size:0.7rem;font-weight:700;background:rgba(255,107,107,0.15);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}

/* LAYOUT */
.layout{display:flex;min-height:calc(100vh - 52px);}
.sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 0;}
.nav-item{padding:10px 20px;font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;}
.nav-item:hover{color:var(--text);background:rgba(255,255,255,0.03);}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(0,200,150,0.05);}
.nav-sep{margin:8px 20px;border:none;border-top:1px solid var(--border);}

.content{flex:1;padding:28px 28px;overflow-y:auto;}
.section{display:none;}
.section.active{display:block;}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:6px;}
.page-sub{font-size:0.82rem;color:var(--muted);margin-bottom:28px;}

/* CARDS GRID */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:28px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:22px;}
.card-title{font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:14px;}

/* FORM */
.f-row{margin-bottom:12px;}
.f-label{font-size:0.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;}
.f-input{width:100%;background:var(--panel2);border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;transition:border-color 0.2s;}
.f-input:focus{border-color:var(--accent);}
.f-hint{font-size:0.7rem;color:var(--muted);margin-top:4px;line-height:1.4;}

/* BUTTONS */
.btn{padding:9px 20px;border-radius:9px;border:none;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-green{background:var(--accent);color:#000;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-ghost{background:var(--panel2);color:var(--text);border:1px solid var(--border);}
.btn-red{background:rgba(255,107,107,0.12);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-full{width:100%;padding:12px;}

/* STATUS */
.status-msg{font-size:0.78rem;padding:10px 14px;border-radius:8px;margin-top:10px;display:none;}
.status-ok{background:rgba(0,200,150,0.1);color:var(--accent);border:1px solid rgba(0,200,150,0.2);}
.status-err{background:rgba(255,107,107,0.1);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}

/* USERS TABLE */
.users-table{width:100%;border-collapse:collapse;}
.users-table th{text-align:left;font-size:0.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:8px 12px;border-bottom:1px solid var(--border);}
.users-table td{padding:12px 12px;font-size:0.82rem;border-bottom:1px solid rgba(255,255,255,0.04);}
.users-table tr:hover td{background:rgba(255,255,255,0.02);}
.pill{display:inline-block;padding:3px 10px;border-radius:100px;font-size:0.68rem;font-weight:700;}
.pill-green{background:rgba(0,200,150,0.12);color:var(--accent);}

/* TEMPLATES GRID */
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.tpl-card{background:var(--panel);border:1px solid var(--border);border-radius:14px;overflow:hidden;transition:border-color 0.2s;}
.tpl-thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--panel2);}
.tpl-thumb-ph{width:100%;aspect-ratio:1;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:2rem;}
.tpl-info{padding:10px 12px;}
.tpl-name{font-size:0.78rem;font-weight:700;margin-bottom:3px;}
.tpl-date{font-size:0.68rem;color:var(--muted);margin-bottom:8px;}
.tpl-actions{display:flex;gap:6px;}
.tpl-actions button{flex:1;padding:5px;border-radius:6px;border:none;font-family:inherit;font-size:0.7rem;font-weight:600;cursor:pointer;transition:all 0.2s;}

/* FIREBASE STATUS */
.fb-status-bar{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--panel2);border-radius:10px;margin-bottom:20px;font-size:0.82rem;}
.fb-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}
.fb-dot.connected{background:var(--accent);}
.fb-dot.disconnected{background:var(--accent2);}

/* SPINNER */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.15);border-top-color:var(--accent);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* STEP GUIDE */
.step-list{display:flex;flex-direction:column;gap:12px;margin-bottom:24px;}
.step{display:flex;gap:14px;align-items:flex-start;}
.step-num{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#000;font-weight:800;font-size:0.78rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.step-text{font-size:0.82rem;line-height:1.6;color:var(--muted);}
.step-text strong{color:var(--text);}
.step-text a{color:var(--accent);text-decoration:none;}
.code-block{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-family:monospace;font-size:0.78rem;color:#adf;margin:6px 0;white-space:pre-wrap;word-break:break-all;}
</style>
</head>
<body>

<div id="admin-login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:36px 32px;width:340px;max-width:94vw;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:28px;">
      <span style="font-size:1.3rem;font-weight:800;color:var(--accent);">Diseños Streaming</span>
    </div>
    <div style="font-size:0.8rem;color:var(--muted);margin-bottom:28px;">Panel de administración</div>
    <div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px;">Email admin</div>
    <input type="email" id="admin-email" placeholder="admin@ts.app" value="admin@ts.app"
      style="width:100%;margin-bottom:12px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;">
    <div style="font-size:0.72rem;color:var(--muted);margin-bottom:6px;">Contraseña</div>
    <input type="password" id="admin-pass" placeholder="••••••••"
      style="width:100%;margin-bottom:16px;background:var(--panel2);border:1px solid var(--border);border-radius:9px;padding:10px 12px;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;">
    <button onclick="doAdminLogin()" id="admin-login-btn" class="btn btn-green btn-full">Entrar</button>
    <div id="admin-login-err" style="margin-top:10px;font-size:0.78rem;color:#ff6b6b;text-align:center;"></div>
  </div>
</div>

<div id="admin-main" style="display:none;">
<div class="topbar">
  <div class="logo">Diseños Streaming</div>
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="admin-user-email" style="font-size:0.75rem;color:var(--muted);"></span>
    <span class="badge">⚙ ADMIN</span>
    <button onclick="doAdminLogout()" style="background:none;border:1px solid var(--border);color:var(--muted);padding:4px 10px;border-radius:6px;font-size:0.72rem;cursor:pointer;">Salir</button>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="nav-item active" onclick="showSection('setup')">🔥 Configurar Firebase</div>
    <div class="nav-item" onclick="showSection('users')">👥 Crear usuarios</div>
    <div class="nav-item" onclick="showSection('templates')">📦 Mis plantillas</div>
  </div>

  <div class="content">
    <div class="section active" id="section-setup">
      <div class="page-title">🔥 Configuración Firebase</div>
      <div class="fb-status-bar" id="fb-status-bar">
        <div class="fb-dot disconnected" id="fb-dot"></div>
        <span id="fb-status-text">No conectado</span>
      </div>

      <div class="cards-grid">
        <div class="card">
          <div class="card-title">🔑 Credenciales Firebase</div>
          <div class="f-row"><label class="f-label">API Key</label><input class="f-input" id="fb-apiKey"></div>
          <div class="f-row"><label class="f-label">Auth Domain</label><input class="f-input" id="fb-authDomain"></div>
          <div class="f-row"><label class="f-label">Project ID</label><input class="f-input" id="fb-projectId"></div>
          <div class="f-row"><label class="f-label">Storage Bucket</label><input class="f-input" id="fb-storageBucket"></div>
          <div class="f-row"><label class="f-label">Messaging Sender ID</label><input class="f-input" id="fb-messagingSenderId"></div>
          <div class="f-row"><label class="f-label">App ID</label><input class="f-input" id="fb-appId"></div>
          <button class="btn btn-green btn-full" id="fb-connect-btn" onclick="connectFirebase()">Guardar y conectar</button>
          <div class="status-msg" id="fb-connect-status"></div>
        </div>
      </div>
    </div>

    <div class="section" id="section-users">
      <div class="page-title">👥 Gestión de usuarios</div>
      <div class="cards-grid">
        <div class="card">
          <div class="card-title">➕ Crear nuevo usuario</div>
          <div class="f-row"><label class="f-label">Correo Gmail del cliente</label><input class="f-input" id="new-user-email" type="email"></div>
          <div class="f-row"><label class="f-label">Contraseña</label><input class="f-input" id="new-user-pass" type="text"></div>
          <div class="f-row"><label class="f-label">Nombre (opcional)</label><input class="f-input" id="new-user-name"></div>
          <button class="btn btn-green btn-full" id="create-user-btn" onclick="createUser()">+ Crear cuenta</button>
          <div class="status-msg" id="create-user-status"></div>
        </div>
      </div>
      <div class="card">
        <div class="card-title">Usuarios registrados</div>
        <div id="users-table-wrap"></div>
      </div>
    </div>

    <div class="section" id="section-templates">
      <div class="page-title">📦 Mis Plantillas</div>
      <div style="margin-bottom:20px;">
        <a href="editor.html" target="_blank"><button class="btn btn-green">+ Crear nueva plantilla</button></a>
      </div>
      <div id="templates-grid-admin" class="tpl-grid"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

<script>
// CONFIGURACIÓN ACTUALIZADA CON TUS DATOS
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978"
};

let fbApp, fbDb, fbAuth, fbConnected = false;

async function initFB(config){
  try{
    if (firebase.apps.length === 0) {
        fbApp = firebase.initializeApp(config);
    } else {
        fbApp = firebase.app();
    }
    fbDb = firebase.firestore();
    fbAuth = firebase.auth();
    fbConnected = true;
    document.getElementById('fb-dot').className = 'fb-dot connected';
    document.getElementById('fb-status-text').textContent = '✓ Conectado';
    return true;
  } catch(e) {
    console.error(e);
    return false;
  }
}

// VIGILANTE DE SESIÓN (AUTO-LOGIN)
window.addEventListener('load', async () => {
  // Llenar inputs visuales
  document.getElementById('fb-apiKey').value = FIREBASE_CONFIG.apiKey;
  document.getElementById('fb-authDomain').value = FIREBASE_CONFIG.authDomain;
  document.getElementById('fb-projectId').value = FIREBASE_CONFIG.projectId;
  document.getElementById('fb-storageBucket').value = FIREBASE_CONFIG.storageBucket;
  document.getElementById('fb-messagingSenderId').value = FIREBASE_CONFIG.messagingSenderId;
  document.getElementById('fb-appId').value = FIREBASE_CONFIG.appId;

  const savedCfg = localStorage.getItem('ts_firebase_config');
  const cfg = savedCfg ? JSON.parse(savedCfg) : FIREBASE_CONFIG;

  await initFB(cfg);

  // Escuchar si ya hay usuario logueado
  fbAuth.onAuthStateChanged(async (user) => {
    if (user) {
      try {
        const adminDoc = await fbDb.collection('admins').doc(user.uid).get();
        if (adminDoc.exists) {
          // ES ADMIN: Entrar directo
          document.getElementById('admin-login-screen').style.display = 'none';
          document.getElementById('admin-main').style.display = 'block';
          document.getElementById('admin-user-email').textContent = user.email || '';
          loadUsers();
          loadTemplates();
        } else {
          // No es admin, cerrar sesión
          await fbAuth.signOut();
        }
      } catch (e) { console.error(e); }
    } else {
      // No hay sesión activa
      document.getElementById('admin-login-screen').style.display = 'flex';
      document.getElementById('admin-main').style.display = 'none';
    }
  });
});

async function doAdminLogin(){
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  const btn = document.getElementById('admin-login-btn');
  const err = document.getElementById('admin-login-err');

  if(!email || !pass) return;
  btn.textContent = 'Entrando...'; btn.disabled = true;

  try {
    // Activar persistencia LOCAL para que el navegador te recuerde siempre
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    
    const adminDoc = await fbDb.collection('admins').doc(cred.user.uid).get();
    if(!adminDoc.exists) {
        await fbAuth.signOut();
        throw new Error('No tienes permisos de administrador');
    }
    // El listener onAuthStateChanged hará el resto
  } catch(e) {
    err.textContent = '✗ ' + e.message;
    btn.textContent = 'Entrar'; btn.disabled = false;
  }
}

function doAdminLogout(){
  fbAuth.signOut();
  localStorage.removeItem('ts_admin_email');
  location.reload();
}

async function connectFirebase(){
  const config = {
    apiKey: document.getElementById('fb-apiKey').value,
    authDomain: document.getElementById('fb-authDomain').value,
    projectId: document.getElementById('fb-projectId').value,
    storageBucket: document.getElementById('fb-storageBucket').value,
    messagingSenderId: document.getElementById('fb-messagingSenderId').value,
    appId: document.getElementById('fb-appId').value,
  };
  localStorage.setItem('ts_firebase_config', JSON.stringify(config));
  location.reload();
}

// ============ GESTIÓN DE USUARIOS ============
async function createUser(){
  if(!fbConnected) return;
  const email = document.getElementById('new-user-email').value.trim();
  const pass = document.getElementById('new-user-pass').value.trim();
  const name = document.getElementById('new-user-name').value.trim();
  if(!email || pass.length < 6) return;

  const btn = document.getElementById('create-user-btn');
  btn.disabled = true;

  try {
    // Nota: Crear en Auth requiere API o Admin SDK, aquí guardamos el perfil en Firestore
    const res = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=${FIREBASE_CONFIG.apiKey}`, {
      method: 'POST',
      body: JSON.stringify({ email, password: pass, returnSecureToken: true })
    });
    const data = await res.json();
    if(!res.ok) throw new Error(data.error.message);

    await fbDb.collection('users').doc(data.localId).set({
      uid: data.localId,
      email: email,
      name: name || email,
      createdAt: Date.now()
    });

    showStatus('create-user-status', '✓ Usuario creado', 'ok');
    loadUsers();
  } catch(e) {
    showStatus('create-user-status', e.message, 'err');
  }
  btn.disabled = false;
}

async function loadUsers(){
  if(!fbConnected) return;
  const wrap = document.getElementById('users-table-wrap');
  try {
    const snap = await fbDb.collection('users').get();
    let rows = '';
    snap.forEach(doc => {
      const d = doc.data();
      rows += `<tr><td>${d.email}</td><td>${d.name}</td><td><button class="btn btn-red" onclick="deleteUser('${doc.id}')">Borrar</button></td></tr>`;
    });
    wrap.innerHTML = `<table class="users-table"><tr><th>Email</th><th>Nombre</th><th>Acción</th></tr>${rows}</table>`;
  } catch(e) { wrap.innerHTML = 'Error al cargar.'; }
}

async function deleteUser(id){
  if(!confirm('¿Borrar usuario?')) return;
  await fbDb.collection('users').doc(id).delete();
  loadUsers();
}

// ============ GESTIÓN DE PLANTILLAS ============
async function loadTemplates(){
  if(!fbConnected) return;
  const grid = document.getElementById('templates-grid-admin');
  try {
    const snap = await fbDb.collection('templates').orderBy('updatedAt','desc').get();
    grid.innerHTML = '';
    snap.forEach(doc => {
      const d = doc.data();
      const isDraft = d.status === 'draft';
      const card = document.createElement('div');
      card.className = 'tpl-card';
      card.innerHTML = `
        <img class="tpl-thumb" src="${d.thumb || ''}">
        <div class="tpl-info">
          <div class="tpl-name">${d.name}</div>
          <div class="tpl-actions">
            <button onclick="editTemplate('${doc.id}')">✏</button>
            <button onclick="deleteTpl('${doc.id}')">🗑</button>
            <button onclick="${isDraft ? `publishTemplate('${doc.id}')` : `draftTemplate('${doc.id}')`}">${isDraft ? '🚀' : '📁'}</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  } catch(e) { console.error(e); }
}

function editTemplate(id){ window.open('editor.html?tpl=' + id, '_blank'); }

async function deleteTpl(id){
  if(!confirm('¿Borrar plantilla?')) return;
  await fbDb.collection('templates').doc(id).delete();
  loadTemplates();
}

async function publishTemplate(id){
  await fbDb.collection('templates').doc(id).update({ status: 'published' });
  loadTemplates();
}

async function draftTemplate(id){
  await fbDb.collection('templates').doc(id).update({ status: 'draft' });
  loadTemplates();
}

function showSection(id){
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('section-' + id).classList.add('active');
  event.currentTarget.classList.add('active');
}

function showStatus(id, msg, type){
  const el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
  el.className = 'status-msg status-' + type;
  setTimeout(() => el.style.display = 'none', 3000);
}
</script>
</body>
</html>
