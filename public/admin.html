<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diseños Streaming - Panel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--bg:#08080f;--panel:#111118;--panel2:#1a1a24;--border:rgba(255,255,255,0.07);--accent:#00C896;--accent2:#FF6B6B;--blue:#4F8EF7;--yellow:#F5C842;--text:#eeeef5;--muted:#666;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:100;}
.logo{font-size:1rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

.layout{display:flex;min-height:calc(100vh - 52px);}
.sidebar{width:220px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);padding:20px 0;}
.nav-item{padding:10px 20px;font-size:0.82rem;font-weight:600;color:var(--muted);cursor:pointer;transition:all 0.2s;border-left:3px solid transparent;}
.nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(0,200,150,0.05);}

.content{flex:1;padding:28px 28px;overflow-y:auto;}
.section{display:none;}
.section.active{display:block;}
.page-title{font-size:1.3rem;font-weight:700;margin-bottom:6px;}

.f-row{margin-bottom:12px;}
.f-label{font-size:0.72rem;font-weight:600;color:var(--muted);margin-bottom:5px;display:block;}
.f-input{width:100%;background:var(--panel2);border:1.5px solid var(--border);border-radius:9px;padding:10px 14px;color:var(--text);font-family:inherit;font-size:0.85rem;outline:none;}

.btn{padding:9px 20px;border-radius:9px;border:none;font-family:inherit;font-size:0.82rem;font-weight:700;cursor:pointer;transition:all 0.2s;}
.btn-green{background:var(--accent);color:#000;}
.btn-full{width:100%;padding:12px;}

.status-msg{font-size:0.78rem;padding:10px 14px;border-radius:8px;margin-top:10px;display:none;}
.status-ok{background:rgba(0,200,150,0.1);color:var(--accent);border:1px solid rgba(0,200,150,0.2);}
.status-err{background:rgba(255,107,107,0.1);color:var(--accent2);border:1px solid rgba(255,107,107,0.2);}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-right:8px;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>

<div id="admin-login-screen" style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg);">
  <div style="background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:40px;width:350px;max-width:90%;">
    <div style="text-align:center;margin-bottom:30px;">
        <div style="font-size:1.5rem;font-weight:800;color:var(--accent);margin-bottom:5px;">Diseños Streaming</div>
        <div style="font-size:0.8rem;color:var(--muted);">Panel de Control</div>
    </div>
    <div class="f-row">
        <label class="f-label">Email</label>
        <input type="email" id="admin-email" class="f-input" placeholder="admin@ejemplo.com">
    </div>
    <div class="f-row">
        <label class="f-label">Contraseña</label>
        <input type="password" id="admin-pass" class="f-input" placeholder="••••••••">
    </div>
    <div id="admin-login-err" style="color:var(--accent2);font-size:0.75rem;margin-bottom:15px;text-align:center;line-height:1.4;"></div>
    <button id="admin-login-btn" onclick="doAdminLogin()" class="btn btn-green btn-full">Entrar al Panel</button>
  </div>
</div>

<div id="admin-main" style="display:none;">
    <div class="topbar">
        <div class="logo">DISEÑOS STREAMING ADMIN</div>
        <button onclick="logout()" class="btn btn-red" style="padding:5px 12px;font-size:0.7rem; background:#FF6B6B; color:#fff;">Cerrar Sesión</button>
    </div>
    <div class="layout">
        <div class="sidebar">
            <div class="nav-item active">📦 Mis Plantillas</div>
        </div>
        <div class="content">
            <div class="page-title">Bienvenido al Panel</div>
            <p>Ya tienes acceso como administrador.</p>
        </div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978",
  measurementId: "G-NX5226C0P4"
};

let fbApp, fbAuth, fbDb;

async function initFB() {
  if (!firebase.apps.length) fbApp = firebase.initializeApp(FIREBASE_CONFIG);
  else fbApp = firebase.app();
  fbAuth = firebase.auth();
  fbDb = firebase.firestore();
}

window.addEventListener('load', async () => {
  await initFB();
  fbAuth.onAuthStateChanged(async (user) => {
    if (user) {
      const adminDoc = await fbDb.collection('admins').doc(user.uid).get();
      if (adminDoc.exists) {
        document.getElementById('admin-login-screen').style.display = 'none';
        document.getElementById('admin-main').style.display = 'block';
      } else {
        await fbAuth.signOut();
      }
    }
  });
});

async function doAdminLogin() {
  const email = document.getElementById('admin-email').value.trim();
  const pass = document.getElementById('admin-pass').value;
  const err = document.getElementById('admin-login-err');
  const btn = document.getElementById('admin-login-btn');

  if (!email || !pass) { err.textContent = '✗ Ingresa datos'; return; }
  btn.innerHTML = '<span class="spinner"></span> Verificando...'; btn.disabled = true;

  try {
    // CORRECCIÓN AQUÍ: Ruta completa para Firebase 8
    await fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    
    const adminDoc = await fbDb.collection('admins').doc(cred.user.uid).get();
    if(!adminDoc.exists){
        await fbAuth.signOut();
        err.textContent = '✗ No tienes permisos de administrador';
        btn.textContent = 'Entrar al Panel'; btn.disabled = false;
        return;
    }
    btn.textContent = 'Entrar al Panel'; btn.disabled = false;
  } catch (e) {
    console.error("Error completo:", e);
    err.textContent = '✗ Error: ' + e.message;
    btn.textContent = 'Entrar al Panel'; btn.disabled = false;
  }
}

async function logout() {
    await fbAuth.signOut();
    window.location.reload();
}
</script>
</body>
</html>
