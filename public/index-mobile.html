<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Diseños Streaming</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --bg:#f0f2f5;
  --surface:#ffffff;
  --surface2:#f7f8fa;
  --border:#e4e6ea;
  --accent:#7c5cfc;
  --accent-light:#ede9ff;
  --accent-dark:#5b3fdb;
  --green:#00c896;
  --green-light:#e6faf5;
  --red:#ff5c7a;
  --text:#1a1a2e;
  --text2:#4a4a6a;
  --muted:#9898b0;
  --shadow:0 2px 12px rgba(0,0,0,0.08);
  --shadow-lg:0 8px 32px rgba(0,0,0,0.12);
  --radius:12px;
  --radius-lg:16px;
}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;}

/* ── LOADING ── */
#app-loading{
  position:fixed;inset:0;background:var(--bg);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:9999;gap:16px;
}
.spin{width:40px;height:40px;border:3px solid rgba(124,92,252,0.15);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.load-txt{font-size:0.85rem;color:var(--muted);font-weight:500;}

/* ── SCREENS ── */
.screen{display:none;min-height:100vh;flex-direction:column;}
.screen.active{display:flex;}

/* ════════════════════════════════
   LOGIN
════════════════════════════════ */
#screen-login{
  align-items:center;justify-content:center;
  padding:24px 20px;
  background:var(--bg);
  position:relative;overflow:hidden;
}
#screen-login::before{
  content:'';position:absolute;
  width:400px;height:400px;
  background:radial-gradient(circle,rgba(124,92,252,0.12) 0%,transparent 70%);
  top:-80px;right:-80px;pointer-events:none;
}
.login-card{
  width:100%;max-width:400px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:24px;padding:36px 28px;
  box-shadow:var(--shadow-lg);position:relative;z-index:1;
}
.login-logo{
  font-size:1.4rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  margin-bottom:4px;display:flex;align-items:center;gap:8px;
}
.login-logo img{width:36px;height:36px;border-radius:10px;object-fit:contain;}
.login-sub{font-size:0.82rem;color:var(--muted);margin-bottom:28px;line-height:1.5;}
.login-label{font-size:0.72rem;font-weight:700;color:var(--text2);margin-bottom:6px;display:block;letter-spacing:0.3px;text-transform:uppercase;}
.login-field{
  width:100%;background:var(--surface2);
  border:1.5px solid var(--border);border-radius:var(--radius);
  padding:14px 16px;color:var(--text);font-family:inherit;font-size:1rem;
  outline:none;margin-bottom:14px;transition:border-color 0.2s;
}
.login-field:focus{border-color:var(--accent);}
.login-btn{
  width:100%;padding:15px;border-radius:var(--radius);border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;font-family:inherit;font-size:1rem;font-weight:700;
  cursor:pointer;margin-top:4px;
  box-shadow:0 4px 16px rgba(124,92,252,0.35);
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.login-btn:active{opacity:0.85;}
.login-err{font-size:0.78rem;color:var(--red);margin-top:10px;text-align:center;min-height:18px;font-weight:600;}

/* ════════════════════════════════
   DASHBOARD
════════════════════════════════ */
#screen-dash{background:var(--bg);}

/* Topbar */
.mob-topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;position:sticky;top:0;z-index:100;
  box-shadow:0 1px 0 var(--border);flex-shrink:0;
}
.mob-topbar-logo{
  font-size:1rem;font-weight:800;
  background:linear-gradient(135deg,var(--accent),var(--green));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  display:flex;align-items:center;gap:7px;
}
.mob-topbar-logo img{width:30px;height:30px;border-radius:8px;object-fit:contain;}
.mob-topbar-right{display:flex;align-items:center;gap:8px;}
.user-chip{
  display:flex;align-items:center;gap:6px;
  background:var(--surface2);border:1px solid var(--border);
  border-radius:100px;padding:5px 10px 5px 6px;
  font-size:0.72rem;color:var(--text2);font-weight:500;
  max-width:130px;
}
.user-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.user-avatar{
  width:22px;height:22px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--green));
  display:flex;align-items:center;justify-content:center;
  font-size:0.6rem;font-weight:700;color:#fff;
}
.logout-chip{
  padding:6px 12px;border-radius:100px;
  background:transparent;border:1.5px solid var(--border);
  color:var(--text2);font-family:inherit;font-size:0.72rem;font-weight:600;cursor:pointer;
}
.logout-chip:active{border-color:var(--red);color:var(--red);}

/* Tabs */
.dash-tabs{
  display:flex;background:var(--surface);
  border-bottom:2px solid var(--border);
  flex-shrink:0;position:sticky;top:56px;z-index:99;
}
.dash-tab{
  flex:1;padding:14px 8px;font-size:0.85rem;font-weight:700;
  text-align:center;cursor:pointer;color:var(--muted);
  border-bottom:3px solid transparent;margin-bottom:-2px;
  background:none;border-top:none;border-left:none;border-right:none;
  font-family:inherit;transition:all 0.2s;
}
.dash-tab.active{color:var(--accent);border-bottom-color:var(--accent);}

/* Tab content */
.tab-content{display:none;padding:16px 14px;}
.tab-content.active{display:block;}

/* Section title */
.sec-title{
  font-size:1rem;font-weight:800;margin-bottom:14px;
  display:flex;align-items:center;gap:8px;
}
.sec-count{
  font-size:0.68rem;font-weight:600;color:var(--muted);
  background:var(--surface2);border:1px solid var(--border);
  padding:2px 8px;border-radius:100px;
}

/* ── NEW DESIGN BUTTON ── */
.new-design-btn{
  width:100%;padding:16px;border-radius:var(--radius-lg);
  border:2px dashed var(--border);background:var(--surface);
  display:flex;align-items:center;gap:12px;
  cursor:pointer;margin-bottom:14px;transition:all 0.2s;color:var(--accent);
}
.new-design-btn:active{border-color:var(--accent);background:var(--accent-light);}
.new-design-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:var(--accent-light);display:flex;align-items:center;justify-content:center;
  font-size:1.4rem;
}
.new-design-label{font-size:0.9rem;font-weight:700;}

/* ── DESIGN CARDS (mis diseños) ── */
.designs-list{display:flex;flex-direction:column;gap:12px;}
.design-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;
  display:flex;gap:0;transition:box-shadow 0.2s;
}
.design-card:active{box-shadow:var(--shadow-lg);}
.design-thumb-wrap{width:90px;flex-shrink:0;}
.design-thumb{width:90px;height:90px;object-fit:cover;display:block;}
.design-thumb-empty{
  width:90px;height:90px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:2rem;
}
.design-body{flex:1;padding:12px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
.design-name{font-size:0.88rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px;}
.design-date{font-size:0.68rem;color:var(--muted);margin-bottom:10px;}
.design-actions{display:flex;gap:6px;}
.dact{
  flex:1;padding:8px 4px;border-radius:8px;border:none;
  font-family:inherit;font-size:0.72rem;font-weight:700;cursor:pointer;
}
.dact-edit{background:var(--accent-light);color:var(--accent);}
.dact-edit:active{background:var(--accent);color:#fff;}
.dact-dl{background:var(--green-light);color:var(--green);flex:0;padding:8px 10px;}
.dact-dl:active{background:var(--green);color:#fff;}
.dact-del{background:rgba(255,92,122,0.08);color:var(--red);flex:0;padding:8px 10px;border:none;border-radius:8px;font-family:inherit;font-size:0.72rem;cursor:pointer;}
.dact-del:active{background:var(--red);color:#fff;}

/* ── TEMPLATE CARDS ── */
.search-bar{
  display:flex;flex-direction:column;gap:8px;margin-bottom:14px;
}
.search-input-wrap{position:relative;}
.search-input-wrap span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:0.9rem;color:var(--muted);}
.search-inp{
  width:100%;padding:11px 12px 11px 36px;
  border-radius:var(--radius);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:0.9rem;
  outline:none;
}
.search-inp:focus{border-color:var(--accent);}
.cat-select{
  padding:11px 14px;border-radius:var(--radius);border:1.5px solid var(--border);
  background:var(--surface);color:var(--text);font-family:inherit;font-size:0.85rem;
  outline:none;width:100%;cursor:pointer;
}
.tpl-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tpl-card{
  background:var(--surface);border:1.5px solid var(--border);
  border-radius:var(--radius-lg);overflow:hidden;cursor:pointer;
  transition:box-shadow 0.2s;
}
.tpl-card:active{box-shadow:var(--shadow-lg);border-color:var(--accent);}
.tpl-thumb{width:100%;aspect-ratio:1;object-fit:cover;background:var(--surface2);display:block;}
.tpl-thumb-empty{
  width:100%;aspect-ratio:1;
  background:linear-gradient(135deg,var(--accent-light),var(--green-light));
  display:flex;align-items:center;justify-content:center;font-size:2rem;
}
.tpl-info{padding:10px 10px 12px;}
.tpl-name{font-size:0.78rem;font-weight:700;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tpl-date{font-size:0.65rem;color:var(--muted);margin-bottom:8px;}
.tpl-use-btn{
  width:100%;padding:9px;border-radius:8px;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent-dark));
  color:#fff;font-family:inherit;font-size:0.72rem;font-weight:700;cursor:pointer;
}
.tpl-use-btn:active{opacity:0.85;}

/* Empty & spinner */
.empty-state{text-align:center;padding:40px 20px;color:var(--muted);font-size:0.85rem;line-height:1.8;}
.spinner{
  display:inline-block;width:28px;height:28px;
  border:3px solid rgba(124,92,252,0.15);border-top-color:var(--accent);
  border-radius:50%;animation:sp 0.8s linear infinite;
}

/* Toast */
#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.85);color:#fff;
  padding:9px 20px;border-radius:999px;font-size:0.78rem;font-weight:600;
  z-index:9999;pointer-events:none;opacity:0;transition:opacity 0.3s;white-space:nowrap;
}

/* Confirm modal */
.overlay-confirm{
  position:fixed;inset:0;background:rgba(0,0,0,0.5);
  z-index:8000;display:flex;align-items:flex-end;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 0.2s;
}
.overlay-confirm.open{opacity:1;pointer-events:all;}
.confirm-sheet{
  background:var(--surface);border-radius:20px 20px 0 0;
  padding:24px 20px 36px;width:100%;max-width:480px;
}
.confirm-sheet h3{font-size:1rem;font-weight:800;margin-bottom:8px;}
.confirm-sheet p{font-size:0.82rem;color:var(--muted);margin-bottom:20px;}
.confirm-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.confirm-btn{padding:13px;border-radius:12px;border:none;font-family:inherit;font-weight:700;font-size:0.88rem;cursor:pointer;}
.confirm-cancel{background:var(--surface2);color:var(--text2);border:1px solid var(--border);}
.confirm-ok{background:var(--red);color:#fff;}
</style>
</head>

<div class="overlay-confirm" id="confirm-overlay">

      <button class="confirm-btn confirm-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="confirm-btn confirm-ok" id="confirm-ok-btn">Eliminar</button>
    </div>
  </div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ════════════════════════════════
// CONFIG
// ════════════════════════════════
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.firebasestorage.app",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978"
};

// ════════════════════════════════
// STATE
// ════════════════════════════════
let fbApp, fbDb, fbAuth;
let currentUser = null;
let allTemplates = [];
let pendingDeleteId = null;

// ════════════════════════════════
// UTILS
// ════════════════════════════════
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.style.opacity='0', 2500);
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function switchTab(tab){
  ['mis','tpl'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active', t===tab);
    document.getElementById('content-'+t).classList.toggle('active', t===tab);
  });
}

// ════════════════════════════════
// FIREBASE
// ════════════════════════════════
function loadScript(src){
  return new Promise((r,j)=>{
    if(document.querySelector(`script[src="${src}"]`)) return r();
    const s=document.createElement('script');
    s.src=src; s.onload=r; s.onerror=j;
    document.head.appendChild(s);
  });
}

async function initFirebase(){
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js');
  try{
    try{ fbApp = firebase.app('ts-client'); }
    catch(e){ fbApp = firebase.initializeApp(FIREBASE_CONFIG, 'ts-client'); }
    fbDb = firebase.firestore(fbApp);
    fbAuth = firebase.auth(fbApp);
    fbDb.enablePersistence({synchronizeTabs:true}).catch(()=>{});
    return true;
  }catch(e){ console.error(e); return false; }
}

// ════════════════════════════════
// INIT
// ════════════════════════════════
window.addEventListener('load', async()=>{
  document.getElementById('app-loading').style.display = 'flex';
  const ok = await initFirebase();
  if(!ok){
    document.getElementById('app-loading').style.display = 'none';
    showScreen('login');
    document.getElementById('login-err').textContent = '⚠ Error de conexión. Recarga la página.';
    return;
  }

  fbAuth.onAuthStateChanged(async user=>{
    if(user){
      try{
        const doc = await fbDb.collection('users').doc(user.uid).get();
        if(doc.exists && doc.data().active !== false){
          currentUser = {uid: user.uid, ...doc.data()};
          localStorage.setItem('ts_session', JSON.stringify(currentUser));
          // Check URL params
          const p = new URLSearchParams(window.location.search);
          if(p.get('tpl')) openEditorFromTemplate(p.get('tpl'));
          else showDashboard();
        } else {
          fbAuth.signOut();
          document.getElementById('app-loading').style.display = 'none';
          showScreen('login');
          document.getElementById('login-err').textContent = '✗ Cuenta desactivada.';
        }
      }catch(e){
        document.getElementById('app-loading').style.display = 'none';
        showScreen('login');
      }
    } else {
      document.getElementById('app-loading').style.display = 'none';
      showScreen('login');
    }
  });
});

// ════════════════════════════════
// LOGIN / LOGOUT
// ════════════════════════════════
async function doLogin(){
  const email = document.getElementById('login-email').value.trim();
  const pass  = document.getElementById('login-pass').value;
  const err   = document.getElementById('login-err');
  const btn   = document.getElementById('login-btn');
  const txt   = document.getElementById('login-btn-txt');
  err.textContent = '';
  if(!email || !email.includes('@')){ err.textContent = 'Ingresa tu correo Gmail'; return; }
  if(!pass){ err.textContent = 'Ingresa tu contraseña'; return; }
  btn.disabled = true;
  txt.innerHTML = '<div class="spinner" style="width:20px;height:20px;border-width:2px;border-top-color:#fff;border-color:rgba(255,255,255,0.3);display:inline-block;"></div>';
  try{
    await fbAuth.signInWithEmailAndPassword(email, pass);
    txt.textContent = 'Entrar'; btn.disabled = false;
  }catch(e){
    let msg = '✗ Correo o contraseña incorrectos';
    if(e.code==='auth/too-many-requests') msg = '✗ Demasiados intentos. Espera un momento.';
    if(e.code==='auth/user-disabled') msg = '✗ Cuenta desactivada.';
    err.textContent = msg;
    txt.textContent = 'Entrar'; btn.disabled = false;
  }
}

function doLogout(){
  if(!confirm('¿Cerrar sesión?')) return;
  fbAuth.signOut();
  localStorage.removeItem('ts_session');
  currentUser = null;
  showScreen('login');
}

// ════════════════════════════════
// DASHBOARD
// ════════════════════════════════
function showDashboard(){
  document.getElementById('app-loading').style.display = 'none';
  // Set user info
  const email = currentUser.email || '';
  document.getElementById('user-email-lbl').textContent = email.split('@')[0];
  document.getElementById('user-avatar').textContent = email[0]?.toUpperCase() || 'U';
  showScreen('dash');
  loadMyDesigns();
  loadTemplates();
}

// ════════════════════════════════
// MIS DISEÑOS
// ════════════════════════════════
async function loadMyDesigns(){
  const list = document.getElementById('my-designs-list');
  list.innerHTML = '<div class="empty-state"><div class="spinner"></div></div>';
  try{
    const snap = await fbDb.collection('user_designs')
      .where('uid','==',currentUser.uid)
      .orderBy('updatedAt','desc').get();
    list.innerHTML = '';
    const count = snap.size;
    document.getElementById('my-count').textContent = count + ' diseño' + (count!==1?'s':'');
    if(snap.empty){
      list.innerHTML = '<div class="empty-state">Aún no tienes diseños guardados.<br>¡Crea el primero!</div>';
      return;
    }
    snap.forEach(doc=>{
      list.appendChild(createDesignCard(doc.id, doc.data()));
    });
  }catch(e){
    list.innerHTML = `<div class="empty-state">Error al cargar: ${e.message}</div>`;
  }
}

function createDesignCard(id, d){
  const card = document.createElement('div');
  card.className = 'design-card';
  const date = new Date(d.updatedAt||d.createdAt).toLocaleDateString('es-PE');
  const name = d.name || 'Sin nombre';
  const thumb = d.thumb
    ? `<img class="design-thumb" src="${d.thumb}" alt="${name}" loading="lazy">`
    : `<div class="design-thumb-empty">🎨</div>`;
  card.innerHTML = `
    <div class="design-thumb-wrap">${thumb}</div>
    <div class="design-body">
      <div>
        <div class="design-name">${name}</div>
        <div class="design-date">${date}</div>
      </div>
      <div class="design-actions">
        <button class="dact dact-edit" onclick="openEditorDesign('${id}')">✏ Editar</button>
        <button class="dact dact-dl" onclick="quickDownload('${id}',this)" title="Descargar">⬇</button>
        <button class="dact-del" onclick="confirmDelete('${id}')" title="Eliminar">🗑</button>
      </div>
    </div>`;
  return card;
}

// Confirm delete sheet
function confirmDelete(id){
  pendingDeleteId = id;
  document.getElementById('confirm-overlay').classList.add('open');
  document.getElementById('confirm-ok-btn').onclick = ()=>doDelete();
}
function closeConfirm(){
  document.getElementById('confirm-overlay').classList.remove('open');
  pendingDeleteId = null;
}
async function doDelete(){
  if(!pendingDeleteId) return;
  closeConfirm();
  try{
    await fbDb.collection('user_designs').doc(pendingDeleteId).delete();
    toast('🗑 Diseño eliminado');
    loadMyDesigns();
  }catch(e){ toast('✗ Error: '+e.message); }
}

// Quick download (thumbnail)
async function quickDownload(id, btn){
  if(btn){ btn.textContent='...'; btn.disabled=true; }
  try{
    const doc = await fbDb.collection('user_designs').doc(id).get();
    const d = doc.data();
    if(d?.thumb){
      const a = document.createElement('a');
      a.href = d.thumb; a.download = (d.name||'diseño')+'.jpg';
      a.target = '_blank'; a.click();
    } else {
      toast('Sin miniatura disponible');
    }
  }catch(e){ toast('✗ Error'); }
  if(btn){ btn.textContent='⬇'; btn.disabled=false; }
}

// ════════════════════════════════
// PLANTILLAS
// ════════════════════════════════
async function loadTemplates(){
  const grid = document.getElementById('tpl-grid');
  grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="spinner"></div></div>';
  try{
    const snap = await fbDb.collection('templates')
      .where('status','==','published')
      .orderBy('createdAt','desc').get();
    allTemplates = [];
    snap.forEach(doc=>allTemplates.push({id:doc.id,...doc.data()}));
    document.getElementById('tpl-count').textContent = allTemplates.length + ' disponibles';
    renderTemplates(allTemplates);
  }catch(e){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1;">Error: ${e.message}</div>`;
  }
}

function filterTemplates(){
  const q = (document.getElementById('tpl-search').value||'').toLowerCase();
  const cat = document.getElementById('tpl-cat').value;
  const filtered = allTemplates.filter(t=>{
    const matchQ = !q || (t.name||'').toLowerCase().includes(q) || (t.category||'').toLowerCase().includes(q);
    const matchCat = !cat || t.category===cat;
    return matchQ && matchCat;
  });
  renderTemplates(filtered);
}

function renderTemplates(list){
  const grid = document.getElementById('tpl-grid');
  if(!list.length){
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">No se encontraron plantillas.</div>';
    return;
  }
  grid.innerHTML = '';
  list.forEach(t=>{
    const card = document.createElement('div');
    card.className = 'tpl-card';
    const date = t.createdAt ? new Date(t.createdAt).toLocaleDateString('es-PE') : '';
    const thumb = t.thumb
      ? `<img class="tpl-thumb" src="${t.thumb}" alt="${t.name||''}" loading="lazy">`
      : `<div class="tpl-thumb-empty">📦</div>`;
    card.innerHTML = `
      ${thumb}
      <div class="tpl-info">
        <div class="tpl-name">${t.name||'Plantilla'}</div>
        <div class="tpl-date">${date}</div>
        <button class="tpl-use-btn" onclick="openEditorFromTemplate('${t.id}')">Usar esta plantilla →</button>
      </div>`;
    grid.appendChild(card);
  });
}

// ════════════════════════════════
// EDITOR
// ════════════════════════════════
function openEditorBlank(){
  window.location.href = 'editor-mobile.html?mode=client';
}

async function openEditorDesign(id){
  const uid = currentUser?.uid||'';
  try{
    const doc = await fbDb.collection('user_designs').doc(id).get();
    const tplRef = doc.data()?.tplId||'';
    const url = `editor-mobile.html?mode=client&did=${id}&uid=${encodeURIComponent(uid)}${tplRef?'&tpl='+tplRef:''}`;
    window.location.href = url;
  }catch(e){
    window.location.href = `editor-mobile.html?mode=client&did=${id}&uid=${encodeURIComponent(uid)}`;
  }
}

function openEditorFromTemplate(tplId){
  const uid = currentUser?.uid||'';
  window.location.href = `editor-mobile.html?mode=client&tpl=${tplId}&uid=${encodeURIComponent(uid)}`;
}
</script>
