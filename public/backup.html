<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Backup — Diseños Streaming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --bg:#070b14;--panel:#0e1422;--panel2:#141c2f;
  --border:rgba(255,255,255,0.08);
  --accent:#15d6a4;--blue:#5b8cff;--red:#ff6b81;
  --text:#eef4ff;--muted:#93a0bb;
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:36px;width:100%;max-width:560px;}
.logo{font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--accent),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px;}
.subtitle{font-size:0.82rem;color:var(--muted);margin-bottom:28px;line-height:1.6;}
.section{background:var(--panel2);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
.section-title{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin-bottom:12px;}
.btn{
  width:100%;padding:13px;border-radius:12px;border:none;
  font-family:inherit;font-size:0.9rem;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  margin-bottom:8px;transition:opacity 0.2s;
}
.btn:last-child{margin-bottom:0;}
.btn:active{opacity:0.8;}
.btn:disabled{opacity:0.4;cursor:not-allowed;}
.btn-green{background:var(--accent);color:#002b22;}
.btn-blue{background:var(--blue);color:#fff;}
.btn-red{background:var(--red);color:#fff;}
.btn-ghost{background:rgba(255,255,255,0.06);color:var(--text);border:1px solid var(--border);}
.status{
  background:rgba(0,0,0,0.3);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;
  font-size:0.78rem;color:var(--muted);
  font-family:monospace;min-height:48px;margin-top:16px;
  white-space:pre-wrap;line-height:1.6;max-height:200px;overflow-y:auto;
}
.badge{
  display:inline-flex;align-items:center;gap:6px;
  background:rgba(21,214,164,0.12);border:1px solid rgba(21,214,164,0.25);
  border-radius:999px;padding:3px 10px;font-size:0.72rem;font-weight:700;
  color:var(--accent);margin-bottom:16px;
}
.badge.red{background:rgba(255,107,129,0.12);border-color:rgba(255,107,129,0.25);color:var(--red);}
#auth-section{display:block;}
#main-section{display:none;}
.login-field{
  width:100%;background:rgba(255,255,255,0.05);border:1px solid var(--border);
  border-radius:10px;padding:11px 14px;color:var(--text);font-family:inherit;
  font-size:0.9rem;outline:none;margin-bottom:10px;
}
.login-field:focus{border-color:var(--accent);}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:16px;}
.stat{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;}
.stat-n{font-size:1.4rem;font-weight:800;color:var(--accent);}
.stat-l{font-size:0.68rem;color:var(--muted);margin-top:2px;}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,0.2);border-top-color:#fff;border-radius:50%;animation:sp 0.7s linear infinite;flex-shrink:0;}
@keyframes sp{to{transform:rotate(360deg);}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<div class="card">
  <div class="logo">🔒 Backup & Restore</div>
  <div class="subtitle">Diseños Streaming — Solo acceso admin</div>

  <!-- AUTH -->
  <div id="auth-section">
    <div class="section">
      <div class="section-title">Iniciar sesión como admin</div>
      <input class="login-field" type="email" id="auth-email" placeholder="Email admin" autocomplete="email">
      <input class="login-field" type="password" id="auth-pass" placeholder="Contraseña" autocomplete="current-password"
        onkeydown="if(event.key==='Enter') doLogin()">
      <button class="btn btn-green" onclick="doLogin()" id="login-btn">Entrar</button>
    </div>
    <div class="status" id="auth-status">Ingresa tus credenciales de admin para continuar.</div>
  </div>

  <!-- MAIN -->
  <div id="main-section">
    <div class="badge" id="user-badge">✓ Admin conectado</div>

    <div class="stats">
      <div class="stat"><div class="stat-n" id="stat-tpl">—</div><div class="stat-l">Plantillas</div></div>
      <div class="stat"><div class="stat-n" id="stat-logos">—</div><div class="stat-l">Logos</div></div>
      <div class="stat"><div class="stat-n" id="stat-designs">—</div><div class="stat-l">Diseños</div></div>
    </div>

    <!-- EXPORT -->
    <div class="section">
      <div class="section-title">📦 Exportar backup</div>
      <button class="btn btn-green" onclick="exportAll()">
        ⬇ Descargar TODO (plantillas + logos + diseños)
      </button>
      <button class="btn btn-blue" onclick="exportTemplates()">
        ⬇ Solo plantillas
      </button>
      <button class="btn btn-ghost" onclick="exportLogos()">
        ⬇ Solo logos
      </button>
    </div>

    <!-- IMPORT -->
    <div class="section">
      <div class="section-title">📥 Importar backup</div>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="handleImport(this)">
      <button class="btn btn-ghost" onclick="document.getElementById('import-file').click()">
        📂 Seleccionar archivo JSON de backup
      </button>
      <div id="import-preview" style="display:none;margin-top:10px;font-size:0.78rem;color:var(--muted);"></div>
      <button class="btn btn-red" id="import-btn" style="display:none;margin-top:8px;" onclick="doImport()">
        ⚠ Importar (NO borra datos existentes, solo agrega)
      </button>
    </div>

    <div class="status" id="main-status">Listo. Selecciona una opción.</div>

    <button class="btn btn-ghost" style="margin-top:12px;" onclick="doLogout()">Cerrar sesión</button>
  </div>
</div>

<script>
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyA2zuPnReyy7eeTC8Lw_UfkfSg96-V5UnY",
  authDomain: "plantillas-bfaeb.firebaseapp.com",
  projectId: "plantillas-bfaeb",
  storageBucket: "plantillas-bfaeb.appspot.com",
  messagingSenderId: "382002543593",
  appId: "1:382002543593:web:87ad0a3b3c1f32b3daa978"
};
const ADMIN_UID = 'XFLqUqi70oSTcI4eNmwSHn6bMsH2';

let fbApp, fbDb, fbAuth;
let importData = null;

// ── UTILS ──
function log(msg, el='main-status'){
  const s = document.getElementById(el);
  s.textContent += (s.textContent ? '\n' : '') + msg;
  s.scrollTop = s.scrollHeight;
}
function clearLog(el='main-status'){ document.getElementById(el).textContent = ''; }

function loadScript(src){
  return new Promise((r,j)=>{
    if(document.querySelector(`script[src="${src}"]`)) return r();
    const s=document.createElement('script'); s.src=src; s.onload=r; s.onerror=j;
    document.head.appendChild(s);
  });
}

async function initFB(){
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js');
  await loadScript('https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js');
  try{
    try{ fbApp = firebase.app('ts-backup'); }
    catch(e){ fbApp = firebase.initializeApp(FIREBASE_CONFIG, 'ts-backup'); }
    fbDb = firebase.firestore(fbApp);
    fbAuth = firebase.auth(fbApp);
    return true;
  }catch(e){ return false; }
}

// ── LOGIN ──
async function doLogin(){
  const email = document.getElementById('auth-email').value.trim();
  const pass  = document.getElementById('auth-pass').value;
  const btn   = document.getElementById('login-btn');
  const st    = document.getElementById('auth-status');
  if(!email||!pass){ st.textContent='Completa email y contraseña.'; return; }
  btn.disabled = true;
  btn.innerHTML = '<div class="spin"></div> Conectando...';
  st.textContent = 'Iniciando sesión...';

  const ok = await initFB();
  if(!ok){ st.textContent='✗ Error iniciando Firebase.'; btn.disabled=false; btn.textContent='Entrar'; return; }

  try{
    const cred = await fbAuth.signInWithEmailAndPassword(email, pass);
    if(cred.user.uid !== ADMIN_UID){
      await fbAuth.signOut();
      st.textContent = '✗ No tienes permisos de admin.';
      btn.disabled=false; btn.innerHTML='Entrar'; return;
    }
    st.textContent = '✓ Conectado como admin.';
    document.getElementById('user-badge').textContent = '✓ ' + email;
    document.getElementById('auth-section').style.display = 'none';
    document.getElementById('main-section').style.display = 'block';
    loadStats();
  }catch(e){
    let msg = '✗ Email o contraseña incorrectos.';
    if(e.code==='auth/too-many-requests') msg='✗ Demasiados intentos.';
    st.textContent = msg;
    btn.disabled=false; btn.innerHTML='Entrar';
  }
}

function doLogout(){
  fbAuth?.signOut();
  document.getElementById('auth-section').style.display = 'block';
  document.getElementById('main-section').style.display = 'none';
  document.getElementById('auth-email').value='';
  document.getElementById('auth-pass').value='';
  document.getElementById('auth-status').textContent = 'Sesión cerrada.';
}

// ── STATS ──
async function loadStats(){
  try{
    const [tpl, logos, designs] = await Promise.all([
      fbDb.collection('templates').get(),
      fbDb.collection('logos').get(),
      fbDb.collection('user_designs').get()
    ]);
    document.getElementById('stat-tpl').textContent = tpl.size;
    document.getElementById('stat-logos').textContent = logos.size;
    document.getElementById('stat-designs').textContent = designs.size;
  }catch(e){ log('Error cargando stats: '+e.message); }
}

// ── EXPORT ──
async function fetchCollection(name){
  const snap = await fbDb.collection(name).get();
  const docs = [];
  snap.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
  return docs;
}

function downloadJSON(data, filename){
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

async function exportAll(){
  clearLog();
  log('Exportando TODO...');
  try{
    log('📦 Obteniendo plantillas...');
    const templates = await fetchCollection('templates');
    log(`  ✓ ${templates.length} plantillas`);

    log('🖼 Obteniendo logos...');
    const logos = await fetchCollection('logos');
    log(`  ✓ ${logos.length} logos`);

    log('🎨 Obteniendo diseños de clientes...');
    const designs = await fetchCollection('user_designs');
    log(`  ✓ ${designs.length} diseños`);

    log('🔑 Obteniendo admins...');
    const admins = await fetchCollection('admins');
    log(`  ✓ ${admins.length} admins`);

    const backup = {
      exportedAt: new Date().toISOString(),
      version: '1.0',
      project: 'plantillas-bfaeb',
      collections: { templates, logos, user_designs: designs, admins }
    };

    const filename = `backup_disenosstreaming_${new Date().toISOString().slice(0,10)}.json`;
    downloadJSON(backup, filename);
    log(`\n✅ Backup completo descargado: ${filename}`);
    log(`   Total: ${templates.length} plantillas, ${logos.length} logos, ${designs.length} diseños`);
  }catch(e){
    log('✗ Error: '+e.message);
  }
}

async function exportTemplates(){
  clearLog();
  log('Exportando solo plantillas...');
  try{
    const templates = await fetchCollection('templates');
    const backup = {
      exportedAt: new Date().toISOString(),
      version: '1.0',
      collections: { templates }
    };
    const filename = `backup_plantillas_${new Date().toISOString().slice(0,10)}.json`;
    downloadJSON(backup, filename);
    log(`✅ ${templates.length} plantillas exportadas: ${filename}`);
  }catch(e){ log('✗ Error: '+e.message); }
}

async function exportLogos(){
  clearLog();
  log('Exportando solo logos...');
  try{
    const logos = await fetchCollection('logos');
    const backup = {
      exportedAt: new Date().toISOString(),
      version: '1.0',
      collections: { logos }
    };
    const filename = `backup_logos_${new Date().toISOString().slice(0,10)}.json`;
    downloadJSON(backup, filename);
    log(`✅ ${logos.length} logos exportados: ${filename}`);
  }catch(e){ log('✗ Error: '+e.message); }
}

// ── IMPORT ──
function handleImport(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try{
      importData = JSON.parse(e.target.result);
      const cols = importData.collections || {};
      const summary = Object.entries(cols)
        .map(([k,v])=>`  • ${k}: ${v.length} documentos`)
        .join('\n');
      document.getElementById('import-preview').style.display = 'block';
      document.getElementById('import-preview').innerHTML =
        `<strong>Archivo:</strong> ${file.name}<br>` +
        `<strong>Exportado:</strong> ${importData.exportedAt||'desconocido'}<br>` +
        `<strong>Contenido:</strong><br>${summary.replace(/\n/g,'<br>')}`;
      document.getElementById('import-btn').style.display = 'flex';
    }catch(err){
      clearLog();
      log('✗ Archivo JSON inválido: '+err.message);
      importData = null;
    }
  };
  reader.readAsText(file);
}

async function doImport(){
  if(!importData){ log('No hay archivo cargado.'); return; }
  const btn = document.getElementById('import-btn');
  btn.disabled = true;
  clearLog();
  log('⚠ IMPORTANDO — NO borra datos existentes, solo agrega nuevos...\n');

  const cols = importData.collections || {};

  for(const [colName, docs] of Object.entries(cols)){
    if(!Array.isArray(docs) || docs.length === 0) continue;
    log(`\n📥 Importando ${colName} (${docs.length} docs)...`);
    let ok=0, skip=0, err=0;
    for(const doc of docs){
      const { id, ...data } = doc;
      if(!id){ skip++; continue; }
      try{
        // Check if already exists
        const existing = await fbDb.collection(colName).doc(id).get();
        if(existing.exists){
          log(`  ↷ ${id} ya existe, saltando`);
          skip++;
        } else {
          await fbDb.collection(colName).doc(id).set(data);
          ok++;
        }
      }catch(e){
        log(`  ✗ ${id}: ${e.message}`);
        err++;
      }
    }
    log(`  ✓ ${ok} importados, ${skip} saltados, ${err} errores`);
  }

  log('\n✅ Importación completada.');
  btn.disabled = false;
  loadStats();
}
</script>
</body>
</html>
